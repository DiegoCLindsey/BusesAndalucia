/* ------------------------------------------------------------------ */
/* Seguimiento: desde qué paradas miras tus salidas                     */
/* ------------------------------------------------------------------ */
/** Dónde está la persona, si lo ha compartido. Manda para elegir parada:
 * "el próximo autobús" es el que pasa por la parada a la que puedo
 * llegar andando, no por una que me pilla a cinco kilómetros. */
let UBICACION = null;

function distanciaA(paradaId) {
  const p = APP.data.paradas[paradaId];
  if (!UBICACION || !p || p.lat == null) return null;
  return haversine(UBICACION.lat, UBICACION.lng, p.lat, p.lng);
}

/** De qué paradas se puede coger cada línea que a la persona le importa.
 *
 * El orden de preferencia es el que tiene sentido para quien va a coger
 * el autobús: manda lo que ha marcado como suyo y, dentro de eso, lo que
 * tiene más cerca.
 *
 *   1. Líneas favoritas. Si además ha elegido paradas para esa línea,
 *      sólo esas; si no, cualquier parada por la que pase.
 *   2. Paradas favoritas: todas las líneas que pasan por ellas.
 *   3. Si no hay nada guardado, las paradas que tiene al lado.
 *
 * Luego, de cada línea se queda UNA parada —la más cercana de sus
 * candidatas—, así que la M-177 no ocupa cuatro filas repartidas por el
 * mapa. Eso sí, cada sentido va por su cuenta: la parada de ir y la de
 * volver son dos paradas distintas, y esconder una de las dos es
 * esconder justo la mitad que hace falta. */
const CANDIDATAS_CERCA = 8;    // paradas del entorno cuando no hay favoritos
const RADIO_MISMA_ESQUINA = 250; // metros: la parada de enfrente sigue siendo "aquí"

/** Por dónde coger una línea favorita cuando no se han elegido paradas:
 * la más cercana y las que están a su lado.
 *
 * Sólo la más cercana no vale, porque la parada de ir y la de volver son
 * dos paradas distintas a veinte metros una de otra, y quedarse con una
 * esconde justo el sentido que hace falta. Pero tampoco valen todas: la
 * M-170 tiene tres finales de trayecto distintos y sus paradas más
 * cercanas para dos de ellos están a once kilómetros, que no es una
 * parada a la que nadie vaya a ir andando. */
function paradasCercanasDeLinea(lineaSlug) {
  const nodo = GRAFO.lineas.get(lineaSlug);
  if (!nodo) return [];
  const conDistancia = [...nodo.paradas]
    .map(id => ({ id, dist: distanciaA(id) }))
    .filter(c => c.dist != null)
    .sort((a, b) => a.dist - b.dist);
  if (!conDistancia.length) return [];
  const corte = conDistancia[0].dist + RADIO_MISMA_ESQUINA;
  return conDistancia.filter(c => c.dist <= corte).map(c => c.id);
}

function candidatasDeSeguimiento() {
  const candidatas = [];   // {paradaId, lineaSlug|null}
  const vistas = new Set();
  const anotar = (paradaId, lineaSlug) => {
    const clave = paradaId + "|" + (lineaSlug || "*");
    if (vistas.has(clave) || !APP.data.paradas[paradaId]) return;
    vistas.add(clave);
    candidatas.push({ paradaId, lineaSlug });
  };

  FAVORITOS.lineas.forEach(fl => {
    const linea = APP.data.lineas.find(l => l.slug === fl.slug);
    if (!linea) return;
    const elegidas = (Array.isArray(fl.referencias) ? fl.referencias : [])
      .map(r => r.paradaId)
      .filter(id => APP.data.paradas[id]);
    // Mandan las paradas que se hayan elegido a mano; si no hay, la que
    // se tenga más cerca; y sin ubicación, por donde empieza cada
    // trayecto, que es lo único que se puede saber a ciegas.
    const deLaLinea = elegidas.length ? elegidas
      : (UBICACION ? paradasCercanasDeLinea(fl.slug)
                   : referenciasDeLinea(linea).map(r => r.paradaId));
    deLaLinea.forEach(id => anotar(id, fl.slug));
  });

  FAVORITOS.paradas.forEach(f => anotar(f.id, null));

  if (!candidatas.length && UBICACION) {
    Object.entries(APP.data.paradas)
      .filter(([, p]) => p.lat != null)
      .map(([id, p]) => ({ id, dist: haversine(UBICACION.lat, UBICACION.lng, p.lat, p.lng) }))
      .sort((a, b) => a.dist - b.dist)
      .slice(0, CANDIDATAS_CERCA)
      .forEach(c => anotar(c.id, null));
  }
  return candidatas;
}

/** Municipios desde los que la persona mira algo, para la fila de
 * filtros. Es justo el nivel "municipio" del grafo tripartito aplicado a
 * tus favoritos: la M-177 para en Guillena y en Sevilla, y quieres poder
 * mirar cada extremo por separado. */
function municipiosDeSeguimiento() {
  return [...new Set(candidatasDeSeguimiento()
    .map(c => municipioDeParada(c.paradaId))
    .filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
}

/** Fila de pastillas para elegir desde qué municipio mirar. Si solo hay
 * uno no se pinta: no aporta nada y roba sitio. */
function pintarFiltroMunicipio(contenedor, onCambio) {
  const municipios = municipiosDeSeguimiento();
  contenedor.innerHTML = "";
  if (municipios.length < 2) return;
  const fila = document.createElement("div");
  fila.className = "chip-row";
  const pinta = (etiqueta, valor) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "muni-chip" + (FILTRO_MUNICIPIO === valor ? " active" : "");
    b.textContent = etiqueta;
    b.addEventListener("click", () => { setFiltroMunicipio(valor); onCambio(); });
    fila.appendChild(b);
  };
  pinta("Todos", "");
  municipios.forEach(m => pinta(m, m));
  contenedor.appendChild(fila);
}

/** Todas las salidas que vigilas, en una sola lista y ordenadas por lo
 * que falta para cada una.
 *
 * Antes iban agrupadas por parada, y eso rompía justo lo que la pantalla
 * tiene que responder: con dos paradas guardadas, un autobús que salía en
 * un minuto quedaba por debajo de otro que salía en una hora, sólo porque
 * su parada iba después. Aquí no hay jerarquía de paradas: hay una cola
 * de autobuses, y arriba está el que se va antes. Cada fila se explica
 * sola —línea, hacia dónde y desde qué parada—, así que no hacen falta
 * cabeceras.
 *
 * Y antes de ordenar, se poda: de cada línea y sentido queda la parada
 * más cercana. Sin eso, marcar la M-177 como favorita llenaba la pantalla
 * con la misma línea vista desde cuatro paradas repartidas por media
 * provincia, y ninguna era necesariamente la de casa. */
function salidasVigiladas() {
  const mejores = new Map();   // lineaSlug|sentido -> la salida en la parada más cercana

  candidatasDeSeguimiento().forEach(({ paradaId, lineaSlug }) => {
    const parada = APP.data.paradas[paradaId];
    if (!parada) return;
    const municipio = municipioDeParada(paradaId);
    if (FILTRO_MUNICIPIO && municipio !== FILTRO_MUNICIPIO) return;
    const dist = distanciaA(paradaId);

    sentidosEnParada(paradaId, lineaSlug || null).forEach(g => {
      const espera = formatEspera(g.dep);
      if (!isFinite(espera.orden)) return;   // sin servicio: no es una salida
      const clave = g.lineaSlug + "|" + g.sentidoClave;
      const previa = mejores.get(clave);
      // Gana la parada más cercana; sin ubicación no hay con qué decidir,
      // así que gana el autobús que pasa antes.
      if (previa) {
        const mejor = (previa.dist == null || dist == null)
          ? espera.orden < previa.espera.orden
          : dist < previa.dist;
        if (!mejor) return;
      }
      mejores.set(clave, {
        paradaId, paradaNombre: parada.nombre, municipio, dist,
        lineaSlug: g.lineaSlug,
        codigo: codigoLinea(g.lineaTitulo),
        hacia: g.etiqueta,
        espera,
        // A menos de diez minutos ya no se pregunta "¿cuándo pasa?" sino
        // "¿me da tiempo o espero al otro?", así que el otro entra en la
        // lista con su propia fila, colgando de esta.
        ...(espera.urgente ? (() => {
          const tras = salidaDespuesDe(g.servicios, g.dep);
          return { siguiente: tras.dep ? formatEspera(tras.dep) : null, ultimoDeHoy: tras.ultimo };
        })() : { siguiente: null, ultimoDeHoy: false })
      });
    });
  });

  return [...mejores.values()].sort((a, b) => a.espera.orden - b.espera.orden);
}

const SALIDAS_VISIBLES = 5;   // lo que cabe de un vistazo sin bajar
const SALIDAS_POR_PARADA = 2; // en el resumen, para que asomen todas
let VER_TODAS_SALIDAS = false;

/** El resumen no es la cabeza de la cola, es un resumen: si una parada
 * tiene ocho líneas y otra una, enseñar las cinco primeras por hora deja
 * la segunda parada fuera de la pantalla justo cuando es la que
 * interesa. Se limita lo que aporta cada parada, y al desplegar se ve
 * todo sin recortes. */
function resumirSalidas(salidas) {
  const cuenta = new Map();
  return salidas.filter(sal => {
    const n = (cuenta.get(sal.paradaId) || 0) + 1;
    cuenta.set(sal.paradaId, n);
    return n <= SALIDAS_POR_PARADA;
  }).slice(0, SALIDAS_VISIBLES);
}

/** La fila que cuelga de una salida inminente: el mismo autobús, el de
 * después. Va pegada a la suya y no en su sitio por hora, porque lo que
 * dice sólo se entiende junto a la de arriba: cinco filas más abajo,
 * "16:53" ya no es "el siguiente de este". */
function filaSiguiente(sal) {
  if (sal.ultimoDeHoy) {
    return `<div class="salida-fila seguimiento">
      <span class="salida-flecha">${icono("abajo")}</span>
      <span class="salida-cuerpo"><span class="salida-hacia">no hay otro hoy</span></span>
    </div>`;
  }
  if (!sal.siguiente) return "";
  return `<div class="salida-fila seguimiento" data-stop-id="${escapeHtml(sal.paradaId)}">
    <span class="salida-flecha">${icono("abajo")}</span>
    <span class="salida-cuerpo"><span class="salida-hacia">el siguiente</span></span>
    <span class="salida-cuando">${escapeHtml(sal.siguiente.cuando)}
      <span class="salida-reloj">${escapeHtml(sal.siguiente.reloj)}</span>
    </span>
  </div>`;
}

/** Bloque destacado en Inicio: lo primero que se ve al abrir la app.
 *
 * Es el único listado de salidas de la pantalla. Antes había dos —"tus
 * próximas salidas" y "paradas cerca de ti"— que contaban lo mismo con
 * distinta letra; ahora, si no hay nada guardado, este mismo bloque
 * enseña lo que pasa por las paradas que tienes al lado. */
function renderHomeFavSalidas() {
  const box = document.getElementById("homeFavSalidas");
  if (!box) return;
  const hayFavoritos = FAVORITOS.lineas.length > 0 || FAVORITOS.paradas.length > 0;
  if (!candidatasDeSeguimiento().length) {
    box.innerHTML = hayFavoritos ? "" : `<div class="card home-fav-card">
      <h2 class="home-fav-title">Tus próximas salidas</h2>
      <p class="empty">Comparte tu ubicación para ver lo que pasa por las paradas que tienes al lado, o guarda una línea o una parada con la estrella.</p>
    </div>`;
    return;
  }

  const salidas = salidasVigiladas();
  const visibles = VER_TODAS_SALIDAS ? salidas : resumirSalidas(salidas);
  const ocultas = salidas.length - visibles.length;

  const filas = visibles.map(sal => `
    <div class="salida-fila" data-stop-id="${escapeHtml(sal.paradaId)}">
      <span class="home-fav-code es-fav">${escapeHtml(sal.codigo)}</span>
      <span class="salida-cuerpo">
        <span class="salida-hacia">hacia ${escapeHtml(sal.hacia)}</span>
        <span class="salida-parada">${escapeHtml(sal.paradaNombre)}${sal.dist != null ? " · " + escapeHtml(formatDistance(sal.dist)) : ""}</span>
      </span>
      <span class="salida-cuando${sal.espera.urgente ? " ya" : ""}">${escapeHtml(sal.espera.cuando)}
        <span class="salida-reloj">${escapeHtml(sal.espera.reloj)}</span>
      </span>
    </div>${filaSiguiente(sal)}`).join("");

  const vacio = FILTRO_MUNICIPIO
    ? `<p class="empty">No sigues ninguna parada en ${escapeHtml(FILTRO_MUNICIPIO)}.</p>`
    : `<p class="empty">No quedan más salidas hoy.</p>`;

  box.innerHTML = `<div class="card home-fav-card">
      <h2 class="home-fav-title">${hayFavoritos ? "Tus próximas salidas" : "Salidas cerca de ti"}</h2>
      <div id="homeFiltroMuni"></div>
      ${filas || vacio}
      ${ocultas > 0 || VER_TODAS_SALIDAS
        ? `<button type="button" class="salida-mas" id="btnVerTodasSalidas">${VER_TODAS_SALIDAS ? "Ver menos" : `Ver ${ocultas} salida${ocultas === 1 ? "" : "s"} más`}</button>`
        : ""}
    </div>`;

  const filtro = box.querySelector("#homeFiltroMuni");
  if (filtro) pintarFiltroMunicipio(filtro, renderHomeFavSalidas);

  const btnMas = box.querySelector("#btnVerTodasSalidas");
  if (btnMas) btnMas.addEventListener("click", () => {
    VER_TODAS_SALIDAS = !VER_TODAS_SALIDAS;
    renderHomeFavSalidas();
  });

  box.querySelectorAll(".salida-fila[data-stop-id]").forEach(el => {
    el.addEventListener("click", () => openModal(cont => buildStopScheduleModalContent(cont, el.dataset.stopId)));
  });
}

function renderQuickFavs() {
  const box = document.getElementById("homeQuickFavs");
  box.innerHTML = "";
  const rutas = FAVORITOS.rutas.slice(0, 3);
  rutas.forEach(fav => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "quickfav";
    b.innerHTML = icono("brujula") + escapeHtml(fav.destinoNombre);
    b.title = `${fav.origenNombre} ${icono("brujula")}${escapeHtml(fav.destinoNombre)}`;
    b.addEventListener("click", () => {
      ROUTE_ORIGIN = { type: "stop", id: fav.origenId };
      ROUTE_DESTINO = { type: "stop", id: fav.destinoId };
      irAPantalla("screenRuta");
      setTimeout(() => {
        buildStopsDatalist();
        document.getElementById("origenInput").value = fav.origenNombre;
        document.getElementById("origenStatus").textContent = `Parada: ${fav.origenNombre}`;
        document.getElementById("destinoInput").value = fav.destinoNombre;
        document.getElementById("destinoStatus").textContent = `Parada: ${fav.destinoNombre}`;
        onCalcularRuta();
      }, 90);
    });
    box.appendChild(b);
  });
  // Las paradas favoritas NO se repiten aquí: ya están arriba, con sus
  // horas y pulsables. Estas pastillas son para las rutas guardadas, que
  // no aparecen en ningún otro sitio de la pantalla.
}

function wireInicio() {
  document.getElementById("homeBtnUbicacion").addEventListener("click", pedirUbicacionInicio);
  document.getElementById("homeDestinoInput").addEventListener("change", e => {
    const nombre = e.target.value.trim();
    if (!nombre) return;
    buildStopsDatalist();
    const punto = interpretarBusquedaExtremo(nombre);
    if (!punto) {
      document.getElementById("homeOrigenTexto").textContent = "No se reconoce; elige una parada o un municipio de la lista.";
      return;
    }
    ROUTE_DESTINO = punto;
    irAPantalla("screenRuta");
    setTimeout(() => {
      document.getElementById("destinoInput").value = textoDeExtremo(punto);
      document.getElementById("destinoStatus").textContent = describeEndpoint(punto);
      if (ROUTE_ORIGIN) {
        document.getElementById("origenInput").value = textoDeExtremo(ROUTE_ORIGIN);
        document.getElementById("origenStatus").textContent = describeEndpoint(ROUTE_ORIGIN);
        onCalcularRuta();
      }
    }, 90);
  });
}

/* ------------------------------------------------------------------ */
/* Navegación y drawer de favoritos                                    */
/* ------------------------------------------------------------------ */
function irAPantalla(idPantalla) {
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.screen === idPantalla));
  document.querySelectorAll(".screen").forEach(p => p.classList.toggle("active", p.id === idPantalla));
  if (idPantalla === "screenInicio") { renderHomeFavSalidas(); renderQuickFavs(); }
  if (idPantalla === "screenRuta") { buildStopsDatalist(); initRouteMap(); }
  if (idPantalla === "screenLineas") { renderLineasFavoritas(); renderListadoLineas(); }
  if (CURRENT_MAP_REF.map) setTimeout(() => CURRENT_MAP_REF.map.invalidateSize(), 60);
  if (CURRENT_ROUTE_MAP) setTimeout(() => CURRENT_ROUTE_MAP.invalidateSize(), 60);
}

function abrirDrawerFavoritos() {
  document.getElementById("favDrawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");
  renderFavoritosTab();
}

function cerrarDrawerFavoritos() {
  document.getElementById("favDrawer").classList.remove("open");
  document.getElementById("drawerOverlay").classList.remove("open");
}

function wireTabs() {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => irAPantalla(btn.dataset.screen));
  });
  document.getElementById("btnAbrirFavoritos").addEventListener("click", abrirDrawerFavoritos);
  document.getElementById("btnCerrarFavoritos").addEventListener("click", cerrarDrawerFavoritos);
  document.getElementById("drawerOverlay").addEventListener("click", cerrarDrawerFavoritos);
}

/* ------------------------------------------------------------------ */
/* Arranque                                                             */
/* ------------------------------------------------------------------ */
/** Registra el Service Worker (solo funciona sobre https:// o
 * localhost). Nos da caché offline y, sobre todo, notificaciones
 * reales en móvil, donde `new Notification()` está prohibido. */
function registrarServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  navigator.serviceWorker.register("sw.js", { scope: "./" })
    .then(reg => console.info("Service Worker registrado", reg.scope))
    .catch(err => console.warn("No se pudo registrar el Service Worker", err));
}

async function init() {
  cargarFavoritos();
  pintarIconosDeclarados();
  wireTema();
  registrarServiceWorker();
  setStatus("Cargando datos…");
  try {
    APP.data = await loadData(false);
    construirGrafo();
    setStatus("");
  } catch (err) {
    setStatus("No se han podido cargar los horarios. Comprueba la conexión y vuelve a entrar.", true);
    return;
  }
  buildMunicipioOptions();
  wireTabs();
  wireLineSearch();
  wireRuta();
  wireInicio();
  renderQuickFavs();
  renderHomeFavSalidas();
  arrancarVigilanteNotificaciones();
  pedirUbicacionInicio();
}

document.addEventListener("DOMContentLoaded", init);
</script>
