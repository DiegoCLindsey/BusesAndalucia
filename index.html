/* ------------------------------------------------------------------ */
/* Avisos del consorcio                                                 */
/* ------------------------------------------------------------------ */
/** Los cambios de horario, los cortes por obras y las fiestas del pueblo
 * no están en el GTFS: el consorcio los publica aparte, como noticias.
 *
 * Se piden en caliente a la API —permite CORS, así que se puede llamar
 * desde el navegador— y se guardan por día: si ya se consultaron hoy no se
 * vuelve a pedir. Si falla la red se enseña la última copia buena, porque
 * un aviso de ayer sigue valiendo más que una pantalla en blanco.
 *
 * Lo que importa se pone primero: un aviso que toca a una línea o a una
 * parada que sigues no es lo mismo que uno de la otra punta de la
 * provincia. Van arriba y separados del resto. */
const API_CTAN = "https://api.ctan.es/v1";
const LS_AVISOS = "ctanAvisosV1";
let AVISOS = { lista: [], fecha: null, cargando: false };

function claveAvisos(idc) {
  return `${LS_AVISOS}:${idc}`;
}

/** De qué consorcios se piden los avisos: el área de referencia y las de
 * lo que tienes guardado. No los nueve: cada uno es una llamada a la API,
 * y los cortes de Almería no le dicen nada a quien coge el autobús en
 * Guillena. */
function areasDeAvisos() {
  const areas = new Set(areasDeFavoritos());
  if (CTAN.id) areas.add(CTAN.id);
  return [...areas];
}

/** Los avisos de UN consorcio. Cada uno se cachea por su cuenta y por día:
 * si ya se consultaron hoy no se vuelven a pedir. */
async function cargarAvisosDe(idc, forzar) {
  const hoy = ymd(new Date());
  const guardado = leerCache(claveAvisos(idc));
  if (!forzar && guardado && guardado.fecha === hoy) return guardado.lista;
  try {
    const json = await pedirJson(`${API_CTAN}/Consorcios/${idc}/noticias?lang=ES`);
    const lista = (json.noticias || []).map(n => ({
      id: n.idNoticia,
      // De qué consorcio es. Hace falta porque los identificadores de
      // variante SÍ se repiten entre áreas: sin esto, un aviso de Málaga
      // podría acabar pegado a una línea de Sevilla con el mismo número.
      idc,
      titulo: (n.titulo || "").trim(),
      subtitulo: (n.subTitulo || n.resumen || "").trim(),
      categoria: (n.categoria || "").trim(),
      desde: n.fechaInicio || null,
      hasta: n.fechafin || n.fechafinFija || null,
      // La API devuelve los identificadores de línea separados por comas,
      // o null cuando el aviso es de todo el consorcio.
      lineas: n.lineas ? String(n.lineas).split(",").map(x => x.trim()).filter(Boolean) : []
    }));
    guardarCache(claveAvisos(idc), { lista, fecha: hoy });
    return lista;
  } catch (e) {
    // Sin conexión, lo último que se supo: un aviso de ayer vale más que
    // una pantalla en blanco.
    return guardado ? guardado.lista : null;
  }
}

async function cargarAvisos(forzar) {
  const areas = areasDeAvisos();
  if (!areas.length) return [];
  AVISOS.cargando = true;
  const resultados = await Promise.all(areas.map(idc => cargarAvisosDe(idc, forzar)));
  const lista = [];
  let algunoFresco = false;
  resultados.forEach(r => {
    if (r === null) return;    // ese consorcio no ha contestado y no había copia
    algunoFresco = true;
    lista.push(...r);
  });
  AVISOS = { lista, fecha: algunoFresco ? ymd(new Date()) : null, cargando: false };
  return AVISOS.lista;
}

/** Las líneas que sigues: las marcadas como favoritas más las que pasan
 * por tus paradas guardadas. Un aviso de cualquiera de ellas es tuyo. */
function lineasQueSigo() {
  const suyas = new Set(FAVORITOS.lineas.map(l => l.slug));
  FAVORITOS.paradas.forEach(f => {
    const nodo = GRAFO.paradas.get(f.id);
    if (nodo) nodo.lineas.forEach(slug => suyas.add(slug));
  });
  return suyas;
}

/** Un aviso trae identificadores de línea de la API, no slugs. Se cruzan
 * con las variantes de cada línea, que es donde viven esos números. */
function avisoEsMio(aviso, mias) {
  if (!aviso.lineas.length) return false;
  return CTAN.lineas.some(l =>
    l.idc === aviso.idc && mias.has(l.slug) &&
    (l.variantes || []).some(v => aviso.lineas.includes(v.id)));
}

function avisosOrdenados() {
  const mias = lineasQueSigo();
  const conMarca = AVISOS.lista.map(a => ({ ...a, mio: avisoEsMio(a, mias) }));
  const porFecha = (a, b) => String(b.desde || "").localeCompare(String(a.desde || ""));
  return {
    mios: conMarca.filter(a => a.mio).sort(porFecha),
    resto: conMarca.filter(a => !a.mio).sort(porFecha)
  };
}

function fechaAviso(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
}

/** Los nombres de las líneas a las que toca un aviso, para poder decirlo
 * sin obligar a abrirlo. */
function lineasDeAviso(aviso) {
  const codigos = new Set();
  CTAN.lineas.forEach(l => {
    if (l.idc === aviso.idc && (l.variantes || []).some(v => aviso.lineas.includes(v.id))) {
      codigos.add(l.codigo);
    }
  });
  return [...codigos];
}

function filaAviso(aviso) {
  const codigos = lineasDeAviso(aviso);
  const desde = fechaAviso(aviso.desde);
  return `<div class="aviso-fila">
    <div class="aviso-cab">
      <span class="aviso-titulo">${escapeHtml(aviso.titulo)}</span>
      ${aviso.categoria ? `<span class="aviso-cat${aviso.mio ? " tuyo" : ""}">${escapeHtml(aviso.categoria)}</span>` : ""}
    </div>
    ${aviso.subtitulo && aviso.subtitulo !== aviso.titulo
      ? `<div class="aviso-sub">${escapeHtml(aviso.subtitulo)}</div>` : ""}
    <span class="aviso-meta">${codigos.length ? escapeHtml(codigos.join(" · ")) + " · " : ""}${
      desde ? "desde el " + escapeHtml(desde) : "sin fecha"}</span>
  </div>`;
}

async function renderAvisos() {
  const box = document.getElementById("listaAvisos");
  if (!box) return;
  if (!AVISOS.lista.length && !AVISOS.fecha) {
    box.innerHTML = '<div class="card"><p class="empty">Consultando avisos…</p></div>';
  }
  await cargarAvisos(false);
  const { mios, resto } = avisosOrdenados();
  actualizarChapaAvisos(mios.length);

  if (!mios.length && !resto.length) {
    box.innerHTML = `<div class="card"><h2 class="home-fav-title">Avisos</h2>
      <p class="empty">${AVISOS.fecha
        ? "No hay ningún aviso publicado ahora mismo."
        : "No se han podido consultar los avisos. Comprueba la conexión."}</p></div>`;
    return;
  }

  box.innerHTML = `
    ${mios.length ? `<div class="card">
      <h2 class="home-fav-title">Te afectan</h2>
      <div class="detail-meta" style="margin-bottom:6px;">Avisos de líneas o paradas que sigues.</div>
      ${mios.map(filaAviso).join("")}
    </div>` : ""}
    <div class="card">
      <h2 class="home-fav-title">${mios.length ? "Los demás avisos" : "Avisos"}</h2>
      ${resto.length ? resto.map(filaAviso).join("")
        : '<p class="empty">No hay más avisos.</p>'}
    </div>`;
}

/** La chapa del menú sólo cuenta lo que te toca: un número que sube por
 * avisos de la otra punta de la provincia deja de significar nada. */
function actualizarChapaAvisos(cuantos) {
  const chapa = document.getElementById("navAvisosBadge");
  if (!chapa) return;
  chapa.hidden = !cuantos;
  chapa.textContent = cuantos > 9 ? "9+" : String(cuantos || "");
}

/** Los avisos de una línea concreta, para su ficha. */
function avisosDeLinea(slug) {
  const linea = lineaPorSlug(slug);
  if (!linea) return [];
  return AVISOS.lista.filter(a =>
    a.idc === linea.idc && a.lineas.length &&
    (linea.variantes || []).some(v => a.lineas.includes(v.id)));
}

/* ------------------------------------------------------------------ */
/* Pantalla "Inicio": próximas salidas + "¿A dónde quieres ir?"        */
/* ------------------------------------------------------------------ */
/** Inicio ya no lleva mapa. Ocupaba media pantalla para enseñar círculos
 * verdes sobre un fondo gris —de lejos ni siquiera se distinguen los
 * pueblos— y empujaba fuera de la vista lo único que se viene a mirar:
 * a qué hora pasa el próximo autobús. El mapa sigue entero en Ruta, que
 * es donde hace falta señalar sitios. */
function setHomeOrigen(point, textoDescriptivo) {
  ROUTE_ORIGIN = point;
  document.getElementById("homeOrigenTexto").textContent = textoDescriptivo;
}

function pedirUbicacionInicio() {
  const texto = document.getElementById("homeOrigenTexto");
  if (!navigator.geolocation) {
    texto.textContent = "Tu navegador no comparte la ubicación.";
    return;
  }
  texto.textContent = "Buscando dónde estás…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      UBICACION = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const near = nearestStop(APP.data, UBICACION.lat, UBICACION.lng);
      setHomeOrigen({ type: "point", lat: UBICACION.lat, lng: UBICACION.lng },
        near ? `Desde ${APP.data.paradas[near.id].nombre}` : "Desde tu ubicación");
      // Saber dónde estás cambia QUÉ parada se enseña de cada línea, así
      // que el listado se rehace entero, no sólo se le añade la distancia.
      renderHomeFavSalidas();
      // La más cercana pasa a ser el área de referencia (avisos, mapa, pie).
      // Pero no es la única que se baja: todo lo que está a un radio
      // razonable de la ubicación se carga solo, para que una parada del
      // otro lado de una frontera de consorcio ya tenga horarios cuando se
      // toque, sin haber tenido que abrirla antes a mano.
      const cerca = areaMasCercana(UBICACION.lat, UBICACION.lng);
      if (!cerca) return;
      if (cerca !== CTAN.id) {
        activarConsorcio(cerca).then(repintarTrasCambioDeArea).catch(() => { /* se sigue con lo que hubiera */ });
      }
      asegurarHorarios(areasEnRango(UBICACION.lat, UBICACION.lng))
        .then(renderHomeFavSalidas).catch(() => {});
    },
    () => {
      // Sin ubicación no se deja la pantalla muerta: se manda a Ruta, que
      // es donde se puede marcar el punto de partida en el mapa.
      texto.textContent = "No hemos podido localizarte.";
      const btn = document.getElementById("homeBtnUbicacion");
      btn.innerHTML = icono("lapiz") + "Marcar en el mapa";
      btn.onclick = () => irAPantalla("screenRuta");
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

/* ------------------------------------------------------------------ */
/* Seguimiento: desde qué paradas miras tus salidas                     */
/* ------------------------------------------------------------------ */
/** Dónde está la persona, si lo ha compartido. Manda para elegir parada:
 * "el próximo autobús" es el que pasa por la parada a la que puedo
 * llegar andando, no por una que me pilla a cinco kilómetros. */
let UBICACION = null;

function distanciaA(paradaId) {
  const p = APP.data.paradas[paradaId];
  if (!UBICACION || !p || p.lat == null) return null;
  return haversine(UBICACION.lat, UBICACION.lng, p.lat, p.lng);
}

/** De qué paradas se puede coger cada línea que a la persona le importa.
 *
 * El orden de preferencia es el que tiene sentido para quien va a coger
 * el autobús: manda lo que ha marcado como suyo y, dentro de eso, lo que
 * tiene más cerca.
 *
 *   1. Líneas favoritas. Si además ha elegido paradas para esa línea,
 *      sólo esas; si no, cualquier parada por la que pase.
 *   2. Paradas favoritas: todas las líneas que pasan por ellas.
 *   3. Si no hay nada guardado, las paradas que tiene al lado.
 *
 * Luego, de cada línea se queda UNA parada —la más cercana de sus
 * candidatas—, así que la M-177 no ocupa cuatro filas repartidas por el
 * mapa. Eso sí, cada sentido va por su cuenta: la parada de ir y la de
 * volver son dos paradas distintas, y esconder una de las dos es
 * esconder justo la mitad que hace falta. */
const CANDIDATAS_CERCA = 8;    // paradas del entorno cuando no hay favoritos
const RADIO_MISMA_ESQUINA = 250; // metros: la parada de enfrente sigue siendo "aquí"
const RADIO_MI_PARADA = 1000;   // metros: hasta aquí, "mi parada" sigue siendo la mía
const SALIDAS_SIN_LINEA_FAV = 3; // salidas de una parada cuyas líneas no sigo

/** Por dónde coger una línea favorita cuando no se han elegido paradas:
 * la más cercana y las que están a su lado.
 *
 * Sólo la más cercana no vale, porque la parada de ir y la de volver son
 * dos paradas distintas a veinte metros una de otra, y quedarse con una
 * esconde justo el sentido que hace falta. Pero tampoco valen todas: la
 * M-170 tiene tres finales de trayecto distintos y sus paradas más
 * cercanas para dos de ellos están a once kilómetros, que no es una
 * parada a la que nadie vaya a ir andando. */
function paradasCercanasDeLinea(lineaSlug) {
  const nodo = GRAFO.lineas.get(lineaSlug);
  if (!nodo) return [];
  const conDistancia = [...nodo.paradas]
    .map(id => ({ id, dist: distanciaA(id) }))
    .filter(c => c.dist != null)
    .sort((a, b) => a.dist - b.dist);
  if (!conDistancia.length) return [];
  const corte = conDistancia[0].dist + RADIO_MISMA_ESQUINA;
  return conDistancia.filter(c => c.dist <= corte).map(c => c.id);
}

function lineasFavoritasValidas() {
  return new Set(FAVORITOS.lineas
    .filter(fl => APP.data.lineas.some(l => l.slug === fl.slug))
    .map(fl => fl.slug));
}

/** Con líneas favoritas guardadas, una parada favorita por la que no pasa
 * ninguna de ellas se enseña por defecto, o se enseñaría todo lo que para
 * en ella —de cualquier línea— cada vez que se sigue una línea nueva.
 * Sólo entra en la lista si no se sigue ninguna línea (ahí es lo único
 * que hay que enseñar) o si se ha pedido explícitamente con "ver más". */
function candidatasDeSeguimiento(incluirOtrasLineas = VER_TODAS_SALIDAS) {
  const candidatas = [];   // {paradaId, lineaSlug|null}
  const vistas = new Set();
  const anotar = (paradaId, lineaSlug) => {
    const clave = paradaId + "|" + (lineaSlug || "*");
    if (vistas.has(clave) || !APP.data.paradas[paradaId]) return;
    vistas.add(clave);
    candidatas.push({ paradaId, lineaSlug });
  };
  const favoritas = lineasFavoritasValidas();
  const misParadas = FAVORITOS.paradas.map(f => f.id).filter(id => APP.data.paradas[id]);

  FAVORITOS.lineas.forEach(fl => {
    const linea = APP.data.lineas.find(l => l.slug === fl.slug);
    if (!linea) return;
    const nodo = GRAFO.lineas.get(fl.slug);
    const elegidas = (Array.isArray(fl.referencias) ? fl.referencias : [])
      .map(r => r.paradaId)
      .filter(id => APP.data.paradas[id]);

    // Mis paradas en esta línea, pero sólo mientras estén a mano: la
    // parada de casa es la mía en el pueblo, no cuando ando por Sevilla a
    // diecisiete kilómetros de ella. Allí manda la que tenga delante.
    const miasEnLinea = nodo ? misParadas.filter(id => nodo.paradas.has(id)) : [];
    const miasCerca = UBICACION
      ? miasEnLinea.filter(id => { const d = distanciaA(id); return d != null && d <= RADIO_MI_PARADA; })
      : miasEnLinea;

    // Mandan las paradas elegidas a mano; luego las mías si las tengo
    // cerca; luego la que pille más cerca del recorrido; y a ciegas, por
    // donde empieza cada trayecto, que es lo único que se puede saber.
    const deLaLinea = elegidas.length ? elegidas
      : miasCerca.length ? miasCerca
      : (UBICACION ? paradasCercanasDeLinea(fl.slug)
                   : referenciasDeLinea(linea).map(r => r.paradaId));
    deLaLinea.forEach(id => anotar(id, fl.slug));
  });

  // Una parada favorita por la que pasa una línea que sigo ya está
  // contada arriba, y con la línea que me importa: sacarla otra vez con
  // todo lo que para en ella llenaría la pantalla de autobuses que no
  // pienso coger. Las demás sí traen lo suyo, sea de quien sea — pero
  // sólo si toca enseñarlas (ver arriba).
  if (!favoritas.size || incluirOtrasLineas) {
    misParadas.forEach(id => {
      const nodo = GRAFO.paradas.get(id);
      const laCubreUnaFavorita = nodo && [...nodo.lineas].some(slug => favoritas.has(slug));
      if (!laCubreUnaFavorita) anotar(id, null);
    });
  }

  if (!candidatas.length && UBICACION) {
    Object.entries(APP.data.paradas)
      .filter(([, p]) => p.lat != null)
      .map(([id, p]) => ({ id, dist: haversine(UBICACION.lat, UBICACION.lng, p.lat, p.lng) }))
      .sort((a, b) => a.dist - b.dist)
      .slice(0, CANDIDATAS_CERCA)
      .forEach(c => anotar(c.id, null));
  }
  return candidatas;
}

/** Municipios desde los que la persona mira algo, para la fila de
 * filtros. Es justo el nivel "municipio" del grafo tripartito aplicado a
 * tus favoritos: la M-177 para en Guillena y en Sevilla, y quieres poder
 * mirar cada extremo por separado. */
function municipiosDeSeguimiento() {
  return [...new Set(candidatasDeSeguimiento()
    .map(c => municipioDeParada(c.paradaId))
    .filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
}

/** Fila de pastillas para elegir desde qué municipio mirar. Si solo hay
 * uno no se pinta: no aporta nada y roba sitio. */
function pintarFiltroMunicipio(contenedor, onCambio) {
  const municipios = municipiosDeSeguimiento();
  contenedor.innerHTML = "";
  if (municipios.length < 2) return;
  const fila = document.createElement("div");
  fila.className = "chip-row";
  const pinta = (etiqueta, valor) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "muni-chip" + (FILTRO_MUNICIPIO === valor ? " active" : "");
    b.textContent = etiqueta;
    b.addEventListener("click", () => { setFiltroMunicipio(valor); onCambio(); });
    fila.appendChild(b);
  };
  pinta("Todos", "");
  municipios.forEach(m => pinta(m, m));
  contenedor.appendChild(fila);
}

/** Todas las salidas que vigilas, en una sola lista y ordenadas por lo
 * que falta para cada una.
 *
 * Antes iban agrupadas por parada, y eso rompía justo lo que la pantalla
 * tiene que responder: con dos paradas guardadas, un autobús que salía en
 * un minuto quedaba por debajo de otro que salía en una hora, sólo porque
 * su parada iba después. Aquí no hay jerarquía de paradas: hay una cola
 * de autobuses, y arriba está el que se va antes. Cada fila se explica
 * sola —línea, hacia dónde y desde qué parada—, así que no hacen falta
 * cabeceras.
 *
 * Y antes de ordenar, se poda: de cada línea y sentido queda la parada
 * más cercana. Sin eso, marcar la M-177 como favorita llenaba la pantalla
 * con la misma línea vista desde cuatro paradas repartidas por media
 * provincia, y ninguna era necesariamente la de casa. */
function salidasVigiladas(incluirOtrasLineas) {
  const mejores = new Map();   // lineaSlug|sentido -> la salida en la parada más cercana

  candidatasDeSeguimiento(incluirOtrasLineas).forEach(({ paradaId, lineaSlug }) => {
    const parada = APP.data.paradas[paradaId];
    if (!parada) return;
    const municipio = municipioDeParada(paradaId);
    if (FILTRO_MUNICIPIO && municipio !== FILTRO_MUNICIPIO) return;
    const dist = distanciaA(paradaId);

    sentidosEnParada(paradaId, lineaSlug || null).forEach(g => {
      const espera = formatEspera(g.dep);
      if (!isFinite(espera.orden)) return;   // sin servicio: no es una salida
      const clave = g.lineaSlug + "|" + g.sentidoClave;
      const previa = mejores.get(clave);
      // Gana la parada más cercana; sin ubicación no hay con qué decidir,
      // así que gana el autobús que pasa antes.
      if (previa) {
        const mejor = (previa.dist == null || dist == null)
          ? espera.orden < previa.espera.orden
          : dist < previa.dist;
        if (!mejor) return;
      }
      mejores.set(clave, {
        paradaId, paradaNombre: parada.nombre, municipio, dist,
        lineaSlug: g.lineaSlug,
        codigo: codigoLinea(g.lineaTitulo),
        hacia: g.etiqueta,
        espera,
        // A menos de diez minutos ya no se pregunta "¿cuándo pasa?" sino
        // "¿me da tiempo o espero al otro?", así que el otro entra en la
        // lista con su propia fila, colgando de esta.
        ...(espera.urgente ? (() => {
          const tras = salidaDespuesDe(paradaId, g.dep, { lineaSlug: g.lineaSlug, sentidoClave: g.sentidoClave });
          return { siguiente: tras.dep ? formatEspera(tras.dep) : null, ultimoDeHoy: tras.ultimo };
        })() : { siguiente: null, ultimoDeHoy: false })
      });
    });
  });

  // De una parada cuyas líneas no sigo no hacen falta las quince que
  // pasan: con las tres primeras se sabe si hay que salir corriendo.
  const favoritas = lineasFavoritasValidas();
  const cuenta = new Map();
  return [...mejores.values()]
    .sort((a, b) => a.espera.orden - b.espera.orden)
    .filter(sal => {
      if (favoritas.has(sal.lineaSlug)) return true;
      const n = (cuenta.get(sal.paradaId) || 0) + 1;
      cuenta.set(sal.paradaId, n);
      return n <= SALIDAS_SIN_LINEA_FAV;
    });
}

const SALIDAS_VISIBLES = 5;   // lo que cabe de un vistazo sin bajar
const SALIDAS_POR_PARADA = 3; // en el resumen, para que asomen todas
let VER_TODAS_SALIDAS = false;

/** El resumen no es la cabeza de la cola, es un resumen: si una parada
 * tiene ocho líneas y otra una, enseñar las cinco primeras por hora deja
 * la segunda parada fuera de la pantalla justo cuando es la que
 * interesa. Se limita lo que aporta cada parada, y al desplegar se ve
 * todo sin recortes. */
function resumirSalidas(salidas) {
  const cuenta = new Map();
  return salidas.filter(sal => {
    const n = (cuenta.get(sal.paradaId) || 0) + 1;
    cuenta.set(sal.paradaId, n);
    return n <= SALIDAS_POR_PARADA;
  }).slice(0, SALIDAS_VISIBLES);
}

/** La fila que cuelga de una salida inminente: el mismo autobús, el de
 * después. Va pegada a la suya y no en su sitio por hora, porque lo que
 * dice sólo se entiende junto a la de arriba: cinco filas más abajo,
 * "16:53" ya no es "el siguiente de este". */
function filaSiguiente(sal) {
  if (sal.ultimoDeHoy) {
    return `<div class="salida-fila seguimiento">
      <span class="salida-flecha">${icono("abajo")}</span>
      <span class="salida-cuerpo"><span class="salida-hacia">no hay otro hoy</span></span>
    </div>`;
  }
  if (!sal.siguiente) return "";
  return `<div class="salida-fila seguimiento" data-stop-id="${escapeHtml(sal.paradaId)}">
    <span class="salida-flecha">${icono("abajo")}</span>
    <span class="salida-cuerpo"><span class="salida-hacia">el siguiente</span></span>
    <span class="salida-cuando">${escapeHtml(sal.siguiente.cuando)}
      <span class="salida-reloj">${escapeHtml(sal.siguiente.reloj)}</span>
    </span>
  </div>`;
}

/** Bloque destacado en Inicio: lo primero que se ve al abrir la app.
 *
 * Es el único listado de salidas de la pantalla. Antes había dos —"tus
 * próximas salidas" y "paradas cerca de ti"— que contaban lo mismo con
 * distinta letra; ahora, si no hay nada guardado, este mismo bloque
 * enseña lo que pasa por las paradas que tienes al lado. */
/** Evita que el repintado por horarios recién llegados se dispare en
 * bucle: una vez pedida un área, ya se repintará cuando aterrice. */
let PIDIENDO_HORARIOS_INICIO = false;

function renderHomeFavSalidas() {
  const box = document.getElementById("homeFavSalidas");
  if (!box) return;
  const hayFavoritos = FAVORITOS.lineas.length > 0 || FAVORITOS.paradas.length > 0;
  const favoritas = lineasFavoritasValidas();
  // La versión completa —con las paradas favoritas sin línea seguida, si
  // tocara enseñarlas— dice qué áreas hacen falta y cuánto hay detrás de
  // "ver más", se pulse o no.
  const candidatasCompleta = candidatasDeSeguimiento(true);

  // Las paradas que se van a enseñar pueden ser de un área cuyos horarios
  // aún no están (cerca de un límite provincial, o con un favorito de otra
  // punta). Sin ellos la parada saldría muda, así que se piden y se
  // repinta cuando lleguen.
  const faltan = [...new Set(candidatasCompleta.map(c => areaDeParada(c.paradaId)))]
    .filter(idc => idc != null && !tieneHorarios(idc));
  if (faltan.length && !PIDIENDO_HORARIOS_INICIO) {
    PIDIENDO_HORARIOS_INICIO = true;
    asegurarHorarios(faltan)
      .catch(() => { /* ya se verá en la próxima */ })
      .then(() => { PIDIENDO_HORARIOS_INICIO = false; renderHomeFavSalidas(); });
  }

  if (!candidatasCompleta.length) {
    box.innerHTML = hayFavoritos ? "" : `<div class="card home-fav-card">
      <h2 class="home-fav-title">Tus próximas salidas</h2>
      <p class="empty">Comparte tu ubicación para ver lo que pasa por las paradas que tienes al lado, o guarda una línea o una parada con la estrella.</p>
    </div>`;
    return;
  }

  // Con líneas favoritas de por medio, las paradas sin ninguna de ellas se
  // quedan fuera del resumen: sólo entran al pulsar "ver más". Sin ninguna
  // línea seguida no hay nada que priorizar, así que la base ya las trae.
  const salidasBase = salidasVigiladas(false);
  const salidasCompleta = favoritas.size ? salidasVigiladas(true) : salidasBase;
  const visibles = VER_TODAS_SALIDAS ? salidasCompleta : resumirSalidas(salidasBase);
  const ocultas = salidasCompleta.length - visibles.length;

  const filas = visibles.map(sal => `
    <div class="salida-fila" data-stop-id="${escapeHtml(sal.paradaId)}">
      <span class="home-fav-code es-fav">${escapeHtml(sal.codigo)}</span>
      <span class="salida-cuerpo">
        <span class="salida-hacia">hacia ${escapeHtml(sal.hacia)}</span>
        <span class="salida-parada">${escapeHtml(sal.paradaNombre)}${sal.dist != null ? " · " + escapeHtml(formatDistance(sal.dist)) : ""}</span>
      </span>
      <span class="salida-cuando${sal.espera.urgente ? " ya" : ""}">${escapeHtml(sal.espera.cuando)}
        <span class="salida-reloj">${escapeHtml(sal.espera.reloj)}</span>
      </span>
    </div>${filaSiguiente(sal)}`).join("");

  const vacio = FILTRO_MUNICIPIO
    ? `<p class="empty">No sigues ninguna parada en ${escapeHtml(FILTRO_MUNICIPIO)}.</p>`
    : `<p class="empty">No quedan más salidas hoy.</p>`;

  box.innerHTML = `<div class="card home-fav-card">
      <h2 class="home-fav-title">${hayFavoritos ? "Tus próximas salidas" : "Salidas cerca de ti"}</h2>
      <div id="homeFiltroMuni"></div>
      ${filas || vacio}
      ${ocultas > 0 || VER_TODAS_SALIDAS
        ? `<button type="button" class="salida-mas" id="btnVerTodasSalidas">${VER_TODAS_SALIDAS ? "Ver menos" : `Ver ${ocultas} salida${ocultas === 1 ? "" : "s"} más`}</button>`
        : ""}
    </div>`;

  const filtro = box.querySelector("#homeFiltroMuni");
  if (filtro) pintarFiltroMunicipio(filtro, renderHomeFavSalidas);

  const btnMas = box.querySelector("#btnVerTodasSalidas");
  if (btnMas) btnMas.addEventListener("click", () => {
    VER_TODAS_SALIDAS = !VER_TODAS_SALIDAS;
    renderHomeFavSalidas();
  });

  box.querySelectorAll(".salida-fila[data-stop-id]").forEach(el => {
    el.addEventListener("click", () => openModalConHorarios(areaDeParada(el.dataset.stopId),
      cont => buildStopScheduleModalContent(cont, el.dataset.stopId)));
  });
}

function renderQuickFavs() {
  const box = document.getElementById("homeQuickFavs");
  box.innerHTML = "";
  const rutas = FAVORITOS.rutas.slice(0, 3);
  rutas.forEach(fav => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "quickfav";
    b.innerHTML = icono("brujula") + escapeHtml(fav.destinoNombre);
    b.title = `${fav.origenNombre} ${icono("brujula")}${escapeHtml(fav.destinoNombre)}`;
    b.addEventListener("click", () => {
      ROUTE_ORIGIN = { type: "stop", id: fav.origenId };
      ROUTE_DESTINO = { type: "stop", id: fav.destinoId };
      irAPantalla("screenRuta");
      setTimeout(() => {
        buildStopsDatalist();
        document.getElementById("origenInput").value = fav.origenNombre;
        document.getElementById("origenStatus").textContent = `Parada: ${fav.origenNombre}`;
        document.getElementById("destinoInput").value = fav.destinoNombre;
        document.getElementById("destinoStatus").textContent = `Parada: ${fav.destinoNombre}`;
        onCalcularRuta();
      }, 90);
    });
    box.appendChild(b);
  });
  // Las paradas favoritas NO se repiten aquí: ya están arriba, con sus
  // horas y pulsables. Estas pastillas son para las rutas guardadas, que
  // no aparecen en ningún otro sitio de la pantalla.
}

function wireInicio() {
  document.getElementById("homeBtnUbicacion").addEventListener("click", pedirUbicacionInicio);
  document.getElementById("homeDestinoInput").addEventListener("change", e => {
    const nombre = e.target.value.trim();
    if (!nombre) return;
    buildStopsDatalist();
    const punto = interpretarBusquedaExtremo(nombre);
    if (!punto) {
      document.getElementById("homeOrigenTexto").textContent = "No se reconoce; elige una parada o un municipio de la lista.";
      return;
    }
    ROUTE_DESTINO = punto;
    irAPantalla("screenRuta");
    setTimeout(() => {
      document.getElementById("destinoInput").value = textoDeExtremo(punto);
      document.getElementById("destinoStatus").textContent = describeEndpoint(punto);
      if (ROUTE_ORIGIN) {
        document.getElementById("origenInput").value = textoDeExtremo(ROUTE_ORIGIN);
        document.getElementById("origenStatus").textContent = describeEndpoint(ROUTE_ORIGIN);
        onCalcularRuta();
      }
    }, 90);
  });
}

/* Navegación y drawer de favoritos                                    */
/* ------------------------------------------------------------------ */
function irAPantalla(idPantalla) {
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.screen === idPantalla));
  document.querySelectorAll(".screen").forEach(p => p.classList.toggle("active", p.id === idPantalla));
  if (idPantalla === "screenInicio") { renderHomeFavSalidas(); renderQuickFavs(); }
  if (idPantalla === "screenRuta") { buildStopsDatalist(); initRouteMap(); }
  if (idPantalla === "screenLineas") { renderLineasFavoritas(); renderListadoLineas(); }
  if (idPantalla === "screenAvisos") { renderAvisos(); }
  if (CURRENT_MAP_REF.map) setTimeout(() => CURRENT_MAP_REF.map.invalidateSize(), 60);
  if (CURRENT_ROUTE_MAP) setTimeout(() => CURRENT_ROUTE_MAP.invalidateSize(), 60);
}

function abrirDrawerFavoritos() {
  document.getElementById("favDrawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");
  renderFavoritosTab();
}

function cerrarDrawerFavoritos() {
  document.getElementById("favDrawer").classList.remove("open");
  document.getElementById("drawerOverlay").classList.remove("open");
}

function wireTabs() {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => irAPantalla(btn.dataset.screen));
  });
  document.getElementById("btnAbrirFavoritos").addEventListener("click", abrirDrawerFavoritos);
  document.getElementById("btnCerrarFavoritos").addEventListener("click", cerrarDrawerFavoritos);
  document.getElementById("drawerOverlay").addEventListener("click", cerrarDrawerFavoritos);
}

/* Arranque                                                             */
/* ------------------------------------------------------------------ */
/** Registra el Service Worker (solo funciona sobre https:// o
 * localhost). Nos da caché offline y, sobre todo, notificaciones
 * reales en móvil, donde `new Notification()` está prohibido. */
function registrarServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  navigator.serviceWorker.register("sw.js", { scope: "./" })
    .then(reg => console.info("Service Worker registrado", reg.scope))
    .catch(err => console.warn("No se pudo registrar el Service Worker", err));
}

async function init() {
  limpiarCachesViejas();
  migrarFavoritosViejos();
  cargarFavoritos();
  pintarIconosDeclarados();
  wireTema();
  registrarServiceWorker();
  setStatus("Cargando datos…");
  try {
    APP.indice = await cargarIndice();
    await cargarCatalogo(APP.indice.generado);
    setStatus("");
  } catch (err) {
    setStatus("No se han podido cargar los horarios. Comprueba la conexión y vuelve a entrar.", true);
    return;
  }
  // Los horarios que hacen falta desde el primer segundo: los del área que
  // se estaba usando y los de las áreas donde tienes algo guardado. El
  // resto llega cuando se abre una parada o una línea de por allí.
  const referencia = consorcioGuardado() || APP.indice.consorcios[0].id;
  activarConsorcio(referencia)
    .then(() => { renderHomeFavSalidas(); renderListadoLineas(); })
    .catch(() => setStatus("No se han podido cargar los horarios del área.", true));
  asegurarHorarios(areasDeFavoritos())
    .then(() => { renderHomeFavSalidas(); renderQuickFavs(); })
    .catch(e => console.warn("No se han podido cargar los horarios de tus favoritos", e));
  buildMunicipioOptions();
  wireTabs();
  wireLineSearch();
  wireRuta();
  wireInicio();
  renderQuickFavs();
  renderHomeFavSalidas();
  arrancarVigilanteNotificaciones();
  pedirUbicacionInicio();
  // En segundo plano: si hay avisos que te tocan, la chapa lo dice sin
  // que haya que entrar a mirar.
  cargarAvisos(false).then(() => actualizarChapaAvisos(avisosOrdenados().mios.length));
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
