    // medias y otros que llegan hasta el final: el grupo se nombra por el
    // que más lejos llega, que es el que describe la dirección.
    if (sentido.alcance > g.alcance) {
      g.alcance = sentido.alcance;
      g.etiqueta = sentido.etiqueta;
      g.destinoId = sentido.destinoId;
    }
    g.bloques.push({ bloque, pos });
  });
  const now = ahora || new Date();
  const salida = [...grupos.values()].map(g => ({
    ...g,
    dep: proximaSalida(paradaId, now, { lineaSlug: g.lineaSlug, sentidoClave: g.sentidoClave })
  }));
  salida.sort((a, b) => {
    const av = a.dep ? a.dep.dias * 1440 + a.dep.h * 60 + a.dep.m : Infinity;
    const bv = b.dep ? b.dep.dias * 1440 + b.dep.h * 60 + b.dep.m : Infinity;
    return av - bv;
  });
  return salida;
}

function tituloDeLinea(slug) {
  const l = CTAN.lineas.find(x => x.slug === slug);
  return l ? l.titulo : slug;
}

function lineaPorSlug(slug) {
  return CTAN.lineas.find(x => x.slug === slug) || null;
}

function formatDeparture(dep) {
  if (!dep) return { main: "—", sub: "sin servicio" };
  const hh = String(dep.h).padStart(2, "0");
  const mm = String(dep.m).padStart(2, "0");
  let sub;
  if (dep.dias === 0) {
    const now = new Date();
    const diff = (dep.h * 60 + dep.m) - (now.getHours() * 60 + now.getMinutes());
    sub = diff <= 0 ? "saliendo ahora" : `en ${diff} min`;
  } else if (dep.dias === 1) {
    sub = "mañana";
  } else {
    sub = `en ${dep.dias} días`;
  }
  return { main: `${hh}:${mm}`, sub };
}

/** Lo mismo del revés, para las listas de "próxima salida": delante lo
 * que hay que decidir —cuánto queda— y detrás la hora del reloj.
 *
 * Quien mira la app en la parada no está leyendo un horario, está
 * preguntando si le da tiempo. "11 min" responde; "15:03" obliga a mirar
 * el móvil y restar. */
function formatEspera(dep) {
  if (!dep) return { cuando: "—", reloj: "sin servicio", urgente: false, orden: Infinity };
  const reloj = `${String(dep.h).padStart(2, "0")}:${String(dep.m).padStart(2, "0")}`;
  const orden = dep.dias * 1440 + dep.h * 60 + dep.m;
  if (dep.dias > 0) {
    return { cuando: reloj, reloj: dep.dias === 1 ? "mañana" : `en ${dep.dias} días`, urgente: false, orden };
  }
  const ahora = new Date();
  const faltan = (dep.h * 60 + dep.m) - (ahora.getHours() * 60 + ahora.getMinutes());
  if (faltan <= 0) return { cuando: "ahora", reloj, urgente: true, orden };
  if (faltan < 60) return { cuando: `${faltan} min`, reloj, urgente: faltan <= 10, orden };
  // Pasada la hora, nadie cuenta los minutos: la respuesta es el reloj, y
  // lo que falta pasa a ser el apunte. Además "2 h 1" se lee como si se
  // hubiera cortado la palabra.
  const h = Math.round(faltan / 60);
  return { cuando: reloj, reloj: `en ${h} h`, urgente: false, orden };
}

/** La línea bajo la cabecera sólo habla cuando hay algo que decir: al
 * ciudadano no le sirve saber cuántas líneas se han cargado ni cuándo se
 * generó el fichero. */
function setStatus(msg, esError) {
  const el = document.getElementById("dataStatus");
  el.textContent = msg || "";
  el.classList.toggle("error", !!esError);
}

/* ------------------------------------------------------------------ */
/* Carga de datos: el catálogo entero, los horarios cuando hacen falta  */
/* ------------------------------------------------------------------ */
/** La aplicación cubre las nueve áreas metropolitanas de Andalucía a la
 * vez, no una cada vez. Se parte en dos:
 *
 *  - El CATÁLOGO (`data/catalogo.json`, 460 KB, unos 110 comprimidos) trae
 *    las 5.009 paradas con su nombre y sus coordenadas, las 432 líneas y
 *    los 234 municipios. Es lo que hace falta para buscar una parada,
 *    pintar el mapa y reconocer un favorito, esté donde esté. Se carga
 *    entero al arrancar.
 *  - Los HORARIOS de cada área (`data/{id}/horarios.json`, de 107 KB a 1,5
 *    MB) son casi cinco megas entre las nueve, y bajarlos todos para mirar
 *    una parada de Guillena no tendría sentido. Se piden cuando se
 *    necesitan: el área en la que estás al arrancar, la de tus favoritos, y
 *    la de cualquier parada o línea que abras.
 *
 * Los ficheros van por rutas relativas porque GitHub Pages sirve el sitio
 * en una subcarpeta. */
const CATALOGO_URL = "./data/catalogo.json";

async function pedirJson(url) {
  const resp = await fetch(url, { cache: "no-store" });
  if (!resp.ok) throw new Error(`HTTP ${resp.status} al pedir ${url}`);
  return resp.json();
}

async function cargarIndice() {
  const guardado = leerCache(LS_DATOS + ":indice");
  try {
    const json = await pedirJson(INDICE_URL);
    guardarCache(LS_DATOS + ":indice", json);
    return json;
  } catch (e) {
    // Sin conexión se sigue con lo último que se supo: la aplicación tiene
    // que abrir en la parada aunque no haya cobertura.
    if (guardado) return guardado;
    throw e;
  }
}

/** Tira lo que guardaron versiones anteriores. Importa: el área de Sevilla
 * ocupa millón y medio de caracteres en localStorage, y dejar ahí una copia
 * con el formato viejo se come la cuota que necesita la nueva. */
function limpiarCachesViejas() {
  try {
    const sobran = [];
    for (let i = 0; i < localStorage.length; i++) {
      const clave = localStorage.key(i);
      if (!clave) continue;
      if (clave.startsWith("ctanDatosV1:") || clave.startsWith("ctanDatosV2:") ||
          clave === "ctasRoutingV4") sobran.push(clave);
    }
    sobran.forEach(c => localStorage.removeItem(c));
  } catch (e) { /* modo privado */ }
}

function leerCache(clave) {
  try {
    const crudo = localStorage.getItem(clave);
    return crudo ? JSON.parse(crudo) : null;
  } catch (e) { return null; }
}

function guardarCache(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); }
  catch (e) { console.warn("No se pudo cachear (¿cuota llena?)", e); }
}

/** El área a la que pertenece una parada: se lee de su propio
 * identificador, que lleva el prefijo del consorcio («4_2112» es de
 * Málaga). Por eso los identificadores conservan el prefijo. */
function areaDeParada(paradaId) {
  const n = parseInt(String(paradaId), 10);
  return Number.isFinite(n) ? n : null;
}

function areaDeLinea(slug) {
  const l = lineaPorSlug(slug);
  return l ? l.idc : null;
}

function tieneHorarios(idc) {
  return CTAN.horarios.has(idc);
}

/** Carga el catálogo de toda Andalucía. Primero la caché: si lo guardado
 * se generó el mismo día que anuncia el índice, no se vuelve a pedir. */
async function cargarCatalogo(generadoEsperado) {
  const clave = `${LS_DATOS}:catalogo`;
  let cat = leerCache(clave);
  if (!cat || cat.generado !== generadoEsperado) {
    try {
      cat = await pedirJson(CATALOGO_URL);
      guardarCache(clave, cat);
    } catch (e) {
      if (!cat) throw e;   // sin caché previa no hay nada que enseñar
      console.warn("No se ha podido refrescar el catálogo; se usa el guardado", e);
    }
  }
  montarCatalogo(cat);
}

/** Pasa el catálogo a la forma con la que trabaja la aplicación. Los datos
 * vienen en arrays posicionales para que ocupen poco por la red; aquí se
 * les vuelven a poner nombres, que es como se leen luego. */
function montarCatalogo(cat) {
  CTAN.generado = cat.generado;
  CTAN.paradas = {};
  for (const [id, p] of Object.entries(cat.paradas || {})) {
    CTAN.paradas[id] = { nombre: p[0], lat: p[1], lng: p[2], zona: p[3], municipio: p[4] };
  }
  CTAN.municipios = cat.municipios || [];
  // `variantes` viene del catálogo con el identificador y el nombre de cada
  // recorrido —con eso ya se pueden cruzar los avisos—, y se completa con
  // sus paradas cuando llegan los horarios del área.
  CTAN.lineas = (cat.lineas || []).map(l => ({
    ...l,
    variantes: (l.variantes || []).map(v => ({ ...v })),
    orden_unificado: []
  }));

  CTAN.bloques = [];
  CTAN.porParada = new Map();
  CTAN.calendario = { servicios: {}, excepciones: {} };
  CTAN.trazados = {};
  CTAN.vecinos = {};
  CTAN.horarios = new Set();
  CTAN.pidiendo = new Map();
  ROUTING = { vecinos: CTAN.vecinos };
  CACHE_SERVICIOS.clear();
  PARADA_POR_NOMBRE = null;

  CTAN.cargado = true;
  // Vista de compatibilidad: buena parte de la interfaz lee de aquí.
  APP.data = { paradas: CTAN.paradas, lineas: CTAN.lineas, municipios: CTAN.municipios };
  construirGrafo();
  // Con las coordenadas de las 5.009 paradas ya está todo lo que hace
  // falta para calcular trasbordos a pie o en bici: no hay que esperar a
  // que se bajen los horarios de ningún área.
  construirIndicesDeCercania();
}

/** Baja los horarios de un área y los suma a lo que ya hay en memoria.
 *
 * Es aditivo a propósito: al terminar conviven los horarios de todas las
 * áreas cargadas, así que un itinerario puede empezar en Sevilla y acabar
 * en Huelva sin que la aplicación tenga que "cambiar de provincia".
 *
 * Los ficheros no se guardan en localStorage —el de Sevilla solo se comería
 * la cuota entera— sino que los cachea el Service Worker, que es quien
 * hace que la aplicación funcione sin cobertura. */
async function cargarHorarios(idc, generadoEsperado) {
  if (CTAN.horarios.has(idc)) return;
  if (CTAN.pidiendo.has(idc)) return CTAN.pidiendo.get(idc);
  const promesa = (async () => {
    try {
      const datos = await pedirJson(`./data/${idc}/horarios.json`);
      mezclarHorarios(idc, datos);
    } finally {
      CTAN.pidiendo.delete(idc);
    }
  })();
  CTAN.pidiendo.set(idc, promesa);
  return promesa;
}

function mezclarHorarios(idc, datos) {
  const nuevos = (datos.bloques || []).map(b => ({
    lineaSlug: b.l,
    varianteId: b.var,
    dir: b.d,
    paradas: b.p,
    viajes: b.v,
    servicios: b.s,
    trazado: b.g
  }));
  CTAN.bloques = CTAN.bloques.concat(nuevos);
  nuevos.forEach(bloque => {
    bloque.paradas.forEach((paradaId, pos) => {
      if (!CTAN.porParada.has(paradaId)) CTAN.porParada.set(paradaId, []);
      CTAN.porParada.get(paradaId).push({ bloque, pos });
    });
  });

  const cal = datos.calendario || {};
  Object.assign(CTAN.calendario.servicios, cal.servicios || {});
  // Los identificadores de servicio tampoco se repiten entre áreas, pero
  // dos áreas sí pueden tener excepciones el mismo día (Nochebuena las
  // tienen las nueve), así que las listas de cada fecha se suman.
  for (const [fecha, cambio] of Object.entries(cal.excepciones || {})) {
    const previo = CTAN.calendario.excepciones[fecha] ||
                   (CTAN.calendario.excepciones[fecha] = {});
    ["+", "-"].forEach(signo => {
      if (cambio[signo]) previo[signo] = (previo[signo] || []).concat(cambio[signo]);
    });
  }

  Object.assign(CTAN.trazados, datos.trazados || {});
  Object.assign(CTAN.vecinos, datos.vecinos || {});
  CACHE_SERVICIOS.clear();
  CTAN.horarios.add(idc);
  completarLineasDeArea(idc);
  construirGrafo();
  PARADA_POR_NOMBRE = null;
}

/** Cada línea necesita saber por dónde pasa. El GTFS no lo da como tal: se
 * deduce de sus bloques, que es lo mismo pero mejor, porque son recorridos
 * que de verdad circulan. */
function completarLineasDeArea(idc) {
  CTAN.lineas.forEach(l => {
    if (l.idc !== idc) return;
    const suyos = CTAN.bloques.filter(b => b.lineaSlug === l.slug);
    const porVariante = new Map();
    suyos.forEach(b => {
      const clave = b.varianteId + "|" + b.dir;
      const previo = porVariante.get(clave);
      if (!previo || previo.paradas.length < b.paradas.length) porVariante.set(clave, b);
    });
    l.variantes = [...porVariante.values()].map(b => ({
      // `id` es el de la línea en la API (el mismo que el sufijo del
      // route_id del GTFS): es con lo que vienen marcados los avisos.
      id: b.varianteId,
      nodo_id: b.varianteId + "|" + b.dir,
      nombre: (l.variantes.find(v => v.id === b.varianteId) || {}).nombre || l.titulo,
      paradas: b.paradas
    }));
    // El orden unificado es el recorrido más largo con las paradas que
    // sólo tocan los demás intercaladas donde les toca.
    const orden = [];
    const vistas = new Set();
    l.variantes.slice().sort((a, b) => b.paradas.length - a.paradas.length)
      .forEach(v => v.paradas.forEach(id => {
        if (!vistas.has(id)) { vistas.add(id); orden.push(id); }
      }));
    l.orden_unificado = orden;
  });
}

/** Asegura que están en memoria los horarios de todas esas áreas. Es lo
 * que se pone delante de abrir una parada, una línea o calcular una ruta:
 * si ya están, no cuesta nada; si no, los baja. */
function asegurarHorarios(idcs) {
  const faltan = [...new Set((Array.isArray(idcs) ? idcs : [idcs])
    .filter(x => x != null && !CTAN.horarios.has(x)))];
  if (!faltan.length) return Promise.resolve();
  return Promise.all(faltan.map(idc => cargarHorarios(idc)));
}

/** Las áreas que hacen falta para pintar lo que el usuario ya tiene
 * guardado: la de cada parada favorita y la de cada línea que sigue. */
function areasDeFavoritos() {
  const areas = new Set();
  FAVORITOS.paradas.forEach(f => areas.add(areaDeParada(f.id)));
  FAVORITOS.rutas.forEach(r => { areas.add(areaDeParada(r.origenId)); areas.add(areaDeParada(r.destinoId)); });
  FAVORITOS.notificaciones.forEach(n => areas.add(areaDeParada(n.paradaId)));
  FAVORITOS.lineas.forEach(f => {
    const idc = areaDeLinea(f.slug);
    if (idc) areas.add(idc);
    (f.referencias || []).forEach(r => areas.add(areaDeParada(r.paradaId)));
  });
  areas.delete(null);
  return [...areas];
}

/** El área más cercana a un punto, por su rectángulo envolvente. */
function areaMasCercana(lat, lng) {
  if (!APP.indice) return null;
  let mejor = null, mejorD = Infinity;
  APP.indice.consorcios.forEach(c => {
    const d = distanciaABbox(lat, lng, c.bbox);
    if (d < mejorD) { mejor = c.id; mejorD = d; }
  });
  return mejor;
}

/** Todas las áreas al alcance de un punto, no sólo la más cercana: cerca
 * de una frontera —el Aljarafe con Huelva, la Bahía de Cádiz con el Campo
 * de Gibraltar— hay paradas de dos consorcios a la vez, y las dos tienen
 * que estar disponibles sin haber tocado antes una parada o una línea
 * suya. 25 km de holgura sobre el rectángulo del área es de sobra para
 * cubrir eso sin bajar horarios que no hacen falta. */
const RADIO_AREAS_CERCA_M = 25000;
function areasEnRango(lat, lng, radioM) {
  if (!APP.indice) return [];
  const radio = radioM == null ? RADIO_AREAS_CERCA_M : radioM;
  return APP.indice.consorcios
    .filter(c => distanciaABbox(lat, lng, c.bbox) <= radio)
    .map(c => c.id);
}

/* ------------------------------------------------------------------ */
/* Mapa (Leaflet)                                                      */
/* ------------------------------------------------------------------ */
/** Dónde mirar cuando no hay nada que encuadrar. Se centra en el área de
 * referencia, no en Sevilla: la aplicación cubre las nueve, y abrir el mapa
 * en Sevilla estando en Almería no ayuda a nadie. */
function vistaPorDefecto(zoom) {
  const cab = APP.indice && (APP.indice.consorcios || []).find(c => c.id === CTAN.id);
  if (cab && cab.bbox) {
    const [minLat, minLng, maxLat, maxLng] = cab.bbox;
    return [[(minLat + maxLat) / 2, (minLng + maxLng) / 2], zoom];
  }
  return [[37.4, -4.9], 7];   // Andalucía entera
}

function setMarkerStyle(marker, selected) {
  marker.setStyle(selected
    ? { radius: 9, color: colorTema("amber"), fillColor: colorTema("amber"), fillOpacity: 1, weight: 2 }
    : { radius: 6, color: colorTema("brand"), fillColor: colorTema("card"), fillOpacity: 1, weight: 2 });
}

function renderMap(containerEl, paradaIds, onMarkerClick, mapRef, opciones) {
  mapRef = mapRef || CURRENT_MAP_REF;
  if (mapRef.map) {
    mapRef.map.remove();
    mapRef.map = null;
  }
  const map = L.map(containerEl, { scrollWheelZoom: false });
  mapRef.map = map;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  const latlngs = [];
  const markers = {};
  (paradaIds || []).forEach(id => {
    const p = APP.data.paradas[id];
    if (p && p.lat != null && p.lng != null) {
      latlngs.push([p.lat, p.lng]);
      const marker = L.circleMarker([p.lat, p.lng], {
        radius: 6, weight: 2, color: colorTema("brand"), fillColor: colorTema("card"), fillOpacity: 1
      }).addTo(map).bindTooltip(p.nombre, { direction: "top" });
      marker.on("click", () => onMarkerClick && onMarkerClick(id));
      markers[id] = marker;
    }
  });
  // El recorrido, por donde va de verdad. Antes era una recta punteada de
  // parada a parada, y la interfaz tenía que avisar de que no era el
  // trazado real; con shapes.txt ya lo es, así que el aviso sobra.
  const trazado = (opciones && opciones.trazado) || null;
  if (trazado && trazado.length > 1) {
    L.polyline(trazado, { color: colorTema("brand"), weight: 4, opacity: 0.8 }).addTo(map);
  } else if (latlngs.length > 1) {
    L.polyline(latlngs, { color: colorTema("brand"), weight: 3, opacity: 0.55, dashArray: "1 8" }).addTo(map);
  }
  if (latlngs.length) {
    map.fitBounds(latlngs, { padding: [24, 24] });
  } else {
    map.setView(...vistaPorDefecto(11));
  }
  return { map, markers };
}

/* ------------------------------------------------------------------ */
/* Capa de red: municipios de lejos, paradas de cerca                   */
/* ------------------------------------------------------------------ */
/** A la escala del área metropolitana, 1.094 círculos son una mancha: no
 * se lee nada y no se puede pinchar en nada. Por debajo de este zoom el
 * mapa enseña el nivel de arriba del grafo tripartito — un municipio por
 * triángulo — y solo al acercarse aparecen sus paradas. Cualquier
 * municipio se puede desplegar a mano sin acercarse, tocando su
 * triángulo; tocándolo otra vez se vuelve a condensar.
 *
 * Agrupar por municipio no basta del todo: en el Aljarafe hay pueblos a
 * 1,3 km, así que de muy lejos sus triángulos se pisan unos a otros y se
 * vuelven impinchables. Por eso los que chocan en pantalla se funden en
 * un solo triángulo que, al tocarlo, despliega la lista de los
 * municipios que lleva dentro. */
const ZOOM_AGRUPADO = 13;

const MUNI_RADIO_MIN = 8;
const MUNI_RADIO_MAX = 17;

/** El círculo crece con las paradas que agrupa, para que de un vistazo se
 * vea dónde hay red de verdad y dónde cuatro paradas contadas. */
function radioDeMunicipios(municipios) {
  const paradas = municipios.reduce((n, m) => {
    const nodo = GRAFO.municipios.get(m);
    return n + (nodo ? nodo.paradas.length : 0);
  }, 0);
  const escala = Math.min(1, Math.sqrt(paradas) / Math.sqrt(70));
  return Math.round(MUNI_RADIO_MIN + (MUNI_RADIO_MAX - MUNI_RADIO_MIN) * escala);
}

/** Estilo del círculo de un municipio. El contorno es el del propio
 * `circleMarker` de Leaflet: no hay una segunda forma encima haciendo de
 * borde ni de anillo de selección, sólo `color` y `weight` de la figura.
 *  - condensado: relleno de marca, aro del color del papel;
 *  - desplegado: hueco, porque sus paradas ya se ven por debajo;
 *  - origen o destino de la ruta: el mismo aro, más grueso y en ámbar o
 *    azul, sin dibujar nada aparte. */
function estiloMunicipio(radio, abierto, extremo) {
  const base = {
    className: "muni-circulo",
    radius: radio,
    weight: extremo ? 4 : 2.5,
    fillOpacity: abierto ? 0.12 : 0.95,
    fillColor: colorTema("brand"),
    color: colorTema("card")
  };
  if (extremo === "origen") base.color = colorTema("amber");
  else if (extremo === "destino") base.color = colorTema("brand-2");
  else if (abierto) base.color = colorTema("brand");
  return base;
}

/** Junta en un mismo triángulo los municipios que a este zoom se pisarían
 * en pantalla. Gana el que más paradas tiene: es el que da nombre al
 * grupo y el que fija dónde se dibuja. */
function agruparMunicipiosEnPantalla(map, municipios) {
  const ordenados = municipios.slice().sort((a, b) =>
    GRAFO.municipios.get(b).paradas.length - GRAFO.municipios.get(a).paradas.length);
  const grupos = [];
  ordenados.forEach(municipio => {
    const nodo = GRAFO.municipios.get(municipio);
    const punto = map.latLngToLayerPoint([nodo.lat, nodo.lng]);
    const radio = radioDeMunicipios([municipio]);
    const grupo = grupos.find(g => punto.distanceTo(g.punto) < (g.radio + radio) * 1.15);
    if (grupo) {
      grupo.municipios.push(municipio);
      grupo.radio = radioDeMunicipios(grupo.municipios);
    } else {
      grupos.push({ municipios: [municipio], punto, radio, lat: nodo.lat, lng: nodo.lng });
    }
  });
  return grupos;
}

/** Monta sobre un mapa la capa de red y devuelve el mando para manejarla.
 *
 * `opciones`:
 *  - `onParada(id)`            qué hacer al tocar una parada.
 *  - `onGrupo(grupo, marca)`   qué hacer al tocar un triángulo.
 *  - `estilo`                  estilo de los círculos de parada.
 */
function crearCapaRed(map, opciones) {
  opciones = opciones || {};
  const estilo = opciones.estilo || { radius: 5, weight: 1.5, color: colorTema("card"), fillColor: colorTema("brand"), fillOpacity: 0.95 };

  const marcadores = {};          // paradaId -> circleMarker (los ya creados)
  const grupoDeParadas = new Map(); // municipio -> layerGroup con sus paradas
  const paradasDe = new Map();    // municipio -> [paradaId], sin crear nada
  const poblados = new Set();     // municipios cuyos marcadores ya existen
  const sueltas = L.layerGroup(); // paradas sin municipio conocido
  const circulos = L.layerGroup();
  const expandidos = new Set();
  const extremos = { origen: null, destino: null };
  const limites = [];
  let dibujados = [];             // grupos pintados ahora mismo

  const crearMarcador = id => {
    const p = APP.data.paradas[id];
    const marcador = L.circleMarker([p.lat, p.lng], estilo)
      .bindTooltip(p.nombre, { direction: "top" });
    marcador.on("click", () => opciones.onParada && opciones.onParada(id));
    marcadores[id] = marcador;
    return marcador;
  };

  // Los marcadores de un municipio se crean la primera vez que se enseña.
  // Con las nueve áreas son 5.009 paradas, y crearlas todas de golpe —cada
  // una un círculo de Leaflet con su etiqueta— costaba segundo y pico al
  // abrir Ruta para dibujar en pantalla las de un municipio.
  const poblar = municipio => {
    if (poblados.has(municipio)) return;
    poblados.add(municipio);
    const grupo = grupoDeParadas.get(municipio);
    (paradasDe.get(municipio) || []).forEach(id => grupo.addLayer(crearMarcador(id)));
  };

  Object.entries(APP.data.paradas).forEach(([id, p]) => {
    if (p.lat == null || p.lng == null) return;
    limites.push([p.lat, p.lng]);
    if (p.municipio) {
      if (!grupoDeParadas.has(p.municipio)) {
        grupoDeParadas.set(p.municipio, L.layerGroup());
        paradasDe.set(p.municipio, []);
      }
      paradasDe.get(p.municipio).push(id);
    } else {
      sueltas.addLayer(crearMarcador(id));   // son un puñado: no compensa aplazarlas
    }
  });

  const conMapa = GRAFO.lista.filter(m => {
    const nodo = GRAFO.municipios.get(m);
    return nodo && nodo.lat != null;
  });

  // Si el mapa aún no tiene vista, getZoom() es undefined: se da por
  // agrupado, que es como se abre. Dar por NO agrupado obligaría a crear de
  // golpe los marcadores de las 5.009 paradas de Andalucía.
  const agrupando = () => {
    const z = map.getZoom();
    return z == null || z < ZOOM_AGRUPADO;
  };

  /** Qué papel juega un grupo en la ruta: si lleva dentro el municipio
   * de origen o el de destino, se marca engordando su propio aro. */
  function papelDe(grupo) {
    if (extremos.origen && grupo.municipios.includes(extremos.origen)) return "origen";
    if (extremos.destino && grupo.municipios.includes(extremos.destino)) return "destino";
    return null;
  }

  function pintarMunicipios() {
    circulos.clearLayers();
    dibujados = agrupando() ? agruparMunicipiosEnPantalla(map, conMapa) : [];
    dibujados.forEach(grupo => {
      const abierto = grupo.municipios.some(m => expandidos.has(m));
      const marca = L.circleMarker([grupo.lat, grupo.lng],
        estiloMunicipio(grupo.radio, abierto, papelDe(grupo)));
      const paradas = grupo.municipios.reduce((n, m) => n + GRAFO.municipios.get(m).paradas.length, 0);
      // Una sola etiqueta por círculo: si lleva varios municipios dentro,
      // el número va escrito en su centro; si lleva uno, el nombre sale al
      // pasar por encima. (Atar dos etiquetas al mismo marcador no vale:
      // Leaflet sólo registra los eventos de la primera, y la permanente
      // se quedaba sin abrir.)
      if (grupo.municipios.length > 1) {
        // Desplegado el círculo se queda hueco, así que el número deja de
        // ir sobre el relleno de marca y pasa a escribirse en ese color.
        marca.bindTooltip(String(grupo.municipios.length), {
          permanent: true, direction: "center", offset: [0, 0],
          className: "muni-cuenta" + (abierto ? " hueca" : "")
        });
      } else {
        marca.bindTooltip(`${grupo.municipios[0]} · ${paradas} paradas`, { direction: "top" });
      }
      marca.on("click", () => {
        // Un solo municipio: el toque lo despliega o lo condensa. Varios:
        // no hay nada que desplegar hasta elegir cuál.
        if (grupo.municipios.length === 1) alternar(grupo.municipios[0], marca);
        if (opciones.onGrupo) opciones.onGrupo(grupo, marca);
      });
      grupo.marca = marca;
      circulos.addLayer(marca);
    });
  }

  function refrescar() {
    const agrupa = agrupando();
    grupoDeParadas.forEach((grupo, municipio) => {
      const verParadas = !agrupa || expandidos.has(municipio);
      if (verParadas) poblar(municipio);
      if (verParadas && !map.hasLayer(grupo)) grupo.addTo(map);
      if (!verParadas && map.hasLayer(grupo)) map.removeLayer(grupo);
    });
    if (!map.hasLayer(sueltas)) sueltas.addTo(map);
    // De cerca los círculos de municipio sólo estorban: ahí manda la parada.
    if (agrupa && !map.hasLayer(circulos)) circulos.addTo(map);
    if (!agrupa && map.hasLayer(circulos)) map.removeLayer(circulos);
    pintarMunicipios();
  }

  /** Despliega o condensa un municipio. `marca` es el círculo que se ha
   * tocado: se le cambia el estilo en el sitio para no repintarlos todos
   * y cerrar de paso el menú que acaba de abrirse. */
  function alternar(municipio, marca) {
    if (expandidos.has(municipio)) expandidos.delete(municipio);
    else expandidos.add(municipio);
    const grupo = grupoDeParadas.get(municipio);
    if (grupo) {
      const ver = !agrupando() || expandidos.has(municipio);
      if (ver) poblar(municipio);
      if (ver && !map.hasLayer(grupo)) grupo.addTo(map);
      if (!ver && map.hasLayer(grupo)) map.removeLayer(grupo);
    }
    const dibujado = dibujados.find(g => g.municipios.includes(municipio));
    if (marca && dibujado) {
      marca.setStyle(estiloMunicipio(dibujado.radio,
        dibujado.municipios.some(m => expandidos.has(m)), papelDe(dibujado)));
    }
  }

  /** Marca (o desmarca) un municipio como extremo de la ruta. No dibuja
   * nada nuevo: engorda el aro del círculo que ya está en el mapa. */
  function marcarExtremo(cual, municipio) {
    extremos[cual] = municipio || null;
    pintarMunicipios();
  }

  map.on("zoomend", refrescar);
  refrescar();

  return {
    marcadores, limites, expandidos, refrescar, alternar, marcarExtremo,
    estaExpandido: municipio => expandidos.has(municipio),
    agrupando,
    grupoDibujadoDe: municipio => dibujados.find(g => g.municipios.includes(municipio)),
    /** El marcador de una parada, creándolo si aún no existía. Si es de un
     * municipio que todavía no se ha poblado, se puebla entero: así el
     * marcador acaba dentro de su capa y no suelto sin mapa al que abrirse. */
    marcadorDe: paradaId => {
      if (marcadores[paradaId]) return marcadores[paradaId];
      const p = APP.data.paradas[paradaId];
      if (!p || p.lat == null) return null;
      if (p.municipio && grupoDeParadas.has(p.municipio)) {
        poblar(p.municipio);
        return marcadores[paradaId] || null;
      }
      const marcador = crearMarcador(paradaId);
      sueltas.addLayer(marcador);
      return marcador;
    },
    /** Deja a la vista una parada concreta aunque su municipio esté
     * condensado; si no, tocar un resultado no llevaría a ningún sitio. */
    asegurarVisible: paradaId => {
      const municipio = municipioDeParada(paradaId);
      if (!municipio) return;
      poblar(municipio);
      if (agrupando() && !expandidos.has(municipio)) {
        expandidos.add(municipio);
        refrescar();
      }
    }
  };
}

/* ------------------------------------------------------------------ */
/* Menú contextual de un municipio                                      */
/* ------------------------------------------------------------------ */
/** Leaflet solo corta la propagación de `mousedown` dentro de un globo,
 * no la del `click`, así que tocar cualquier botón de dentro llega
 * también al mapa y este cierra el globo por su cuenta. Estos menús
 * cambian de contenido sin cerrarse (elegir municipio, desplegar sus
 * paradas), así que hay que cortarlo a mano. */
function sinPropagarClic(elemento) {
  L.DomEvent.on(elemento, "click", L.DomEvent.stopPropagation);
  return elemento;
}

/** El mismo círculo del mapa, en pequeño, para encabezar sus menús. */
function puntoMunicipio() {
  return '<span class="muni-punto" aria-hidden="true"></span>';
}

/** Qué es un municipio, qué líneas lo recorren y qué puedes hacer con él.
 * Es el sitio donde el nivel "municipio" del grafo se toca con el dedo:
 * desde aquí se despliegan sus paradas y se usa el municipio entero como
 * extremo de una ruta. `volver`, si viene, pinta una vuelta al grupo del
 * que se ha llegado. */
function buildMunicipioPopupContent(municipio, capa, modo, marca, volver) {
  const nodo = GRAFO.municipios.get(municipio);
  const wrap = document.createElement("div");
  wrap.className = "muni-popup";
  const lineas = [...(nodo ? nodo.lineas : [])]
    .map(slug => APP.data.lineas.find(l => l.slug === slug))
    .filter(Boolean)
    .sort((a, b) => a.titulo.localeCompare(b.titulo, "es"));

  wrap.innerHTML = `
    ${volver ? '<button type="button" class="muni-popup-volver" id="muniVolver">‹ Volver</button>' : ""}
    <div class="muni-popup-title">${puntoMunicipio()} ${escapeHtml(municipio)}</div>
    <div class="muni-popup-sub">${nodo ? nodo.paradas.length : 0} paradas · ${lineas.length} línea${lineas.length === 1 ? "" : "s"}</div>`;
  if (volver) wrap.querySelector("#muniVolver").addEventListener("click", volver);

  const btnDesplegar = document.createElement("button");
  btnDesplegar.type = "button";
  btnDesplegar.className = "btn-chip";
  const pintarBoton = () => {
    btnDesplegar.textContent = capa.estaExpandido(municipio)
      ? "Condensar sus paradas"
      : `Ver sus ${nodo ? nodo.paradas.length : 0} paradas`;
  };
  pintarBoton();
  btnDesplegar.addEventListener("click", () => { capa.alternar(municipio, marca); pintarBoton(); });
  wrap.appendChild(btnDesplegar);

  if (lineas.length) {
    const lista = document.createElement("div");
    lista.className = "muni-popup-lineas";
    lineas.forEach(l => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "muni-popup-fila";
      row.innerHTML = `<span class="muni-popup-code">${escapeHtml(codigoLinea(l.titulo))}</span>
        <span class="muni-popup-fila-sub">${escapeHtml(municipiosDeLinea(l.slug).join(" · "))}</span>`;
      row.addEventListener("click", () => openLineModal(l.slug));
      lista.appendChild(row);
    });
    wrap.appendChild(lista);
  }

  wrap.appendChild(accionesDeMunicipio(municipio, modo));
  return sinPropagarClic(wrap);
}

/** Botones de ruta de un municipio: es lo que lo convierte en un vértice
 * "Municipio: —" del cálculo, igual que una parada o un punto marcado. */
function accionesDeMunicipio(municipio, modo) {
  const acciones = document.createElement("div");
  acciones.className = "stop-popup-actions";
  const punto = { type: "municipio", nombre: municipio };
  const cerrar = () => {
    if (CURRENT_ROUTE_MAP) CURRENT_ROUTE_MAP.closePopup();
  };

  if (modo === "ruta") {
    const esOrigen = ROUTE_ORIGIN && ROUTE_ORIGIN.type === "municipio" && ROUTE_ORIGIN.nombre === municipio;
    const esDestino = ROUTE_DESTINO && ROUTE_DESTINO.type === "municipio" && ROUTE_DESTINO.nombre === municipio;
    const btnOrigen = document.createElement("button");
    btnOrigen.type = "button";
    btnOrigen.className = "btn-chip" + (esOrigen ? " armed" : "");
    btnOrigen.innerHTML = esOrigen ? icono("cerrar") + "Quitar origen" : icono("pin") + "Salgo de aquí";
    btnOrigen.addEventListener("click", () => {
      if (esOrigen) clearEndpoint("origen"); else setEndpoint("origen", punto);
      cerrar();
    });
    acciones.appendChild(btnOrigen);

    const btnDestino = document.createElement("button");
    btnDestino.type = "button";
    btnDestino.className = "btn-chip" + (esDestino ? " armed" : "");
    btnDestino.innerHTML = esDestino ? icono("cerrar") + "Quitar destino" : icono("bandera") + "Voy aquí";
    btnDestino.addEventListener("click", () => {
      if (esDestino) clearEndpoint("destino"); else setEndpoint("destino", punto);
      cerrar();
    });
    acciones.appendChild(btnDestino);
  } else {
    const btnIr = document.createElement("button");
    btnIr.type = "button";
    btnIr.className = "btn-chip";
    btnIr.innerHTML = icono("brujula") + "Ir a este municipio";
    btnIr.addEventListener("click", () => {
      cerrar();
      irAPantalla("screenRuta");
      setTimeout(() => {
        buildStopsDatalist();
        setEndpoint("destino", punto);
        if (ROUTE_ORIGIN) onCalcularRuta();
      }, 90);
    });
    acciones.appendChild(btnIr);
  }
  return acciones;
}

/** Menú de un triángulo que lleva varios municipios dentro: la lista
 * para elegir de cuál se habla. Al elegir uno se cambia el contenido del
 * mismo globo, con vuelta atrás. */
function buildGrupoPopupContent(grupo, capa, modo, marca, popup) {
  const wrap = document.createElement("div");
  wrap.className = "muni-popup";
  const paradas = grupo.municipios.reduce((n, m) => n + GRAFO.municipios.get(m).paradas.length, 0);
  wrap.innerHTML = `
    <div class="muni-popup-title">${puntoMunicipio()} ${grupo.municipios.length} municipios aquí</div>
    <div class="muni-popup-sub">${paradas} paradas · demasiado juntos para separarlos a este zoom</div>`;

  const lista = document.createElement("div");
  lista.className = "muni-popup-lineas";
  grupo.municipios.slice().sort((a, b) => a.localeCompare(b, "es")).forEach(municipio => {
    const nodo = GRAFO.municipios.get(municipio);
    const row = document.createElement("button");
    row.type = "button";
    row.className = "muni-popup-fila";
    row.innerHTML = `<span class="muni-popup-fila-name">${escapeHtml(municipio)}</span>
      <span class="muni-popup-fila-sub">${nodo.paradas.length} paradas · ${nodo.lineas.size} línea${nodo.lineas.size === 1 ? "" : "s"}</span>`;
    row.addEventListener("click", () => {
      popup.setContent(buildMunicipioPopupContent(municipio, capa, modo, marca,
        () => popup.setContent(buildGrupoPopupContent(grupo, capa, modo, marca, popup))));
    });
    lista.appendChild(row);
  });
  wrap.appendChild(lista);
  return sinPropagarClic(wrap);
}

/** Abre el menú del triángulo tocado: la ficha del municipio si lleva uno
 * solo, o la lista para elegir si lleva varios. */
function abrirMenuGrupo(map, grupo, marca, capa, modo) {
  // El globo no puede ser más alto que el mapa: si lo es, Leaflet no
  // tiene a dónde desplazarlo y se sale por arriba del recuadro.
  const alto = Math.max(170, map.getSize().y - 80);
  const popup = L.popup({ minWidth: 240, maxHeight: alto }).setLatLng(marca.getLatLng());
  popup.setContent(grupo.municipios.length === 1
    ? buildMunicipioPopupContent(grupo.municipios[0], capa, modo, marca)
    : buildGrupoPopupContent(grupo, capa, modo, marca, popup));
  popup.openOn(map);
}

/* ------------------------------------------------------------------ */
/* Render: horario completo + tablero de próxima salida + PDF          */
/* ------------------------------------------------------------------ */
/** El horario de una parada, para un día concreto y una línea.
 *
 * Ya no hay "cubos" de laborable/sábado/domingo: se piden los pasos de esa
 * fecha y se agrupan por hora para pintarlos. Con el calendario real, un
 * lunes festivo enseña el horario de festivo y no el de un lunes
 * cualquiera. */
function horarioDelDia(paradaId, fecha, lineaSlug) {
  const porHora = new Map();
  pasosEnParada(paradaId, fecha, lineaSlug).forEach(paso => {
    const m = paso.min % 1440;
    const h = Math.floor(m / 60);
    if (!porHora.has(h)) porHora.set(h, new Set());
    porHora.get(h).add(m % 60);
  });
  return [...porHora.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([h, mins]) => ({ hora: h, minutos: [...mins].sort((a, b) => a - b) }));
}

function renderBoard(container, paradaId, lineaSlug) {
  const fmt = formatDeparture(proximaSalida(paradaId, new Date(), { lineaSlug }));
  container.innerHTML = `
    <div class="board">
      <div class="board-label">PRÓXIMA SALIDA</div>
      <div class="board-time">${fmt.main}</div>
      <div class="board-sub">${escapeHtml(fmt.sub)}</div>
    </div>
`;
}

const DIAS_HORARIO = 4;   // hoy y los tres siguientes: lo que se consulta de verdad

function renderHorarioSection(container, paradaId, lineaSlug) {
  container.innerHTML = "";
  const hoy = new Date();
  for (let i = 0; i < DIAS_HORARIO; i++) {
    const fecha = new Date(hoy.getTime() + i * 86400000);
    const franjas = horarioDelDia(paradaId, fecha, lineaSlug);
    if (!franjas.length) continue;
    const details = document.createElement("details");
    details.open = i === 0;
    const summary = document.createElement("summary");
    summary.textContent = i === 0 ? "Hoy" : nombreDeDia(fecha);
    details.appendChild(summary);

    const grid = document.createElement("div");
    grid.className = "horagrid";
    franjas.forEach(({ hora, minutos }) => {
      const cell = document.createElement("div");
      cell.className = "horacell";
      const label = document.createElement("span");
      label.className = "horalabel";
      label.textContent = String(hora).padStart(2, "0") + "h";
      cell.appendChild(label);
      const mins = document.createElement("div");
      mins.className = "minchips";
      minutos.forEach(m => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = String(m).padStart(2, "0");
        mins.appendChild(chip);
      });
      cell.appendChild(mins);
      grid.appendChild(cell);
    });
    details.appendChild(grid);
    container.appendChild(details);
  }
  if (!container.children.length) {
    container.innerHTML = '<p class="empty">No hay horario disponible para esta parada.</p>';
  }
}

function nombreDeDia(fecha) {
  const d = fecha.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" });
  return d.charAt(0).toUpperCase() + d.slice(1);
}

/** El PDF oficial es de la línea, no de la parada: el GTFS trae una
 * route_url por línea que apunta a su horario en la web del consorcio. */
function renderPdfLinea(container, lineaSlug) {
  container.innerHTML = "";
  const linea = lineaPorSlug(lineaSlug);
  if (linea && linea.url) {
    const a = document.createElement("a");
    a.href = linea.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.className = "btn btn-pdf";
    a.innerHTML = icono("reloj") + "Horario oficial de la línea";
    container.appendChild(a);
  }
}

/** Vista de detalle completa de una línea: mapa + lista de TODAS sus
 * paradas (unión de todos sus recorridos, en el orden fusionado
 * `orden_unificado`), cada una con su propia próxima salida — contando
 * cualquier recorrido de la línea que pase por ahí — y mostrando qué
 * recorrido concreto sigue ese autobús. Cada parada es un acordeón: al
 * abrirla se ve el horario completo de hoy y los PDFs oficiales de cada
 * recorrido que pasa por esa parada. Reutilizada tanto desde "Buscar
 * línea" como desde el drill-down de Geolocalización. `defaultStopId`,
 * si se pasa, se abre y se centra al cargar. `onBack`, si se pasa,
 * añade un botón de volver. */
function renderLineDetail(container, linea, defaultStopId, onBack, mapRef) {
  mapRef = mapRef || CURRENT_MAP_REF;
  container.innerHTML = `
    ${onBack ? '<button class="btn-back" id="btnBack">← Volver</button>' : ""}
    <h3 class="detail-title"><span class="linea-badge">${escapeHtml(codigoLinea(linea.titulo))}</span> ${escapeHtml(nombreSinCodigo(linea.titulo))} <button type="button" class="btn-fav${esFavoritoLinea(linea.slug) ? " es-fav" : ""}" id="btnFavLinea" title="Guardar esta línea">${icono("estrella")}</button></h3>

    <div id="avisosDeLinea"></div>
    <h4 class="section-title" style="margin-top:14px;">Salidas por sentido</h4>
    <div class="cabecera-list" id="cabecerasBox"></div>

    <div id="mapBox" class="mapbox"></div>
    <h4 class="section-title">Paradas y próxima salida</h4>

    <div id="stopsList"></div>
  `;
  if (onBack) container.querySelector("#btnBack").addEventListener("click", onBack);

  // Si el consorcio ha publicado algo de esta línea, se dice aquí: es
  // donde alguien viene a mirar antes de plantarse en la parada.
  const cajaAvisos = container.querySelector("#avisosDeLinea");
  const pintarAvisosLinea = () => {
    const suyos = avisosDeLinea(linea.slug);
    cajaAvisos.innerHTML = suyos.length
      ? `<div class="itin-leg-warn" style="margin-top:10px;">${icono("aviso")}<span>${
          suyos.map(a => escapeHtml(a.titulo)).join(" · ")}</span></div>`
      : "";
  };
  pintarAvisosLinea();
  if (!AVISOS.fecha) cargarAvisos(false).then(pintarAvisosLinea);
  const cabecerasBox = container.querySelector("#cabecerasBox");
  const repintarCabeceras = () => renderSalidasDeLineaEn(cabecerasBox, linea, repintarCabeceras);
  repintarCabeceras();
  container.querySelector("#btnFavLinea").addEventListener("click", e => {
    toggleFavoritoLinea(linea.slug);
    pintarEstrella(e.currentTarget, esFavoritoLinea(linea.slug));
    repintarCabeceras();
  });

  const stopsListEl = container.querySelector("#stopsList");
  const paradasValidas = (linea.orden_unificado || []).filter(id => APP.data.paradas[id]);
  if (paradasValidas.length === 0) {
    stopsListEl.innerHTML = '<p class="empty">Esta línea no tiene paradas con datos.</p>';
    return;
  }

  // El trazado de la línea: el del bloque más largo, que es el recorrido
  // completo. Los demás son recortes suyos.
  const bloqueLargo = CTAN.bloques
    .filter(b => b.lineaSlug === linea.slug && b.trazado)
    .sort((a, b) => b.paradas.length - a.paradas.length)[0];
  const trazadoLinea = bloqueLargo ? CTAN.trazados[bloqueLargo.trazado] : null;

  const { markers } = renderMap(container.querySelector("#mapBox"), paradasValidas, id => {
    const row = stopsListEl.querySelector(`.stoprow[data-id="${cssEscape(id)}"]`);
    if (row) {
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      openStopRow(row);
    }
  }, mapRef, { trazado: trazadoLinea });

  function openStopRow(row) {
    stopsListEl.querySelectorAll(".stoprow-body").forEach(b => { if (b !== row.querySelector(".stoprow-body")) b.hidden = true; });
    const body = row.querySelector(".stoprow-body");
    const wasHidden = body.hidden;
    body.hidden = !wasHidden ? true : false;
    const id = row.dataset.id;
    Object.entries(markers).forEach(([mid, m]) => setMarkerStyle(m, mid === id));
    const p = APP.data.paradas[id];
    if (wasHidden && p.lat != null && mapRef.map) mapRef.map.panTo([p.lat, p.lng]);
    if (wasHidden && !body.dataset.built) {
      renderBoard(body.querySelector(".boardBox"), id, linea.slug);
      renderPdfLinea(body.querySelector(".pdfBox"), linea.slug);
      renderHorarioSection(body.querySelector(".horarioBox"), id, linea.slug);
      body.dataset.built = "1";
    }
  }

  let firstRow = null;
  paradasValidas.forEach((id, idx) => {
    const p = APP.data.paradas[id];
    const dep = proximaSalida(id, new Date(), { lineaSlug: linea.slug });
    const fmt = formatDeparture(dep);
    // Bajo el nombre de la parada va su municipio, no el nombre de la
    // variante. "M-101A Circular Bormujos - Castilleja - Tomares - S Juan
    // A - Mairena (sent A)" ocupaba seis renglones en un móvil estrecho
    // —ciento cuarenta píxeles por parada, ocho mil de lista— para repetir
    // en cada fila algo que ya dice el título de la ficha.
    const recorridoLabel = municipioDeParada(id) || "";

    const row = document.createElement("div");
    row.className = "stoprow";
    row.dataset.id = id;
    row.innerHTML = `
      <button type="button" class="stoprow-head">
        <span class="stoprow-order">${idx + 1}</span>
        <span class="stoprow-name">${escapeHtml(p.nombre)}<span class="stoprow-recorrido">${escapeHtml(recorridoLabel)}</span></span>
        <span class="stoprow-time">${fmt.main}<span class="stoprow-sub">${escapeHtml(fmt.sub)}</span></span>
      </button>
      <div class="stoprow-body" hidden>
        <div class="boardBox"></div>
        <div class="pdfBox"></div>
        <div class="horarioBox"></div>
      </div>
    `;
    row.querySelector(".stoprow-head").addEventListener("click", () => openStopRow(row));
    stopsListEl.appendChild(row);
    if (id === defaultStopId || !firstRow) firstRow = row;
  });

  openStopRow(firstRow);
  if (defaultStopId) firstRow.scrollIntoView({ block: "nearest" });
}

/* ------------------------------------------------------------------ */
/* Sistema de modal genérico                                           */
/* ------------------------------------------------------------------ */
function closeModal() {
  const root = document.getElementById("modalRoot");
  if (CURRENT_MODAL_MAP_REF.map) { CURRENT_MODAL_MAP_REF.map.remove(); CURRENT_MODAL_MAP_REF.map = null; }
  root.innerHTML = "";
}

function openModal(buildContentFn) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <button class="modal-close" id="modalCloseBtn" type="button">${icono("cerrar")}Cerrar</button>
        <div style="clear:both;"></div>
        <div id="modalContent"></div>
      </div>
    </div>`;
  root.querySelector("#modalOverlay").addEventListener("click", e => {
    if (e.target.id === "modalOverlay") closeModal();
  });
  root.querySelector("#modalCloseBtn").addEventListener("click", closeModal);
  buildContentFn(root.querySelector("#modalContent"));
}

function nombreDeArea(idc) {
  const c = APP.indice && (APP.indice.consorcios || []).find(x => x.id === idc);
  return c ? c.nombre : "esta área";
}

/** Abre un modal que necesita los horarios de una o varias áreas. Si ya
 * están en memoria es lo mismo que `openModal`; si no, se dice que se
 * están bajando y el contenido se pinta en cuanto llegan. Es lo que hace
 * que se pueda tocar una parada de Almería teniendo cargada Sevilla sin
 * haber bajado antes los cinco megas de las nueve áreas. */
function openModalConHorarios(areas, buildContentFn) {
  const faltan = [...new Set((Array.isArray(areas) ? areas : [areas])
    .filter(a => a != null && !CTAN.horarios.has(a)))];
  if (!faltan.length) return openModal(buildContentFn);
  openModal(container => {
    container.innerHTML = `<p class="empty">Cargando los horarios de ${
      escapeHtml(nombreDeArea(faltan[0]))}…</p>`;
    asegurarHorarios(faltan).then(() => {
      // Si mientras tanto se ha cerrado o se ha abierto otro modal, no se
      // pinta nada encima.
      if (document.getElementById("modalContent") === container) buildContentFn(container);
    }).catch(() => {
      container.innerHTML = '<p class="empty">No se han podido cargar los horarios. Comprueba la conexión.</p>';
    });
  });
}

/** Abre una línea completa (mapa + paradas + horarios + PDFs) dentro de
 * un modal. Se usa desde cualquier sitio donde se pulse el nombre de
 * una línea: itinerario de ruta, popup de parada, etc. */
function openLineModal(lineaSlug, defaultStopId) {
  openModalConHorarios(areaDeLinea(lineaSlug), container => {
    const linea = APP.data.lineas.find(l => l.slug === lineaSlug);
    if (!linea) { container.innerHTML = '<p class="empty">Esa línea ya no está en los datos.</p>'; return; }
    renderLineDetail(container, linea, defaultStopId || (linea.orden_unificado || [])[0], null, CURRENT_MODAL_MAP_REF);
  });
}

/** Contenido "todas las líneas de esta parada", con horario completo

  btnNotif.addEventListener("click", () => abrirDialogoNotificacion(stopId, null, () => {

      </div>

}

/** Los nombres de parada vienen en mayúsculas del consorcio. Como
 * etiqueta de destino quedan a gritos y desentonan al lado de los
 * municipios ("hacia PLAZA DE ARMAS" junto a "hacia Guillena"), así que
 * se pasan a capitales iniciales dejando en minúscula las partículas. */
const PARTICULAS = new Set(["de", "del", "la", "las", "el", "los", "y", "a", "al", "en"]);

function nombreLegible(texto) {
  const bruto = String(texto || "");
  if (bruto !== bruto.toUpperCase()) return bruto;   // ya viene escrito bien
  return bruto.toLowerCase().replace(/[a-zà-ÿñ][\wà-ÿñ'’]*/g, (palabra, i) =>
    i > 0 && PARTICULAS.has(palabra) ? palabra : palabra.charAt(0).toUpperCase() + palabra.slice(1));
}

/** Escapa un valor para usarlo dentro de un selector CSS de atributo
 * (los IDs de parada son numéricos o "s-slug", pero por seguridad). */
function cssEscape(s) {
  return String(s).replace(/["\\]/g, "\\$&");
}

/* ------------------------------------------------------------------ */
/* Pantalla "Líneas": favoritas arriba, listado completo debajo        */
/* ------------------------------------------------------------------ */
/** Todos los municipios del catálogo, no sólo los de las áreas que ya
 * tienen horarios: si el desplegable escondiera Almería hasta haberla
 * bajado, no habría manera de llegar a ella. Los horarios del área se
 * piden al elegirla. */
function municipiosConLineas() {
  return GRAFO.lista.slice();
}

/** El área a la que pertenece un municipio, por sus paradas. */
function areaDeMunicipio(nombre) {
  const m = GRAFO.municipios.get(nombre);
  if (!m || !m.paradas.length) return null;
  return areaDeParada(m.paradas[0]);
}

function buildMunicipioOptions() {
  const sel = document.getElementById("selMunicipio");
  sel.innerHTML = '<option value="">Todos los municipios</option>' +
    municipiosConLineas().map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
}

/** El título de la línea sin su código delante, que ya se pinta aparte
 * como distintivo. */
function nombreSinCodigo(titulo) {
  const codigo = codigoLinea(titulo);
  return String(titulo).replace(new RegExp("^\\s*" + codigo.replace(/[-]/g, "\\-") + "\\s*-?\\s*"), "").trim() || String(titulo);
}

/** Código corto de la línea ("M-177") extraído del título completo. */
function codigoLinea(titulo) {
  const m = String(titulo).match(/^\s*([A-Za-zÀ-ÿ]?-?\d+[A-Za-z]?)/);
  return m ? m[1] : String(titulo).slice(0, 6);
}

/** Extrae "Origen → Destino" del nombre descriptivo que ctas.es da a
 * cada variante (p.ej. "M-177 Guillena - Camas - Sevilla (directo)" →
 * Guillena / Sevilla). Es más informativo para orientarse que la primera
 * y última parada, porque la mayoría de recorridos son circulares y
 * empiezan y acaban físicamente en el mismo sitio. */
function origenDestinoVariante(nombreVariante) {
  let limpio = String(nombreVariante || "").replace(/^\s*[A-Za-zÀ-ÿ]?-?\d+[A-Za-z]?\s*/, "");
  limpio = limpio.replace(/\s*\([^)]*\)\s*/g, " ").trim();
  const partes = limpio.split("-").map(p => p.trim()).filter(Boolean);
  if (!partes.length) return null;
  return { origen: partes[0], destino: partes[partes.length - 1] };
}

/* ------------------------------------------------------------------ */
/* Puntos de referencia de una línea                                    */
/* ------------------------------------------------------------------ */
/** Un "punto de referencia" responde a "¿desde qué parada y hacia dónde
 * quiero mirar esta línea?". Sustituye a las antiguas cabeceras, que
 * ataban las salidas al sitio donde arranca cada recorrido y por eso
 * dejaban fuera los autobuses que pasan por tu parada habiendo salido de
 * otro sitio.
 *
 * Mientras no elijas nada se enseña por dónde empieza cada trayecto de la
 * línea. Y "trayecto" son los bloques reconstruidos, no las variantes: la
 * primera parada de una variante es sólo la cabecera de la ida, así que
 * mirando ahí la vuelta no aparecía por ningún lado. En cuanto eliges
 * parada — primero municipio, luego parada — manda la tuya. */
function referenciasPorDefecto(linea) {
  const refs = [];
  const vistas = new Set();
  CTAN.bloques.filter(b => b.lineaSlug === linea.slug).forEach(bloque => {
    const primera = bloque.paradas[0];
    if (!APP.data.paradas[primera]) return;
    sentidosEnParada(primera, linea.slug).forEach(s => {
      const clave = primera + "|" + s.sentidoClave;
      if (vistas.has(clave)) return;
      vistas.add(clave);
      refs.push({ paradaId: primera, sentidoClave: s.sentidoClave, propia: false });
    });
  });
  return refs;
}

function referenciasDeLinea(linea) {
  const fav = FAVORITOS.lineas.find(l => l.slug === linea.slug);
  const propias = (fav && Array.isArray(fav.referencias) ? fav.referencias : [])
    .filter(r => r && APP.data.paradas[r.paradaId])
    .map(r => ({ paradaId: r.paradaId, sentidoClave: r.sentidoClave || null, propia: true }));
  return propias.length ? propias : referenciasPorDefecto(linea);
}

function mismaReferencia(a, b) {
  return a.paradaId === b.paradaId && (a.sentidoClave || null) === (b.sentidoClave || null);
}

function anadirReferencia(lineaSlug, paradaId, sentidoClave) {
  const fav = FAVORITOS.lineas.find(l => l.slug === lineaSlug);
  if (!fav) return;
  if (!Array.isArray(fav.referencias)) fav.referencias = [];
  const nueva = { paradaId, sentidoClave: sentidoClave || null };
  if (!fav.referencias.some(r => mismaReferencia(r, nueva))) fav.referencias.push(nueva);
  guardarFavoritos();
}

function quitarReferencia(lineaSlug, referencia) {
  const fav = FAVORITOS.lineas.find(l => l.slug === lineaSlug);
  if (!fav || !Array.isArray(fav.referencias)) return;
  fav.referencias = fav.referencias.filter(r => !mismaReferencia(r, referencia));
  guardarFavoritos();
}

/** Cuando quedan pocos minutos, la pregunta deja de ser "¿cuándo pasa?"
 * y pasa a ser "¿me da tiempo o espero al siguiente?". Esta es la
 * respuesta: la salida que va después de la inminente.
 *
 * Sólo se enseña en ese caso. Ponerla en todas las filas era lo que
 * convertía el listado en un horario disfrazado; aquí decide si echas a
 * correr, y saber que el siguiente es dentro de diez minutos —o que ya no
 * hay otro— cambia lo que haces. */
function salidaDespuesDe(paradaId, dep, filtro) {
  if (!dep || dep.dias !== 0) return { dep: null, ultimo: false };
  const ahora = new Date();
  const tras = new Date(ahora);
  tras.setHours(dep.h, dep.m + 1, 0, 0);
  const siguiente = proximaSalida(paradaId, tras, filtro);
  // Si la siguiente ya es de otro día, hoy no queda ninguna más.
  if (!siguiente || siguiente.dias !== 0) return { dep: null, ultimo: true };
  return { dep: siguiente, ultimo: false };
}

/** Próximas salidas de una línea en un punto de referencia: se fusionan
 * TODOS los recorridos que pasan por esa parada en ese sentido, vengan de
 * la cabecera que vengan. Devuelve además las siguientes horas, para
 * poder enseñar "y luego a las…". */
function salidasDeReferencia(linea, ref, cuantas) {
  const parada = APP.data.paradas[ref.paradaId];
  if (!parada) return null;
  const sentidos = sentidosEnParada(ref.paradaId, linea.slug);
  if (!sentidos.length) return null;
  const grupo = ref.sentidoClave ? sentidos.find(s => s.sentidoClave === ref.sentidoClave) : null;
  const filtro = { lineaSlug: linea.slug, sentidoClave: grupo ? grupo.sentidoClave : null };
  const dep = proximaSalida(ref.paradaId, new Date(), filtro);

  return {
    ...ref,
    paradaNombre: parada.nombre,
    municipio: municipioDeParada(ref.paradaId),
    etiqueta: grupo ? grupo.etiqueta : (sentidos[0] ? sentidos[0].etiqueta : linea.titulo),
    numSentidos: sentidos.length,
    dep, filtro
  };
}

/** Todas las referencias de una línea, resueltas y ordenadas por
 * cercanía de la próxima salida. */
function salidasDeLinea(linea, cuantas) {
  return referenciasDeLinea(linea)
    .map(ref => salidasDeReferencia(linea, ref, cuantas))
    .filter(Boolean)
    .sort((a, b) => {
      const av = a.dep ? a.dep.dias * 1440 + a.dep.h * 60 + a.dep.m : Infinity;
      const bv = b.dep ? b.dep.dias * 1440 + b.dep.h * 60 + b.dep.m : Infinity;
      return av - bv;
    });
}

/** Elegir "mis paradas" en una línea, en dos pasos: municipio → parada.
 * Empezar por el municipio es lo que pide el caso real: quiero ver la
 * M-177 desde Guillena y también desde Sevilla, y en cada sitio desde una
 * parada distinta. */
function abrirSelectorReferencias(linea, onCambio) {
  let municipioElegido = null;
  openModal(container => {
    const pintar = () => {
      const actuales = referenciasDeLinea(linea);
      const fav = FAVORITOS.lineas.find(l => l.slug === linea.slug);
      const tienePropias = !!(fav && Array.isArray(fav.referencias) && fav.referencias.length);
      const municipios = municipiosDeLinea(linea.slug);
      container.innerHTML = `
        <h3 class="detail-title">Tus paradas en esta línea</h3>
        <div class="detail-meta">${escapeHtml(linea.titulo)}</div>
        <div class="selector-bloque">
          <div class="selector-titulo">${tienePropias ? "Mirando desde" : "Por defecto: las cabeceras de la línea"}</div>
          <div id="refsActuales"></div>
        </div>
        <div class="selector-bloque">
          <div class="selector-titulo">Añadir una parada · elige municipio</div>
          <div class="chip-row" id="refMunicipios">
            ${municipios.map(m => `<button type="button" class="muni-chip${m === municipioElegido ? " active" : ""}" data-muni="${escapeHtml(m)}">${escapeHtml(m)}</button>`).join("")}
          </div>
          <div id="refParadas"></div>
        </div>`;

      const lista = container.querySelector("#refsActuales");
      actuales.forEach(ref => {
        const info = salidasDeReferencia(linea, ref, 1);
        const row = document.createElement("div");
        row.className = "linea-row";
        row.innerHTML = `<span class="linea-row-name">${escapeHtml(APP.data.paradas[ref.paradaId].nombre)}
            <span class="linea-row-muni">${escapeHtml((info && info.municipio) || "")}${info && info.etiqueta ? " · hacia " + escapeHtml(info.etiqueta) : ""}</span>
          </span>`;
        if (tienePropias) {
          const quitar = document.createElement("button");
          quitar.type = "button";
          quitar.className = "btn-fav";
          quitar.innerHTML = icono("cerrar");
          quitar.title = "Quitar esta parada";
          quitar.addEventListener("click", e => {
            e.stopPropagation();
            quitarReferencia(linea.slug, ref);
            pintar();
            if (onCambio) onCambio();
          });
          row.appendChild(quitar);
        }
        lista.appendChild(row);
      });

      container.querySelectorAll("#refMunicipios .muni-chip").forEach(btn => {
        btn.addEventListener("click", () => { municipioElegido = btn.dataset.muni; pintar(); });
      });

      const caja = container.querySelector("#refParadas");
      if (!municipioElegido) {
        caja.innerHTML = '<p class="empty">Elige primero un municipio.</p>';
        return;
      }
      const paradas = paradasDeMunicipioEnLinea(municipioElegido, linea.slug);
      if (!paradas.length) {
        caja.innerHTML = '<p class="empty">Esta línea no tiene paradas ahí.</p>';
        return;
      }
      caja.innerHTML = "";
      paradas.forEach(pid => {
        sentidosEnParada(pid, linea.slug).forEach(s => {
          const ya = actuales.some(r => mismaReferencia(r, { paradaId: pid, sentidoClave: s.sentidoClave }));
          const fmt = formatDeparture(s.dep);
          const row = document.createElement("div");
          row.className = "linea-row";
          row.innerHTML = `<span class="linea-row-name">${escapeHtml(APP.data.paradas[pid].nombre)}
              <span class="linea-row-muni">hacia ${escapeHtml(s.etiqueta)}</span>
            </span>
            <span class="cabecera-time">${escapeHtml(fmt.main)}<span class="cabecera-sub">${escapeHtml(fmt.sub)}</span></span>
            <span class="btn-fav${ya ? " es-fav" : ""}">${icono("estrella")}</span>`;
          row.addEventListener("click", () => {
            if (ya) quitarReferencia(linea.slug, { paradaId: pid, sentidoClave: s.sentidoClave });
            else anadirReferencia(linea.slug, pid, s.sentidoClave);
            pintar();
            if (onCambio) onCambio();
          });
          caja.appendChild(row);
        });
      });
    };
    pintar();
  });
}

/** Un renglón por punto de referencia: hacia dónde va como título, la
 * parada y su municipio debajo, y la próxima salida medida ahí. */
function renderSalidasDeLineaEn(contenedor, linea, onCambio) {
  const refs = salidasDeLinea(linea, 2);
  contenedor.innerHTML = "";
  if (!refs.length) {
    contenedor.innerHTML = '<p class="empty">Sin salidas con datos en esta línea.</p>';
    return;
  }
  // La misma fila que en Inicio: cuánto falta delante y la hora debajo.
  // Se cae el "luego 16:30 · 17:00": tres horas por fila para responder a
  // "¿cuándo pasa el próximo?" es enseñar el horario entero disfrazado, y
  // el horario completo ya está a un toque.
  refs.forEach(ref => {
    const espera = formatEspera(ref.dep);
    const tras = espera.urgente ? salidaDespuesDe(ref.paradaId, ref.dep, ref.filtro) : { dep: null, ultimo: false };
    const seguimiento = filaSiguiente({
      paradaId: ref.paradaId,
      siguiente: tras.dep ? formatEspera(tras.dep) : null,
      ultimoDeHoy: tras.ultimo
    });
    const row = document.createElement("div");
    row.className = "salida-fila";
    row.innerHTML = `
      <span class="cabecera-ico">${icono("parada")}</span>
      <span class="salida-cuerpo">
        <span class="salida-hacia">hacia ${escapeHtml(ref.etiqueta)}</span>
        <span class="salida-parada">${escapeHtml(ref.paradaNombre)}</span>
      </span>
      <span class="salida-cuando${espera.urgente ? " ya" : ""}">${escapeHtml(espera.cuando)}
        <span class="salida-reloj">${escapeHtml(espera.reloj)}</span>
      </span>`;
    row.addEventListener("click", () => abrirMenuReferencia(linea, ref, onCambio));
    contenedor.appendChild(row);
    if (seguimiento) contenedor.insertAdjacentHTML("beforeend", seguimiento);
  });
}

function renderListadoLineas() {
  const box = document.getElementById("lineasListado");
  const municipio = document.getElementById("selMunicipio").value;
  const texto = normalize(document.getElementById("lineaBuscador").value.trim());

  // Los municipios de cada línea salen del grafo (los que de verdad
  // tienen alguna parada suya), no del campo que publica ctas.es, que
  // viene incompleto: la M-101 declara solo dos de los seis que recorre.
  // Filtrar por municipio necesita saber por dónde pasa cada línea, y eso
  // sale de los horarios de su área. Si aún no están, se piden y se
  // repinta: el catálogo sabe que Almería existe, pero no qué líneas la
  // recorren.
  const areaMuni = municipio ? areaDeMunicipio(municipio) : null;
  if (areaMuni != null && !tieneHorarios(areaMuni)) {
    box.innerHTML = `<p class="empty">Cargando las líneas de ${
      escapeHtml(nombreDeArea(areaMuni))}…</p>`;
    asegurarHorarios(areaMuni)
      .then(renderListadoLineas)
      .catch(() => { box.innerHTML = '<p class="empty">No se han podido cargar las líneas. Comprueba la conexión.</p>'; });
    return;
  }

  let lineas = APP.data.lineas;
  if (municipio) lineas = lineas.filter(l => GRAFO.municipios.get(municipio).lineas.has(l.slug));
  if (texto) {
    lineas = lineas.filter(l =>
      normalize(l.titulo).includes(texto) ||
      municipiosDeLinea(l.slug).some(m => normalize(m).includes(texto)));
  }
  lineas = [...lineas].sort((a, b) => a.titulo.localeCompare(b.titulo, "es"));

  if (!lineas.length) {
    box.innerHTML = '<p class="empty">No hay líneas que coincidan con la búsqueda.</p>';
    return;
  }
  box.innerHTML = "";
  lineas.forEach(l => {
    const row = document.createElement("div");
    row.className = "linea-row";
    // El código de la línea manda (es lo que se busca con el ojo) y el
    // Sólo el distintivo y el nombre. El nombre de la línea YA es la
    // lista de sitios por los que pasa, así que repetir debajo los
    // municipios del grafo hacía cincuenta y cinco filas de doble alto
    // con los dos renglones recortados a mitad de palabra. Para buscar
    // por municipio está el desplegable de arriba.
    row.innerHTML = `
      <span class="linea-badge">${escapeHtml(codigoLinea(l.titulo))}</span>
      <span class="linea-row-name">${escapeHtml(nombreSinCodigo(l.titulo))}</span>`;
    const btnFav = document.createElement("button");
    btnFav.type = "button";
    btnFav.className = "btn-fav";
    pintarEstrella(btnFav, esFavoritoLinea(l.slug));
    btnFav.addEventListener("click", e => {
      e.stopPropagation();
      toggleFavoritoLinea(l.slug);
      pintarEstrella(btnFav, esFavoritoLinea(l.slug));
      renderLineasFavoritas();
    });
    row.addEventListener("click", () => mostrarDetalleLinea(l.slug));
    row.appendChild(btnFav);
    box.appendChild(row);
  });
}

/** Abrir una línea SUSTITUYE al listado, no se le añade debajo.
 *
 * Antes la ficha se pintaba a continuación de las cincuenta y cinco filas
 * del listado y de las líneas favoritas, así que la página se iba a más
 * de doce mil píxeles: para volver a la lista —o a cualquier otra cosa—
 * había que arrastrar la pantalla un buen rato. Con la ficha sola, la
 * página vuelve a medir lo que mide una ficha, y "‹ Volver" devuelve el
 * listado donde estaba. */
function mostrarDetalleLinea(slug) {
  const linea = APP.data.lineas.find(l => l.slug === slug);
  const detailBox = document.getElementById("lineDetail");
  // El listado enseña las 432 líneas de Andalucía desde el catálogo, pero
  // el recorrido de una línea sale de sus horarios. Si son de un área que
  // aún no está bajada, la ficha ocupa ya el sitio del listado —para que
  // el aviso se vea sin arrastrar la pantalla— y se vuelve a entrar
  // cuando llegan.
  if (linea && !tieneHorarios(linea.idc)) {
    const listadoCard = document.getElementById("lineasListadoCard");
    const favCard = document.getElementById("lineasFavCard");
    if (listadoCard) listadoCard.hidden = true;
    if (favCard) favCard.hidden = true;
    window.scrollTo(0, 0);
    detailBox.className = "card";
    detailBox.innerHTML = `<p class="empty">Cargando los horarios de ${
      escapeHtml(nombreDeArea(linea.idc))}…</p>`;
    const volver = () => {
      detailBox.innerHTML = "";
      detailBox.className = "";
      if (listadoCard) listadoCard.hidden = false;
      if (favCard) favCard.hidden = false;
    };
    asegurarHorarios(linea.idc)
      .then(() => { volver(); mostrarDetalleLinea(slug); })
      .catch(() => {
        detailBox.innerHTML = '<p class="empty">No se han podido cargar los horarios. Comprueba la conexión.</p>';
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn-chip";
        btn.textContent = "‹ Volver";
        btn.addEventListener("click", volver);
        detailBox.appendChild(btn);
      });
    return;
  }
  if (!linea || !linea.orden_unificado || !linea.orden_unificado.length) {
    detailBox.innerHTML = '<div class="card"><p class="empty">Esta línea no tiene paradas con datos disponibles.</p></div>';
    return;
  }
  const listado = document.getElementById("lineasListadoCard");
  const favoritas = document.getElementById("lineasFavCard");
  const scrollPrevio = window.scrollY;
  if (listado) listado.hidden = true;
  if (favoritas) favoritas.hidden = true;

  detailBox.className = "card";
  renderLineDetail(detailBox, linea, linea.orden_unificado[0], () => {
    detailBox.innerHTML = "";
    detailBox.className = "";
    if (listado) listado.hidden = false;
    if (favoritas) favoritas.hidden = false;
    renderLineasFavoritas();
    window.scrollTo({ top: scrollPrevio });
  });
  window.scrollTo({ top: 0 });
}
