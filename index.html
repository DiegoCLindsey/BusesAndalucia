<script>
"use strict";

/* ------------------------------------------------------------------ */
/* Config y estado                                                     */
/* ------------------------------------------------------------------ */
const DATA_URL = "ctas_data_app.json";
const LS_KEY = "ctasAppDataV2"; // v2: cada parada trae su municipio
const APP = { data: null };

/* ------------------------------------------------------------------ */
/* Iconos                                                              */
/* ------------------------------------------------------------------ */
/** Los emoji dependían de la fuente del sistema: cambiaban de forma y de
 * color en cada móvil y no se podían teñir con el tema. Estos son trazos
 * de 24×24 que heredan el color del texto, así que valen igual en claro
 * que en oscuro y encajan con el peso de la tipografía. */
const TRAZO = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const ICONOS = {
  mapa:      `<path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13M15 6.5v13"/>`,
  bus:       `<path d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"/><path d="M4 11h16"/><path d="M3 16h18"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/><path d="M7 7h4"/>`,
  brujula:   `<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5.5-5.5 2 2-5.5 5.5-2Z"/>`,
  parada:    `<path d="M6 3h12"/><path d="M12 3v6"/><rect x="5" y="9" width="14" height="9" rx="2"/><path d="M8 21v-3M16 21v-3"/>`,
  pin:       `<path d="M20 10c0 5-8 12-8 12s-8-7-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>`,
  bandera:   `<path d="M4 21V4"/><path d="M4 5h11l-1.5 3L15 11H4"/>`,
  estrella:  `<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/>`,
  reloj:     `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>`,
  campana:   `<path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7Z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/>`,
  cerrar:    `<path d="M18 6 6 18M6 6l12 12"/>`,
  buscar:    `<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>`,
  lapiz:     `<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/>`,
  refrescar: `<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>`,
  andar:     `<circle cx="13" cy="4" r="1.6"/><path d="m10 21 2-5-2.5-2.5.5-4.5 3 1.5 2 2.5"/><path d="M8.5 9 12 8"/><path d="m15 21-1.5-4"/>`,
  abajo:     `<path d="m6 9 6 6 6-6"/>`,
  municipio: `<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>`,
  sol:       `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`,
  luna:      `<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>`,
  cerca:     `<circle cx="12" cy="12" r="2.5"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M5 19a10 10 0 0 1 0-14M19 5a10 10 0 0 1 0 14"/>`,
  aviso:     `<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 17a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>`,
  lista:     `<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>`
};

/** Color real de un token del tema. Leaflet no entiende `var(--brand)`:
 * necesita un color resuelto, y además hay que volver a pintar cuando se
 * cambia de claro a noche. */
function colorTema(nombre) {
  return getComputedStyle(document.documentElement).getPropertyValue("--" + nombre).trim() || "#0E9F6E";
}

/** Marca o desmarca una estrella de favorito. */
function pintarEstrella(boton, activa) {
  boton.innerHTML = icono("estrella");
  boton.classList.toggle("es-fav", !!activa);
}

/** Rellena de un golpe todo lo que en el HTML pide un icono con
 * `data-ico`, para no repetir el SVG en el marcado. */
function pintarIconosDeclarados() {
  document.querySelectorAll("[data-ico]").forEach(el => {
    el.insertAdjacentHTML("afterbegin", icono(el.dataset.ico));
  });
  const marca = document.getElementById("marcaIco");
  if (marca) marca.innerHTML = icono("bus");
}

/** Devuelve el SVG de un icono. `clase` permite dimensionarlo desde CSS. */
function icono(nombre, clase) {
  const trazos = ICONOS[nombre];
  if (!trazos) return "";
  return `<svg ${TRAZO}${clase ? ` class="${clase}"` : ""} aria-hidden="true">${trazos}</svg>`;
}

/* ------------------------------------------------------------------ */
/* Tema claro / noche                                                  */
/* ------------------------------------------------------------------ */
/** Tres estados: claro, noche y "el que diga el móvil". Se recuerda la
 * elección; sin elección, manda el sistema. */
const LS_TEMA_KEY = "ctasTemaV1";
const TEMAS = ["auto", "light", "dark"];

function temaGuardado() {
  try { return localStorage.getItem(LS_TEMA_KEY) || "auto"; } catch (e) { return "auto"; }
}

function aplicarTema(tema) {
  if (tema === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", tema);
  try { localStorage.setItem(LS_TEMA_KEY, tema); } catch (e) { /* modo privado */ }
  const btn = document.getElementById("btnTema");
  if (!btn) return;
  const oscuro = tema === "dark" || (tema === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  btn.innerHTML = icono(oscuro ? "luna" : "sol");
  btn.title = { auto: "Tema: automático", light: "Tema: claro", dark: "Tema: noche" }[tema];
  // El color de la barra del navegador acompaña al fondo de la app.
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", oscuro ? "#070D14" : "#F4F7FA");
  repintarMapas();
}

/** Los círculos de parada llevan el color quemado dentro del objeto de
 * Leaflet, así que al cambiar de tema hay que decírselo uno a uno. */
function repintarMapas() {
  const estilo = { color: colorTema("card"), fillColor: colorTema("brand") };
  [typeof HOME_CAPA !== "undefined" ? HOME_CAPA : null,
   typeof ROUTE_CAPA !== "undefined" ? ROUTE_CAPA : null].forEach(capa => {
    if (!capa) return;
    Object.values(capa.marcadores).forEach(m => m.setStyle(estilo));
    capa.refrescar();
  });
}

function wireTema() {
  aplicarTema(temaGuardado());
  document.getElementById("btnTema").addEventListener("click", () => {
    const actual = temaGuardado();
    aplicarTema(TEMAS[(TEMAS.indexOf(actual) + 1) % TEMAS.length]);
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (temaGuardado() === "auto") aplicarTema("auto");
  });
}

/* ------------------------------------------------------------------ */
/* Favoritos                                                           */
/* ------------------------------------------------------------------ */
const LS_FAVORITOS_KEY = "ctasFavoritosV1";
let FAVORITOS = { paradas: [], lineas: [], rutas: [], notificaciones: [] };

/** Municipio desde el que se están mirando las salidas ("" = todos). Se
 * recuerda entre visitas porque casi siempre miras desde el mismo sitio:
 * por la mañana desde tu pueblo, por la tarde desde Sevilla. */
const LS_FILTRO_MUNI_KEY = "ctasFiltroMunicipioV1";
let FILTRO_MUNICIPIO = "";
try { FILTRO_MUNICIPIO = localStorage.getItem(LS_FILTRO_MUNI_KEY) || ""; } catch (e) { FILTRO_MUNICIPIO = ""; }

function setFiltroMunicipio(municipio) {
  FILTRO_MUNICIPIO = municipio || "";
  try { localStorage.setItem(LS_FILTRO_MUNI_KEY, FILTRO_MUNICIPIO); } catch (e) { /* modo privado */ }
}

function cargarFavoritos() {
  try {
    const raw = localStorage.getItem(LS_FAVORITOS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      FAVORITOS = {
        paradas: Array.isArray(parsed.paradas) ? parsed.paradas : [],
        lineas: Array.isArray(parsed.lineas) ? parsed.lineas : [],
        rutas: Array.isArray(parsed.rutas) ? parsed.rutas : [],
        notificaciones: Array.isArray(parsed.notificaciones) ? parsed.notificaciones : []
      };
      // Las líneas favoritas guardadas con el modelo antiguo tenían
      // `paradasPorSentido` (cabecera -> parada). Se traen tal cual como
      // puntos de referencia: la parada es la misma, y el sentido se
      // resuelve solo la primera vez que se pinta.
      FAVORITOS.lineas.forEach(l => {
        if (Array.isArray(l.referencias)) return;
        l.referencias = Object.values(l.paradasPorSentido || {})
          .filter(Boolean)
          .map(paradaId => ({ paradaId, sentidoClave: null }));
        delete l.paradasPorSentido;
      });
    }
  } catch (e) {
    console.warn("No se pudieron cargar los favoritos", e);
  }
}

function guardarFavoritos() {
  try {
    localStorage.setItem(LS_FAVORITOS_KEY, JSON.stringify(FAVORITOS));
  } catch (e) {
    console.warn("No se pudieron guardar los favoritos (¿cuota llena?)", e);
  }
}

function esFavoritoParada(id) { return FAVORITOS.paradas.some(p => p.id === id); }
function esFavoritoLinea(slug) { return FAVORITOS.lineas.some(l => l.slug === slug); }
function esFavoritoRuta(origenId, destinoId) {
  return FAVORITOS.rutas.some(r => r.origenId === origenId && r.destinoId === destinoId);
}

function toggleFavoritoRuta(origenId, destinoId, criterio) {
  const idx = FAVORITOS.rutas.findIndex(r => r.origenId === origenId && r.destinoId === destinoId);
  if (idx >= 0) {
    FAVORITOS.rutas.splice(idx, 1);
  } else {
    const pO = APP.data.paradas[origenId], pD = APP.data.paradas[destinoId];
    FAVORITOS.rutas.push({
      origenId, destinoId, criterio: criterio || "tiempo",
      origenNombre: pO ? pO.nombre : origenId, destinoNombre: pD ? pD.nombre : destinoId,
      cache: null
    });
  }
  guardarFavoritos();
}

function toggleFavoritoParada(id) {
  const idx = FAVORITOS.paradas.findIndex(p => p.id === id);
  if (idx >= 0) {
    FAVORITOS.paradas.splice(idx, 1);
  } else {
    const p = APP.data.paradas[id];
    FAVORITOS.paradas.push({ id, nombre: p ? p.nombre : id });
  }
  guardarFavoritos();
}

function toggleFavoritoLinea(slug) {
  const idx = FAVORITOS.lineas.findIndex(l => l.slug === slug);
  if (idx >= 0) {
    FAVORITOS.lineas.splice(idx, 1);
  } else {
    const linea = APP.data.lineas.find(l => l.slug === slug);
    // referencias: desde qué paradas (y hacia qué sentido) quiere la
    // persona ver las salidas de esta línea. Vacío = las cabeceras.
    FAVORITOS.lineas.push({ slug, titulo: linea ? linea.titulo : slug, referencias: [] });
  }
  guardarFavoritos();
}

/* ------------------------------------------------------------------ */
/* Notificaciones de salida                                            */
/* ------------------------------------------------------------------ */
const SNOOZE_MIN = 5;
let NOTIF_TIMER = null;

function claveNotificacion(paradaId, lineaSlug) {
  return paradaId + "|" + (lineaSlug || "*");
}

function getNotificacion(paradaId, lineaSlug) {
  return FAVORITOS.notificaciones.find(n => n.clave === claveNotificacion(paradaId, lineaSlug)) || null;
}

function setNotificacion(paradaId, lineaSlug, antelacionMin) {
  const clave = claveNotificacion(paradaId, lineaSlug);
  const idx = FAVORITOS.notificaciones.findIndex(n => n.clave === clave);
  const entrada = {
    clave, paradaId, lineaSlug: lineaSlug || null,
    antelacionMin, activa: true, snoozeHasta: null
  };
  if (idx >= 0) FAVORITOS.notificaciones[idx] = entrada;
  else FAVORITOS.notificaciones.push(entrada);
  guardarFavoritos();
  arrancarVigilanteNotificaciones();
}

function quitarNotificacion(paradaId, lineaSlug) {
  const clave = claveNotificacion(paradaId, lineaSlug);
  const idx = FAVORITOS.notificaciones.findIndex(n => n.clave === clave);
  if (idx >= 0) FAVORITOS.notificaciones.splice(idx, 1);
  guardarFavoritos();
}

/** Pide permiso al navegador. Devuelve true si se puede notificar. */
async function pedirPermisoNotificaciones() {
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  if (Notification.permission === "denied") return false;
  const res = await Notification.requestPermission();
  return res === "granted";
}

/** Lanza la notificación por el mejor canal disponible.
 * En Android/Chrome el constructor `new Notification()` está prohibido y
 * exige un Service Worker; como esta app es un único fichero HTML (no
 * podemos registrar un SW desde un blob), ahí caemos a un aviso dentro
 * de la propia página. En escritorio sí sale la notificación del sistema. */
async function lanzarNotificacion(titulo, cuerpo, onSnooze) {
  let lanzada = false;
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      // Vía Service Worker: es la única que funciona en Android/Chrome,
      // y la preferimos siempre que haya uno registrado (no hace falta
      // que ya controle la página).
      if (navigator.serviceWorker) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg && reg.showNotification) {
          await reg.showNotification(titulo, {
            body: cuerpo,
            tag: "proxima-salida",
            icon: "icon.svg",
            badge: "icon.svg",
            requireInteraction: false
          });
          lanzada = true;
        }
      }
      if (!lanzada) {
        new Notification(titulo, { body: cuerpo });
        lanzada = true;
      }
    } catch (e) {
      console.warn("No se pudo usar la notificación del sistema", e);
    }
  }
  mostrarAvisoEnApp(titulo, cuerpo, onSnooze, lanzada);
}

/** Aviso visible dentro de la app: sirve de refuerzo en escritorio y de
 * sustituto real en móvil, donde la notificación de sistema no está
 * disponible sin Service Worker. */
function mostrarAvisoEnApp(titulo, cuerpo, onSnooze, yaLanzadaFuera) {
  const anterior = document.getElementById("avisoSalida");
  if (anterior) anterior.remove();
  const box = document.createElement("div");
  box.id = "avisoSalida";
  box.className = "aviso-salida";
  box.innerHTML = `
    <div class="aviso-titulo">${escapeHtml(titulo)}</div>
    <div class="aviso-cuerpo">${escapeHtml(cuerpo)}</div>
    ${yaLanzadaFuera ? "" : '<div class="aviso-nota">Tu navegador no permite notificaciones del sistema aquí; te aviso dentro de la app.</div>'}
    <div class="aviso-acciones">
      <button type="button" class="btn-chip" id="avisoSnooze">${icono("reloj")}Posponer ${SNOOZE_MIN} min</button>
      <button type="button" class="btn-chip" id="avisoCerrar">${icono("cerrar")}Cerrar</button>
    </div>`;
  document.body.appendChild(box);
  box.querySelector("#avisoSnooze").addEventListener("click", () => { if (onSnooze) onSnooze(); box.remove(); });
  box.querySelector("#avisoCerrar").addEventListener("click", () => box.remove());
}

/** Próxima salida vigilada para una notificación: si lleva línea
 * asociada, solo esa línea; si no, cualquier línea de esa parada. */
function proximaSalidaVigilada(notif) {
  const p = APP.data.paradas[notif.paradaId];
  if (!p) return null;
  const servicios = (p.servicios || []).filter(s => !notif.lineaSlug || s.linea_slug === notif.lineaSlug);
  if (!servicios.length) return null;
  const now = new Date();
  const dep = nextDepartureConOrigen(servicios, now);
  if (!dep) return null;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const minutosRestantes = dep.dias * 1440 + dep.h * 60 + dep.m - nowMin;
  // La línea y la dirección deben salir del MISMO servicio que produce
  // esa salida concreta: tomar el título de servicios[0] mezclaba la
  // línea de un servicio con la dirección de otro cuando la parada tiene
  // varias líneas.
  const nombreVariante = dep.variantes && dep.variantes.length ? dep.variantes[0] : null;
  const servicioSalida = nombreVariante
    ? servicios.find(s => s.variante_nombre === nombreVariante) || servicios[0]
    : servicios[0];
  const lineaTitulo = servicioSalida.linea_titulo;
  let direccion = "";
  if (nombreVariante) {
    const od = origenDestinoVariante(nombreVariante);
    direccion = od ? od.origen + " → " + od.destino : nombreVariante;
  }
  return { minutosRestantes, lineaTitulo, direccion, paradaNombre: p.nombre, dep };
}

function revisarNotificaciones() {
  if (!APP.data || !FAVORITOS.notificaciones.length) return;
  const ahora = Date.now();
  FAVORITOS.notificaciones.forEach(notif => {
    if (!notif.activa) return;
    if (notif.snoozeHasta && ahora < notif.snoozeHasta) return;
    const info = proximaSalidaVigilada(notif);
    if (!info) return;
    if (info.minutosRestantes < 0 || info.minutosRestantes > notif.antelacionMin) return;

    const titulo = "Tu autobús está al salir";
    const cuerpo = `Quedan ${info.minutosRestantes} minuto${info.minutosRestantes === 1 ? "" : "s"} para que el autobús de la línea ${info.lineaTitulo}` +
      (info.direccion ? ` salga en dirección ${info.direccion}` : " salga") +
      ` de ${info.paradaNombre}.`;

    // Por defecto se desactiva tras avisar; si la persona pospone, se
    // reactiva con una espera de SNOOZE_MIN minutos.
    notif.activa = false;
    guardarFavoritos();
    lanzarNotificacion(titulo, cuerpo, () => {
      notif.activa = true;
      notif.snoozeHasta = Date.now() + SNOOZE_MIN * 60000;
      guardarFavoritos();
      arrancarVigilanteNotificaciones();
    });
  });
}

function arrancarVigilanteNotificaciones() {
  if (NOTIF_TIMER) return;
  NOTIF_TIMER = setInterval(revisarNotificaciones, 15000);
  revisarNotificaciones();
}

const ANTELACIONES = [5, 10, 15];

/** Diálogo para poner o quitar el aviso de una parada (opcionalmente solo
 * de una línea).
 *
 * Sin campos numéricos: tres botones con los tiempos que alguien elige de
 * verdad. Y diciendo lo que el aviso puede y no puede hacer — esto no es
 * una alarma del móvil: no hay servidor que mande un push, así que sólo
 * suena mientras la app siga viva. Prometerlo de otra forma sería dejar a
 * alguien esperando un aviso que no va a llegar. */
function abrirDialogoNotificacion(paradaId, lineaSlug, onCambio) {
  const p = APP.data.paradas[paradaId];
  openModal(container => {
    const pintar = () => {
      const existente = getNotificacion(paradaId, lineaSlug);
      const elegido = existente ? existente.antelacionMin : 10;
      const linea = lineaSlug ? APP.data.lineas.find(l => l.slug === lineaSlug) : null;
      container.innerHTML = `
        <h3 class="detail-title">Avísame antes de que salga</h3>
        <div class="detail-meta">${escapeHtml(p ? p.nombre : paradaId)}${linea ? " · " + escapeHtml(codigoLinea(linea.titulo)) : " · cualquier línea"}</div>
        <div class="selector-bloque">
          <div class="selector-titulo">Con cuánta antelación</div>
          <div class="chip-row" id="notifMinutos">
            ${ANTELACIONES.map(m => `<button type="button" class="muni-chip${m === elegido ? " active" : ""}" data-min="${m}">${m} min</button>`).join("")}
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
          <button type="button" class="btn" id="notifGuardar">${icono("campana")}${existente ? "Cambiar el aviso" : "Avísame"}</button>
          ${existente ? `<button type="button" class="btn-chip" id="notifQuitar">${icono("cerrar")}Quitar</button>` : ""}
        </div>
        <div class="board-note" id="notifEstado">${existente ? `Aviso puesto ${existente.antelacionMin} min antes.` : ""}</div>
        <p class="board-note">Suena una vez y se quita solo; si lo pospones, vuelve ${SNOOZE_MIN} minutos después.
        Ojo: sólo puede sonar <b>mientras la app siga abierta</b>, aunque esté en segundo plano. Si la cierras del todo, no hay aviso.</p>`;

      let minutos = elegido;
      container.querySelectorAll("#notifMinutos .muni-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          minutos = parseInt(btn.dataset.min, 10);
          container.querySelectorAll("#notifMinutos .muni-chip").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });

      container.querySelector("#notifGuardar").addEventListener("click", async () => {
        const permitido = await pedirPermisoNotificaciones();
        setNotificacion(paradaId, lineaSlug, minutos);
        if (onCambio) onCambio();
        container.querySelector("#notifEstado").textContent = permitido
          ? `Listo: te aviso ${minutos} min antes.`
          : `Listo, pero tu navegador no deja sacar avisos del sistema: te avisaré dentro de la app.`;
        setTimeout(closeModal, 1300);
      });
      const btnQuitar = container.querySelector("#notifQuitar");
      if (btnQuitar) btnQuitar.addEventListener("click", () => {
        quitarNotificacion(paradaId, lineaSlug);
        if (onCambio) onCambio();
        closeModal();
      });
    };
    pintar();
  });
}

let CURRENT_MAP_REF = { map: null };
let CURRENT_MODAL_MAP_REF = { map: null };

/* ------------------------------------------------------------------ */
/* Utilidades                                                          */
/* ------------------------------------------------------------------ */
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function formatDistance(m) {
  return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`;
}

function normalize(s) {
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function frecuenciaKeyForDate(date) {
  const day = date.getDay(); // 0 domingo .. 6 sábado
  if (day === 0) return "domingo";
  if (day === 6) return "sabado";
  return "laborable";
}

function matchFrecuencia(frecuenciaStr, key) {
  const n = normalize(frecuenciaStr);
  const esDomingo = /domingo|festivo/.test(n);
  const esSabado = /sabado/.test(n);
  if (key === "domingo") return esDomingo;
  if (key === "sabado") return esSabado;
  // laborable: aceptamos "lunes a viernes", "laborable", "diario"... y como
  // último recurso, cualquier frecuencia que no sea explícitamente de
  // sábado o domingo/festivo.
  return /lunes|viernes|laborable|diario/.test(n) || (!esDomingo && !esSabado);
}

function pickHorarioBucket(horarios, key) {
  if (!horarios) return null;
  return horarios.find(h => matchFrecuencia(h.frecuencia, key)) || null;
}

function normFrecuencia(frecuenciaStr) {
  const n = normalize(frecuenciaStr);
  if (/domingo|festivo/.test(n)) return "domingo";
  if (/sabado/.test(n)) return "sabado";
  return "laborable";
}

/* ------------------------------------------------------------------ */
/* Grafo tripartito: municipio — parada — línea                        */
/* ------------------------------------------------------------------ */
/** El índice que sostiene todo lo que va "por municipio": qué paradas
 * tiene cada municipio, qué líneas lo pisan, y en qué municipios para
 * cada línea. Se construye una sola vez al cargar los datos y es lo que
 * permite tanto pedir una ruta de pueblo a pueblo sin saberse ninguna
 * parada, como filtrar tus próximas salidas por el municipio desde el
 * que quieres mirar.
 *
 * Es tripartito de verdad, no una lista de municipios con un mapa al
 * lado: municipio ↔ parada ↔ línea, con las tres relaciones navegables
 * en ambos sentidos, porque la búsqueda de itinerarios recorre el nivel
 * de líneas (para contar trasbordos) y aterriza en el de paradas (para
 * poner horas reales). */
const GRAFO = {
  municipios: new Map(), // nombre -> {nombre, paradas:[id], lineas:Set, lat, lng}
  paradas: new Map(),    // paradaId -> {municipio, lineas:Set}
  lineas: new Map(),     // slug -> {slug, titulo, municipios:Set, paradas:Set, recorridos:[]}
  lista: []              // municipios con paradas, alfabético
};

function construirGrafo() {
  GRAFO.municipios.clear();
  GRAFO.paradas.clear();
  GRAFO.lineas.clear();

  const nodoMunicipio = nombre => {
    if (!GRAFO.municipios.has(nombre)) {
      GRAFO.municipios.set(nombre, { nombre, paradas: [], lineas: new Set(), lat: null, lng: null });
    }
    return GRAFO.municipios.get(nombre);
  };

  Object.entries(APP.data.paradas).forEach(([id, p]) => {
    const municipio = p.municipio || null;
    GRAFO.paradas.set(id, { municipio, lineas: new Set() });
    if (municipio) nodoMunicipio(municipio).paradas.push(id);
  });

  (APP.data.lineas || []).forEach(linea => {
    // De cada variante guardamos el recorrido tal cual (la secuencia de
    // paradas) porque el orden es lo único que dice si dos paradas están
    // conectadas EN ESE SENTIDO: que una línea pase por A y por B no
    // significa que puedas ir de A a B con ella.
    const recorridos = (linea.variantes || []).map(v => {
      const paradas = (v.paradas || []).filter(id => APP.data.paradas[id]);
      const posiciones = new Map();
      paradas.forEach((id, i) => {
        if (!posiciones.has(id)) posiciones.set(id, []);
        posiciones.get(id).push(i);
      });
      return { nodoId: v.nodo_id, nombre: v.nombre, paradas, posiciones };
    }).filter(r => r.paradas.length > 1);

    const nodo = { slug: linea.slug, titulo: linea.titulo, municipios: new Set(), paradas: new Set(), recorridos };
    recorridos.forEach(r => r.paradas.forEach(id => nodo.paradas.add(id)));
    nodo.paradas.forEach(id => {
      const np = GRAFO.paradas.get(id);
      if (!np) return;
      np.lineas.add(linea.slug);
      if (np.municipio) {
        nodo.municipios.add(np.municipio);
        nodoMunicipio(np.municipio).lineas.add(linea.slug);
      }
    });
    GRAFO.lineas.set(linea.slug, nodo);
  });

  // Centro de cada municipio: la media de sus paradas. Sirve para
  // centrar el mapa y para medir distancias cuando el extremo de una
  // ruta es un municipio entero y no un punto concreto.
  GRAFO.municipios.forEach(m => {
    const pts = m.paradas.map(id => APP.data.paradas[id]).filter(p => p && p.lat != null);
    if (!pts.length) return;
    m.lat = pts.reduce((a, p) => a + p.lat, 0) / pts.length;
    m.lng = pts.reduce((a, p) => a + p.lng, 0) / pts.length;
  });

  GRAFO.lista = [...GRAFO.municipios.keys()]
    .filter(m => GRAFO.municipios.get(m).paradas.length)
    .sort((a, b) => a.localeCompare(b, "es"));
}

function municipioDeParada(paradaId) {
  const n = GRAFO.paradas.get(paradaId);
  return n ? n.municipio : null;
}

function paradasDeMunicipio(nombre) {
  const m = GRAFO.municipios.get(nombre);
  return m ? m.paradas : [];
}

/** Paradas de un municipio ordenadas por nombre, opcionalmente solo las
 * de una línea concreta. Es lo que se ofrece al elegir "mi parada". */
function paradasDeMunicipioEnLinea(nombre, lineaSlug) {
  const nodo = lineaSlug ? GRAFO.lineas.get(lineaSlug) : null;
  return paradasDeMunicipio(nombre)
    .filter(id => !nodo || nodo.paradas.has(id))
    .sort((a, b) => APP.data.paradas[a].nombre.localeCompare(APP.data.paradas[b].nombre, "es"));
}

/** Municipios que toca una línea, en el orden en que los pisa su
 * recorrido más largo (más útil que el alfabético para orientarse). */
function municipiosDeLinea(lineaSlug) {
  const nodo = GRAFO.lineas.get(lineaSlug);
  if (!nodo) return [];
  const largo = nodo.recorridos.slice().sort((a, b) => b.paradas.length - a.paradas.length)[0];
  const orden = [];
  const vistos = new Set();
  if (largo) {
    largo.paradas.forEach(id => {
      const m = municipioDeParada(id);
      if (m && !vistos.has(m)) { vistos.add(m); orden.push(m); }
    });
  }
  [...nodo.municipios].sort((a, b) => a.localeCompare(b, "es")).forEach(m => {
    if (!vistos.has(m)) { vistos.add(m); orden.push(m); }
  });
  return orden;
}

/* ------------------------------------------------------------------ */
/* Sentido de circulación en una parada                                 */
/* ------------------------------------------------------------------ */
/** Hacia dónde va un autobús concreto cuando pasa por una parada.
 *
 * Antes esto se deducía de la CABECERA de la variante (dónde arranca), y
 * de ahí venía el fallo de las próximas salidas: la M-177 sale unas veces
 * de Torre de la Reina y otras de Guillena, pero ambas pasan por la misma
 * parada camino de Sevilla. Al agrupar por cabecera, mirando el sentido
 * "Torre de la Reina" solo se contaban los autobuses que arrancan allí y
 * se anunciaba como próxima salida la de una hora más tarde, ignorando el
 * que salía de Guillena y pasaba por delante mucho antes.
 *
 * El sentido se saca ahora de lo único que importa cuando estás esperando
 * en una parada: qué queda por delante en el recorrido. Se toma la parada
 * pendiente más lejana y su municipio da el nombre del sentido, así que
 * todos los autobuses que pasan por ahí camino de Sevilla caen en el
 * mismo grupo, salgan de donde salgan. En la parada de vuelta, ese mismo
 * recorrido ya solo tiene por delante paradas de Guillena, y se agrupa
 * como el sentido contrario. */
const EXTREMOS_SENTIDO = 3; // paradas del final del recorrido que votan el sentido

function sentidoDeServicio(paradaId, servicio) {
  const nodo = GRAFO.lineas.get(servicio.linea_slug);
  const parada = APP.data.paradas[paradaId];
  const vacio = { clave: "_fin_", etiqueta: "fin de trayecto", destinoId: null };
  if (!nodo || !parada) return vacio;
  const recorrido = nodo.recorridos.find(r => r.nodoId === servicio.variante_nodo_id);
  if (!recorrido) return vacio;

  // `orden` es 1-based sobre la lista de paradas de la variante; si por
  // lo que sea no cuadra, se busca la parada en el recorrido.
  let idx = (servicio.orden || 0) - 1;
  if (recorrido.paradas[idx] !== paradaId) {
    const pos = recorrido.posiciones.get(paradaId);
    if (!pos || !pos.length) return vacio;
    idx = pos[0];
  }
  const pendientes = recorrido.paradas.slice(idx + 1);
  if (!pendientes.length) return vacio;

  // No basta con la parada pendiente más lejana: en un recorrido largo,
  // la más lejana y la segunda están a metros una de otra y pueden caer
  // en municipios distintos (los límites del Aljarafe pasan por medio de
  // las calles). Se votan las EXTREMOS_SENTIDO más lejanas, que van
  // todas al mismo sitio, y gana el municipio mayoritario.
  const lejanas = pendientes
    .map(id => APP.data.paradas[id])
    .filter(p => p && p.lat != null && parada.lat != null)
    .map(p => ({ p, d: haversine(parada.lat, parada.lng, p.lat, p.lng) }))
    .sort((a, b) => b.d - a.d)
    .slice(0, EXTREMOS_SENTIDO);
  if (!lejanas.length) return vacio;

  const votos = new Map();
  lejanas.forEach(({ p }) => {
    const m = p.municipio || null;
    if (m) votos.set(m, (votos.get(m) || 0) + 1);
  });
  const municipioDestino = votos.size
    ? [...votos.entries()].sort((a, b) => b[1] - a[1])[0][0]
    : null;
  const extremo = lejanas.find(({ p }) => !municipioDestino || p.municipio === municipioDestino) || lejanas[0];
  const destinoId = pendientes.find(id => APP.data.paradas[id] === extremo.p) || pendientes[pendientes.length - 1];

  // El sentido se nombra por el municipio hacia el que se va, incluso
  // cuando es el mismo del que sales (una línea que da la vuelta y
  // vuelve a entrar en el pueblo): así todos los recorridos que van
  // "hacia allí" quedan en el mismo grupo, que es de lo que se trata.
  return {
    clave: municipioDestino ? "m:" + municipioDestino : "p:" + destinoId,
    etiqueta: municipioDestino || extremo.p.nombre,
    destinoId
  };
}

/** Las salidas de una parada agrupadas por línea Y sentido: cada grupo
 * responde a "¿cuándo pasa por aquí el próximo autobús de la línea X
 * hacia Y?", juntando todos los recorridos que hacen ese mismo trayecto.
 * Si se pasa `lineaSlug`, solo se mira esa línea. */
function sentidosEnParada(paradaId, lineaSlug, ahora) {
  const p = APP.data.paradas[paradaId];
  if (!p) return [];
  const grupos = new Map();
  (p.servicios || []).forEach(s => {
    if (lineaSlug && s.linea_slug !== lineaSlug) return;
    const sentido = sentidoDeServicio(paradaId, s);
    // Un recorrido que TERMINA aquí no es una salida: la hora que publica
    // ctas.es para él es la de llegada. Enseñarla como "próximo autobús"
    // sería mandar a alguien a esperar un bus que se queda parado.
    if (!sentido.destinoId) return;
    const clave = s.linea_slug + "|" + sentido.clave;
    if (!grupos.has(clave)) {
      grupos.set(clave, {
        clave, sentidoClave: sentido.clave, lineaSlug: s.linea_slug, lineaTitulo: s.linea_titulo,
        etiqueta: sentido.etiqueta, destinoId: sentido.destinoId, servicios: []
      });
    }
    grupos.get(clave).servicios.push(s);
  });
  const now = ahora || new Date();
  const salida = [...grupos.values()].map(g => ({ ...g, dep: nextDepartureConOrigen(g.servicios, now) }));
  salida.sort((a, b) => {
    const av = a.dep ? a.dep.dias * 1440 + a.dep.h * 60 + a.dep.m : Infinity;
    const bv = b.dep ? b.dep.dias * 1440 + b.dep.h * 60 + b.dep.m : Infinity;
    return av - bv;
  });
  return salida;
}

/** Todos los "servicios" (línea+variante) de una MISMA línea que pasan
 * físicamente por una parada dada. Una parada puede estar servida por
 * varias sub-rutas de la misma línea (p.ej. la M-177 tiene 5 recorridos
 * distintos que comparten tramos). */
function serviciosDeLineaEnParada(paradaId, lineaSlug) {
  const p = APP.data.paradas[paradaId];
  if (!p) return [];
  return p.servicios.filter(s => s.linea_slug === lineaSlug);
}

/** Fusiona los horarios de varios "servicios" que pasan por la misma
 * parada física en un único horario por tipo de día: cualquier bus de
 * la línea que pase por ahí, venga por la sub-ruta que venga. Esto es
 * lo que responde de verdad a "¿cuándo sale el próximo autobús de esta
 * línea desde esta parada?" en vez de atarlo a una única variante. */
function mergeHorarios(serviciosArray) {
  const buckets = {}; // 'laborable'|'sabado'|'domingo' -> {frecuencia, pasos:{hora:Set}}
  serviciosArray.forEach(s => {
    (s.horarios || []).forEach(h => {
      const key = normFrecuencia(h.frecuencia);
      if (!buckets[key]) buckets[key] = { frecuencia: h.frecuencia, pasos: {} };
      for (const hora of Object.keys(h.pasos || {})) {
        if (!buckets[key].pasos[hora]) buckets[key].pasos[hora] = new Set();
        (h.pasos[hora] || []).forEach(m => buckets[key].pasos[hora].add(m));
      }
    });
  });
  return ["laborable", "sabado", "domingo"].filter(k => buckets[k]).map(k => {
    const b = buckets[k];
    const pasos = {};
    Object.keys(b.pasos).forEach(hora => {
      pasos[hora] = [...b.pasos[hora]].sort((a, b2) => a - b2);
    });
    return { frecuencia: b.frecuencia, pasos };
  });
}

/** Como mergeHorarios, pero conserva qué recorrido(s) concreto(s) ofrecen
 * cada hora de paso, para poder mostrar "próximo bus a las X, por el
 * recorrido Y" sin atarse a una única variante. */
function mergeDeparturesConOrigen(serviciosArray) {
  const buckets = {};
  serviciosArray.forEach(s => {
    (s.horarios || []).forEach(h => {
      const key = normFrecuencia(h.frecuencia);
      if (!buckets[key]) buckets[key] = { frecuencia: h.frecuencia, slots: new Map() };
      for (const hora of Object.keys(h.pasos || {})) {
        (h.pasos[hora] || []).forEach(m => {
          const k = hora + "-" + m;
          if (!buckets[key].slots.has(k)) buckets[key].slots.set(k, { h: parseInt(hora, 10), m, variantes: new Map() });
          buckets[key].slots.get(k).variantes.set(s.variante_nodo_id, s.variante_nombre);
        });
      }
    });
  });
  const out = {};
  Object.keys(buckets).forEach(key => {
    const arr = [...buckets[key].slots.values()].sort((a, b) => (a.h * 60 + a.m) - (b.h * 60 + b.m));
    arr.forEach(x => { x.variantes = [...x.variantes.values()]; });
    out[key] = { frecuencia: buckets[key].frecuencia, slots: arr };
  });
  return out;
}

function nextDepartureConOrigen(serviciosArray, now) {
  now = now || new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const merged = mergeDeparturesConOrigen(serviciosArray);
  const bucketHoy = merged[frecuenciaKeyForDate(now)];
  if (bucketHoy) {
    const slot = bucketHoy.slots.find(s => s.h * 60 + s.m >= nowMin);
    if (slot) return { h: slot.h, m: slot.m, dias: 0, variantes: slot.variantes };
  }
  for (let add = 1; add <= 7; add++) {
    const future = new Date(now.getTime() + add * 86400000);
    const bucket = merged[frecuenciaKeyForDate(future)];
    if (bucket && bucket.slots.length) {
      const slot = bucket.slots[0];
      return { h: slot.h, m: slot.m, dias: add, variantes: slot.variantes };
    }
  }
  return null;
}

function flattenPasos(pasos) {
  const out = [];
  for (const h of Object.keys(pasos || {})) {
    for (const m of pasos[h]) out.push({ h: parseInt(h, 10), m });
  }
  out.sort((a, b) => a.h - b.h || a.m - b.m);
  return out;
}

/** Devuelve {h, m, dias} de la próxima salida, o null si la línea no
 * tiene ningún horario utilizable en los próximos 7 días. */
function nextDeparture(horarios, now) {
  now = now || new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const bucketHoy = pickHorarioBucket(horarios, frecuenciaKeyForDate(now));
  if (bucketHoy) {
    const pasos = flattenPasos(bucketHoy.pasos);
    const upcoming = pasos.find(p => p.h * 60 + p.m >= nowMinutes);
    if (upcoming) return { h: upcoming.h, m: upcoming.m, dias: 0 };
  }
  for (let add = 1; add <= 7; add++) {
    const future = new Date(now.getTime() + add * 86400000);
    const bucket = pickHorarioBucket(horarios, frecuenciaKeyForDate(future));
    if (bucket) {
      const pasos = flattenPasos(bucket.pasos);
      if (pasos.length) return { h: pasos[0].h, m: pasos[0].m, dias: add };
    }
  }
  return null;
}

function formatDeparture(dep) {
  if (!dep) return { main: "—", sub: "Sin servicios programados" };
  const hh = String(dep.h).padStart(2, "0");
  const mm = String(dep.m).padStart(2, "0");
  let sub;
  if (dep.dias === 0) {
    const now = new Date();
    const diff = (dep.h * 60 + dep.m) - (now.getHours() * 60 + now.getMinutes());
    sub = diff <= 0 ? "saliendo ahora" : `en ${diff} min`;
  } else if (dep.dias === 1) {
    sub = "mañana";
  } else {
    sub = `en ${dep.dias} días`;
  }
  return { main: `${hh}:${mm}`, sub };
}

/** La línea bajo la cabecera sólo habla cuando hay algo que decir: al
 * ciudadano no le sirve saber cuántas líneas se han cargado ni cuándo se
 * generó el fichero. */
function setStatus(msg, esError) {
  const el = document.getElementById("dataStatus");
  el.textContent = msg || "";
  el.classList.toggle("error", !!esError);
}

/* ------------------------------------------------------------------ */
/* Carga de datos con caché en localStorage                            */
/* ------------------------------------------------------------------ */
async function loadData(force) {
  if (!force) {
    try {
      const cached = localStorage.getItem(LS_KEY);
      if (cached) return JSON.parse(cached);
    } catch (e) {
      console.warn("No se pudo leer la caché local", e);
    }
  }
  const resp = await fetch(DATA_URL, { cache: "no-store" });
  if (!resp.ok) throw new Error(`HTTP ${resp.status} al pedir ${DATA_URL}`);
  const json = await resp.json();
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(json));
  } catch (e) {
    console.warn("No se pudo cachear en localStorage (¿cuota llena?)", e);
  }
  return json;
}

/* ------------------------------------------------------------------ */
/* Mapa (Leaflet)                                                      */
/* ------------------------------------------------------------------ */
function setMarkerStyle(marker, selected) {
  marker.setStyle(selected
    ? { radius: 9, color: colorTema("amber"), fillColor: colorTema("amber"), fillOpacity: 1, weight: 2 }
    : { radius: 6, color: colorTema("brand"), fillColor: colorTema("card"), fillOpacity: 1, weight: 2 });
}

function renderMap(containerEl, paradaIds, onMarkerClick, mapRef) {
  mapRef = mapRef || CURRENT_MAP_REF;
  if (mapRef.map) {
    mapRef.map.remove();
    mapRef.map = null;
  }
  const map = L.map(containerEl, { scrollWheelZoom: false });
  mapRef.map = map;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  const latlngs = [];
  const markers = {};
  (paradaIds || []).forEach(id => {
    const p = APP.data.paradas[id];
    if (p && p.lat != null && p.lng != null) {
      latlngs.push([p.lat, p.lng]);
      const marker = L.circleMarker([p.lat, p.lng], {
        radius: 6, weight: 2, color: colorTema("brand"), fillColor: colorTema("card"), fillOpacity: 1
      }).addTo(map).bindTooltip(p.nombre, { direction: "top" });
      marker.on("click", () => onMarkerClick && onMarkerClick(id));
      markers[id] = marker;
    }
  });
  if (latlngs.length > 1) {
    L.polyline(latlngs, { color: colorTema("brand"), weight: 3, opacity: 0.55, dashArray: "1 8" }).addTo(map);
  }
  if (latlngs.length) {
    map.fitBounds(latlngs, { padding: [24, 24] });
  } else {
    map.setView([37.389, -5.984], 11); // Sevilla, de referencia
  }
  return { map, markers };
}

/* ------------------------------------------------------------------ */
/* Capa de red: municipios de lejos, paradas de cerca                   */
/* ------------------------------------------------------------------ */
/** A la escala del área metropolitana, 1.094 círculos son una mancha: no
 * se lee nada y no se puede pinchar en nada. Por debajo de este zoom el
 * mapa enseña el nivel de arriba del grafo tripartito — un municipio por
 * triángulo — y solo al acercarse aparecen sus paradas. Cualquier
 * municipio se puede desplegar a mano sin acercarse, tocando su
 * triángulo; tocándolo otra vez se vuelve a condensar.
 *
 * Agrupar por municipio no basta del todo: en el Aljarafe hay pueblos a
 * 1,3 km, así que de muy lejos sus triángulos se pisan unos a otros y se
 * vuelven impinchables. Por eso los que chocan en pantalla se funden en
 * un solo triángulo que, al tocarlo, despliega la lista de los
 * municipios que lleva dentro. */
const ZOOM_AGRUPADO = 13;

const MUNI_RADIO_MIN = 8;
const MUNI_RADIO_MAX = 17;

/** El círculo crece con las paradas que agrupa, para que de un vistazo se
 * vea dónde hay red de verdad y dónde cuatro paradas contadas. */
function radioDeMunicipios(municipios) {
  const paradas = municipios.reduce((n, m) => {
    const nodo = GRAFO.municipios.get(m);
    return n + (nodo ? nodo.paradas.length : 0);
  }, 0);
  const escala = Math.min(1, Math.sqrt(paradas) / Math.sqrt(70));
  return Math.round(MUNI_RADIO_MIN + (MUNI_RADIO_MAX - MUNI_RADIO_MIN) * escala);
}

/** Estilo del círculo de un municipio. El contorno es el del propio
 * `circleMarker` de Leaflet: no hay una segunda forma encima haciendo de
 * borde ni de anillo de selección, sólo `color` y `weight` de la figura.
 *  - condensado: relleno de marca, aro del color del papel;
 *  - desplegado: hueco, porque sus paradas ya se ven por debajo;
 *  - origen o destino de la ruta: el mismo aro, más grueso y en ámbar o
 *    azul, sin dibujar nada aparte. */
function estiloMunicipio(radio, abierto, extremo) {
  const base = {
    className: "muni-circulo",
    radius: radio,
    weight: extremo ? 4 : 2.5,
    fillOpacity: abierto ? 0.12 : 0.95,
    fillColor: colorTema("brand"),
    color: colorTema("card")
  };
  if (extremo === "origen") base.color = colorTema("amber");
  else if (extremo === "destino") base.color = colorTema("brand-2");
  else if (abierto) base.color = colorTema("brand");
  return base;
}

/** Junta en un mismo triángulo los municipios que a este zoom se pisarían
 * en pantalla. Gana el que más paradas tiene: es el que da nombre al
 * grupo y el que fija dónde se dibuja. */
function agruparMunicipiosEnPantalla(map, municipios) {
  const ordenados = municipios.slice().sort((a, b) =>
    GRAFO.municipios.get(b).paradas.length - GRAFO.municipios.get(a).paradas.length);
  const grupos = [];
  ordenados.forEach(municipio => {
    const nodo = GRAFO.municipios.get(municipio);
    const punto = map.latLngToLayerPoint([nodo.lat, nodo.lng]);
    const radio = radioDeMunicipios([municipio]);
    const grupo = grupos.find(g => punto.distanceTo(g.punto) < (g.radio + radio) * 1.15);
    if (grupo) {
      grupo.municipios.push(municipio);
      grupo.radio = radioDeMunicipios(grupo.municipios);
    } else {
      grupos.push({ municipios: [municipio], punto, radio, lat: nodo.lat, lng: nodo.lng });
    }
  });
  return grupos;
}

/** Monta sobre un mapa la capa de red y devuelve el mando para manejarla.
 *
 * `opciones`:
 *  - `onParada(id)`            qué hacer al tocar una parada.
 *  - `onGrupo(grupo, marca)`   qué hacer al tocar un triángulo.
 *  - `estilo`                  estilo de los círculos de parada.
 */
function crearCapaRed(map, opciones) {
  opciones = opciones || {};
  const estilo = opciones.estilo || { radius: 5, weight: 1.5, color: colorTema("card"), fillColor: colorTema("brand"), fillOpacity: 0.95 };

  const marcadores = {};          // paradaId -> circleMarker
  const grupoDeParadas = new Map(); // municipio -> layerGroup con sus paradas
  const sueltas = L.layerGroup(); // paradas sin municipio conocido
  const circulos = L.layerGroup();
  const expandidos = new Set();
  const extremos = { origen: null, destino: null };
  const limites = [];
  let dibujados = [];             // grupos pintados ahora mismo

  Object.entries(APP.data.paradas).forEach(([id, p]) => {
    if (p.lat == null || p.lng == null) return;
    limites.push([p.lat, p.lng]);
    const marcador = L.circleMarker([p.lat, p.lng], estilo)
      .bindTooltip(p.nombre, { direction: "top" });
    marcador.on("click", () => opciones.onParada && opciones.onParada(id));
    marcadores[id] = marcador;
    if (p.municipio) {
      if (!grupoDeParadas.has(p.municipio)) grupoDeParadas.set(p.municipio, L.layerGroup());
      grupoDeParadas.get(p.municipio).addLayer(marcador);
    } else {
      sueltas.addLayer(marcador);
    }
  });

  const conMapa = GRAFO.lista.filter(m => {
    const nodo = GRAFO.municipios.get(m);
    return nodo && nodo.lat != null;
  });

  const agrupando = () => map.getZoom() < ZOOM_AGRUPADO;

  /** Qué papel juega un grupo en la ruta: si lleva dentro el municipio
   * de origen o el de destino, se marca engordando su propio aro. */
  function papelDe(grupo) {
    if (extremos.origen && grupo.municipios.includes(extremos.origen)) return "origen";
    if (extremos.destino && grupo.municipios.includes(extremos.destino)) return "destino";
    return null;
  }

  function pintarMunicipios() {
    circulos.clearLayers();
    dibujados = agrupando() ? agruparMunicipiosEnPantalla(map, conMapa) : [];
    dibujados.forEach(grupo => {
      const abierto = grupo.municipios.some(m => expandidos.has(m));
      const marca = L.circleMarker([grupo.lat, grupo.lng],
        estiloMunicipio(grupo.radio, abierto, papelDe(grupo)));
      const paradas = grupo.municipios.reduce((n, m) => n + GRAFO.municipios.get(m).paradas.length, 0);
      // Una sola etiqueta por círculo: si lleva varios municipios dentro,
      // el número va escrito en su centro; si lleva uno, el nombre sale al
      // pasar por encima. (Atar dos etiquetas al mismo marcador no vale:
      // Leaflet sólo registra los eventos de la primera, y la permanente
      // se quedaba sin abrir.)
      if (grupo.municipios.length > 1) {
        // Desplegado el círculo se queda hueco, así que el número deja de
        // ir sobre el relleno de marca y pasa a escribirse en ese color.
        marca.bindTooltip(String(grupo.municipios.length), {
          permanent: true, direction: "center", offset: [0, 0],
          className: "muni-cuenta" + (abierto ? " hueca" : "")
        });
      } else {
        marca.bindTooltip(`${grupo.municipios[0]} · ${paradas} paradas`, { direction: "top" });
      }
      marca.on("click", () => {
        // Un solo municipio: el toque lo despliega o lo condensa. Varios:
        // no hay nada que desplegar hasta elegir cuál.
        if (grupo.municipios.length === 1) alternar(grupo.municipios[0], marca);
        if (opciones.onGrupo) opciones.onGrupo(grupo, marca);
      });
      grupo.marca = marca;
      circulos.addLayer(marca);
    });
  }

  function refrescar() {
    const agrupa = agrupando();
    grupoDeParadas.forEach((grupo, municipio) => {
      const verParadas = !agrupa || expandidos.has(municipio);
      if (verParadas && !map.hasLayer(grupo)) grupo.addTo(map);
      if (!verParadas && map.hasLayer(grupo)) map.removeLayer(grupo);
    });
    if (!map.hasLayer(sueltas)) sueltas.addTo(map);
    // De cerca los círculos de municipio sólo estorban: ahí manda la parada.
    if (agrupa && !map.hasLayer(circulos)) circulos.addTo(map);
    if (!agrupa && map.hasLayer(circulos)) map.removeLayer(circulos);
    pintarMunicipios();
  }

  /** Despliega o condensa un municipio. `marca` es el círculo que se ha
   * tocado: se le cambia el estilo en el sitio para no repintarlos todos
   * y cerrar de paso el menú que acaba de abrirse. */
  function alternar(municipio, marca) {
    if (expandidos.has(municipio)) expandidos.delete(municipio);
    else expandidos.add(municipio);
    const grupo = grupoDeParadas.get(municipio);
    if (grupo) {
      const ver = !agrupando() || expandidos.has(municipio);
      if (ver && !map.hasLayer(grupo)) grupo.addTo(map);
      if (!ver && map.hasLayer(grupo)) map.removeLayer(grupo);
    }
    const dibujado = dibujados.find(g => g.municipios.includes(municipio));
    if (marca && dibujado) {
      marca.setStyle(estiloMunicipio(dibujado.radio,
        dibujado.municipios.some(m => expandidos.has(m)), papelDe(dibujado)));
    }
  }

  /** Marca (o desmarca) un municipio como extremo de la ruta. No dibuja
   * nada nuevo: engorda el aro del círculo que ya está en el mapa. */
  function marcarExtremo(cual, municipio) {
    extremos[cual] = municipio || null;
    pintarMunicipios();
  }

  map.on("zoomend", refrescar);
  refrescar();

  return {
    marcadores, limites, expandidos, refrescar, alternar, marcarExtremo,
    estaExpandido: municipio => expandidos.has(municipio),
    agrupando,
    grupoDibujadoDe: municipio => dibujados.find(g => g.municipios.includes(municipio)),
    /** Deja a la vista una parada concreta aunque su municipio esté
     * condensado; si no, tocar un resultado no llevaría a ningún sitio. */
    asegurarVisible: paradaId => {
      const municipio = municipioDeParada(paradaId);
      if (municipio && agrupando() && !expandidos.has(municipio)) {
        expandidos.add(municipio);
        refrescar();
      }
    }
  };
}

/* ------------------------------------------------------------------ */
/* Menú contextual de un municipio                                      */
/* ------------------------------------------------------------------ */
/** Leaflet solo corta la propagación de `mousedown` dentro de un globo,
 * no la del `click`, así que tocar cualquier botón de dentro llega
 * también al mapa y este cierra el globo por su cuenta. Estos menús
 * cambian de contenido sin cerrarse (elegir municipio, desplegar sus
 * paradas), así que hay que cortarlo a mano. */
function sinPropagarClic(elemento) {
  L.DomEvent.on(elemento, "click", L.DomEvent.stopPropagation);
  return elemento;
}

/** El mismo círculo del mapa, en pequeño, para encabezar sus menús. */
function puntoMunicipio() {
  return '<span class="muni-punto" aria-hidden="true"></span>';
}

/** Qué es un municipio, qué líneas lo recorren y qué puedes hacer con él.
 * Es el sitio donde el nivel "municipio" del grafo se toca con el dedo:
 * desde aquí se despliegan sus paradas y se usa el municipio entero como
 * extremo de una ruta. `volver`, si viene, pinta una vuelta al grupo del
 * que se ha llegado. */
function buildMunicipioPopupContent(municipio, capa, modo, marca, volver) {
  const nodo = GRAFO.municipios.get(municipio);
  const wrap = document.createElement("div");
  wrap.className = "muni-popup";
  const lineas = [...(nodo ? nodo.lineas : [])]
    .map(slug => APP.data.lineas.find(l => l.slug === slug))
    .filter(Boolean)
    .sort((a, b) => a.titulo.localeCompare(b.titulo, "es"));

  wrap.innerHTML = `
    ${volver ? '<button type="button" class="muni-popup-volver" id="muniVolver">‹ Volver</button>' : ""}
    <div class="muni-popup-title">${puntoMunicipio()} ${escapeHtml(municipio)}</div>
    <div class="muni-popup-sub">${nodo ? nodo.paradas.length : 0} paradas · ${lineas.length} línea${lineas.length === 1 ? "" : "s"}</div>`;
  if (volver) wrap.querySelector("#muniVolver").addEventListener("click", volver);

  const btnDesplegar = document.createElement("button");
  btnDesplegar.type = "button";
  btnDesplegar.className = "btn-chip";
  const pintarBoton = () => {
    btnDesplegar.textContent = capa.estaExpandido(municipio)
      ? "Condensar sus paradas"
      : `Ver sus ${nodo ? nodo.paradas.length : 0} paradas`;
  };
  pintarBoton();
  btnDesplegar.addEventListener("click", () => { capa.alternar(municipio, marca); pintarBoton(); });
  wrap.appendChild(btnDesplegar);

  if (lineas.length) {
    const lista = document.createElement("div");
    lista.className = "muni-popup-lineas";
    lineas.forEach(l => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "muni-popup-fila";
      row.innerHTML = `<span class="muni-popup-code">${escapeHtml(codigoLinea(l.titulo))}</span>
        <span class="muni-popup-fila-sub">${escapeHtml(municipiosDeLinea(l.slug).join(" · "))}</span>`;
      row.addEventListener("click", () => openLineModal(l.slug));
      lista.appendChild(row);
    });
    wrap.appendChild(lista);
  }

  wrap.appendChild(accionesDeMunicipio(municipio, modo));
  return sinPropagarClic(wrap);
}

/** Botones de ruta de un municipio: es lo que lo convierte en un vértice
 * "Municipio: —" del cálculo, igual que una parada o un punto marcado. */
function accionesDeMunicipio(municipio, modo) {
  const acciones = document.createElement("div");
  acciones.className = "stop-popup-actions";
  const punto = { type: "municipio", nombre: municipio };
  const cerrar = () => {
    if (modo === "ruta" && CURRENT_ROUTE_MAP) CURRENT_ROUTE_MAP.closePopup();
    if (modo !== "ruta" && HOME_MAP) HOME_MAP.closePopup();
  };

  if (modo === "ruta") {
    const esOrigen = ROUTE_ORIGIN && ROUTE_ORIGIN.type === "municipio" && ROUTE_ORIGIN.nombre === municipio;
    const esDestino = ROUTE_DESTINO && ROUTE_DESTINO.type === "municipio" && ROUTE_DESTINO.nombre === municipio;
    const btnOrigen = document.createElement("button");
    btnOrigen.type = "button";
    btnOrigen.className = "btn-chip" + (esOrigen ? " armed" : "");
    btnOrigen.innerHTML = esOrigen ? icono("cerrar") + "Quitar origen" : icono("pin") + "Salgo de aquí";
    btnOrigen.addEventListener("click", () => {
      if (esOrigen) clearEndpoint("origen"); else setEndpoint("origen", punto);
      cerrar();
    });
    acciones.appendChild(btnOrigen);

    const btnDestino = document.createElement("button");
    btnDestino.type = "button";
    btnDestino.className = "btn-chip" + (esDestino ? " armed" : "");
    btnDestino.innerHTML = esDestino ? icono("cerrar") + "Quitar destino" : icono("bandera") + "Voy aquí";
    btnDestino.addEventListener("click", () => {
      if (esDestino) clearEndpoint("destino"); else setEndpoint("destino", punto);
      cerrar();
    });
    acciones.appendChild(btnDestino);
  } else {
    const btnIr = document.createElement("button");
    btnIr.type = "button";
    btnIr.className = "btn-chip";
    btnIr.innerHTML = icono("brujula") + "Ir a este municipio";
    btnIr.addEventListener("click", () => {
      cerrar();
      irAPantalla("screenRuta");
      setTimeout(() => {
        buildStopsDatalist();
        setEndpoint("destino", punto);
        if (ROUTE_ORIGIN) onCalcularRuta();
      }, 90);
    });
    acciones.appendChild(btnIr);
  }
  return acciones;
}

/** Menú de un triángulo que lleva varios municipios dentro: la lista
 * para elegir de cuál se habla. Al elegir uno se cambia el contenido del
 * mismo globo, con vuelta atrás. */
function buildGrupoPopupContent(grupo, capa, modo, marca, popup) {
  const wrap = document.createElement("div");
  wrap.className = "muni-popup";
  const paradas = grupo.municipios.reduce((n, m) => n + GRAFO.municipios.get(m).paradas.length, 0);
  wrap.innerHTML = `
    <div class="muni-popup-title">${puntoMunicipio()} ${grupo.municipios.length} municipios aquí</div>
    <div class="muni-popup-sub">${paradas} paradas · demasiado juntos para separarlos a este zoom</div>`;

  const lista = document.createElement("div");
  lista.className = "muni-popup-lineas";
  grupo.municipios.slice().sort((a, b) => a.localeCompare(b, "es")).forEach(municipio => {
    const nodo = GRAFO.municipios.get(municipio);
    const row = document.createElement("button");
    row.type = "button";
    row.className = "muni-popup-fila";
    row.innerHTML = `<span class="muni-popup-fila-name">${escapeHtml(municipio)}</span>
      <span class="muni-popup-fila-sub">${nodo.paradas.length} paradas · ${nodo.lineas.size} línea${nodo.lineas.size === 1 ? "" : "s"}</span>`;
    row.addEventListener("click", () => {
      popup.setContent(buildMunicipioPopupContent(municipio, capa, modo, marca,
        () => popup.setContent(buildGrupoPopupContent(grupo, capa, modo, marca, popup))));
    });
    lista.appendChild(row);
  });
  wrap.appendChild(lista);
  return sinPropagarClic(wrap);
}

/** Abre el menú del triángulo tocado: la ficha del municipio si lleva uno
 * solo, o la lista para elegir si lleva varios. */
function abrirMenuGrupo(map, grupo, marca, capa, modo) {
  // El globo no puede ser más alto que el mapa: si lo es, Leaflet no
  // tiene a dónde desplazarlo y se sale por arriba del recuadro.
  const alto = Math.max(170, map.getSize().y - 80);
  const popup = L.popup({ minWidth: 240, maxHeight: alto }).setLatLng(marca.getLatLng());
  popup.setContent(grupo.municipios.length === 1
    ? buildMunicipioPopupContent(grupo.municipios[0], capa, modo, marca)
    : buildGrupoPopupContent(grupo, capa, modo, marca, popup));
  popup.openOn(map);
}

/* ------------------------------------------------------------------ */
/* Render: horario completo + tablero de próxima salida + PDF          */
/* ------------------------------------------------------------------ */
function renderBoard(container, servicio) {
  const dep = nextDeparture(servicio.horarios);
  const fmt = formatDeparture(dep);
  container.innerHTML = `
    <div class="board">
      <div class="board-label">PRÓXIMA SALIDA</div>
      <div class="board-time">${fmt.main}</div>
      <div class="board-sub">${escapeHtml(fmt.sub)}</div>
    </div>
`;
}

function renderPdfBtn(container, servicio) {
  container.innerHTML = "";
  if (servicio.pdf_url) {
    const a = document.createElement("a");
    a.href = servicio.pdf_url;
    a.target = "_blank";
    a.rel = "noopener";
    a.className = "btn btn-pdf";
    a.textContent = "Descargar el PDF oficial";
    container.appendChild(a);
  } else {
    container.innerHTML = '<p class="empty">PDF no disponible para esta parada.</p>';
  }
}

function renderHorarioSection(container, servicio) {
  container.innerHTML = "";
  const todayKey = frecuenciaKeyForDate(new Date());
  (servicio.horarios || []).forEach(h => {
    const isToday = matchFrecuencia(h.frecuencia, todayKey);
    const details = document.createElement("details");
    details.open = isToday;
    const summary = document.createElement("summary");
    summary.textContent = h.frecuencia + (isToday ? " · hoy" : "");
    details.appendChild(summary);

    const grid = document.createElement("div");
    grid.className = "horagrid";
    const horas = Object.keys(h.pasos || {}).map(Number).sort((a, b) => a - b);
    horas.forEach(hh => {
      const cell = document.createElement("div");
      cell.className = "horacell";
      const label = document.createElement("span");
      label.className = "horalabel";
      label.textContent = String(hh).padStart(2, "0") + "h";
      cell.appendChild(label);
      const mins = document.createElement("div");
      mins.className = "minchips";
      (h.pasos[hh] || []).forEach(m => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = String(m).padStart(2, "0");
        mins.appendChild(chip);
      });
      cell.appendChild(mins);
      grid.appendChild(cell);
    });
    details.appendChild(grid);
    container.appendChild(details);
  });
  if (!container.children.length) {
    container.innerHTML = '<p class="empty">No hay horario disponible para esta parada.</p>';
  }
}

/** Vista de detalle completa de una línea: mapa + lista de TODAS sus
 * paradas (unión de todos sus recorridos, en el orden fusionado
 * `orden_unificado`), cada una con su propia próxima salida — contando
 * cualquier recorrido de la línea que pase por ahí — y mostrando qué
 * recorrido concreto sigue ese autobús. Cada parada es un acordeón: al
 * abrirla se ve el horario completo de hoy y los PDFs oficiales de cada
 * recorrido que pasa por esa parada. Reutilizada tanto desde "Buscar
 * línea" como desde el drill-down de Geolocalización. `defaultStopId`,
 * si se pasa, se abre y se centra al cargar. `onBack`, si se pasa,
 * añade un botón de volver. */
function renderLineDetail(container, linea, defaultStopId, onBack, mapRef) {
  mapRef = mapRef || CURRENT_MAP_REF;
  container.innerHTML = `
    ${onBack ? '<button class="btn-back" id="btnBack">← Volver</button>' : ""}
    <h3 class="detail-title"><span class="linea-badge">${escapeHtml(codigoLinea(linea.titulo))}</span> ${escapeHtml(nombreSinCodigo(linea.titulo))} <button type="button" class="btn-fav${esFavoritoLinea(linea.slug) ? " es-fav" : ""}" id="btnFavLinea" title="Guardar esta línea">${icono("estrella")}</button></h3>

    <h4 class="section-title" style="margin-top:14px;">Salidas por sentido</h4>
    <div class="cabecera-list" id="cabecerasBox"></div>

    <div id="mapBox" class="mapbox"></div>
    <h4 class="section-title">Paradas y próxima salida</h4>

    <div id="stopsList"></div>
  `;
  if (onBack) container.querySelector("#btnBack").addEventListener("click", onBack);
  const cabecerasBox = container.querySelector("#cabecerasBox");
  const repintarCabeceras = () => renderSalidasDeLineaEn(cabecerasBox, linea, repintarCabeceras);
  repintarCabeceras();
  container.querySelector("#btnFavLinea").addEventListener("click", e => {
    toggleFavoritoLinea(linea.slug);
    pintarEstrella(e.currentTarget, esFavoritoLinea(linea.slug));
    repintarCabeceras();
  });

  const stopsListEl = container.querySelector("#stopsList");
  const paradasValidas = (linea.orden_unificado || []).filter(id => APP.data.paradas[id]);
  if (paradasValidas.length === 0) {
    stopsListEl.innerHTML = '<p class="empty">Esta línea no tiene paradas con datos.</p>';
    return;
  }

  const { markers } = renderMap(container.querySelector("#mapBox"), paradasValidas, id => {
    const row = stopsListEl.querySelector(`.stoprow[data-id="${cssEscape(id)}"]`);
    if (row) {
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      openStopRow(row);
    }
  }, mapRef);

  function openStopRow(row) {
    stopsListEl.querySelectorAll(".stoprow-body").forEach(b => { if (b !== row.querySelector(".stoprow-body")) b.hidden = true; });
    const body = row.querySelector(".stoprow-body");
    const wasHidden = body.hidden;
    body.hidden = !wasHidden ? true : false;
    const id = row.dataset.id;
    Object.entries(markers).forEach(([mid, m]) => setMarkerStyle(m, mid === id));
    const p = APP.data.paradas[id];
    if (wasHidden && p.lat != null && mapRef.map) mapRef.map.panTo([p.lat, p.lng]);
    if (wasHidden && !body.dataset.built) {
      const serviciosLinea = serviciosDeLineaEnParada(id, linea.slug);
      const merged = mergeHorarios(serviciosLinea);
      renderBoard(body.querySelector(".boardBox"), { horarios: merged });
      renderPdfMultiBtn(body.querySelector(".pdfBox"), serviciosLinea);
      renderHorarioSection(body.querySelector(".horarioBox"), { horarios: merged });
      body.dataset.built = "1";
    }
  }

  let firstRow = null;
  paradasValidas.forEach((id, idx) => {
    const p = APP.data.paradas[id];

/** Escapa un valor para usarlo dentro de un selector CSS de atributo
 * (los IDs de parada son numéricos o "s-slug", pero por seguridad). */
function cssEscape(s) {
  return String(s).replace(/["\\]/g, "\\$&");
}

/* Pantalla "Líneas": favoritas arriba, listado completo debajo        */
/* ------------------------------------------------------------------ */
function municipiosConLineas() {
  return GRAFO.lista.filter(m => GRAFO.municipios.get(m).lineas.size);
}

/** El título de la línea sin su código delante, que ya se pinta aparte
 * como distintivo. */
function nombreSinCodigo(titulo) {
  const codigo = codigoLinea(titulo);
  return String(titulo).replace(new RegExp("^\\s*" + codigo.replace(/[-]/g, "\\-") + "\\s*-?\\s*"), "").trim() || String(titulo);
}

/** Código corto de la línea ("M-177") extraído del título completo. */
function codigoLinea(titulo) {
  const m = String(titulo).match(/^\s*([A-Za-zÀ-ÿ]?-?\d+[A-Za-z]?)/);
  return m ? m[1] : String(titulo).slice(0, 6);
}

/** Extrae "Origen → Destino" del nombre descriptivo que ctas.es da a
 * cada variante (p.ej. "M-177 Guillena - Camas - Sevilla (directo)" →
 * Guillena / Sevilla). Es más informativo para orientarse que la primera
 * y última parada, porque la mayoría de recorridos son circulares y
 * empiezan y acaban físicamente en el mismo sitio. */
function origenDestinoVariante(nombreVariante) {
  let limpio = String(nombreVariante || "").replace(/^\s*[A-Za-zÀ-ÿ]?-?\d+[A-Za-z]?\s*/, "");
  limpio = limpio.replace(/\s*\([^)]*\)\s*/g, " ").trim();
  const partes = limpio.split("-").map(p => p.trim()).filter(Boolean);
  if (!partes.length) return null;
  return { origen: partes[0], destino: partes[partes.length - 1] };
}

/* ------------------------------------------------------------------ */
/* Puntos de referencia de una línea                                    */
/* ------------------------------------------------------------------ */
/** Un "punto de referencia" responde a "¿desde qué parada y hacia dónde
 * quiero mirar esta línea?". Sustituye a las antiguas cabeceras, que
 * ataban las salidas al sitio donde arranca cada recorrido y por eso
 * dejaban fuera los autobuses que pasan por tu parada habiendo salido de
 * otro sitio.
 *
 * Mientras no elijas nada se usan las cabeceras de la línea, que siguen
 * siendo la vista razonable si la línea no es "tuya". En cuanto eliges
 * parada — primero municipio, luego parada — manda la tuya. */
function referenciasPorDefecto(linea) {
  const refs = [];
  const vistas = new Set();
  (linea.variantes || []).forEach(v => {
    const primera = (v.paradas || []).find(id => APP.data.paradas[id]);
    if (!primera || vistas.has(primera)) return;
    vistas.add(primera);
    sentidosEnParada(primera, linea.slug).forEach(s => {
      refs.push({ paradaId: primera, sentidoClave: s.sentidoClave, propia: false });
    });
  });
  return refs;
}

function referenciasDeLinea(linea) {
  const fav = FAVORITOS.lineas.find(l => l.slug === linea.slug);
  const propias = (fav && Array.isArray(fav.referencias) ? fav.referencias : [])
    .filter(r => r && APP.data.paradas[r.paradaId])
    .map(r => ({ paradaId: r.paradaId, sentidoClave: r.sentidoClave || null, propia: true }));
  return propias.length ? propias : referenciasPorDefecto(linea);
}

function mismaReferencia(a, b) {
  return a.paradaId === b.paradaId && (a.sentidoClave || null) === (b.sentidoClave || null);
}

function anadirReferencia(lineaSlug, paradaId, sentidoClave) {
  const fav = FAVORITOS.lineas.find(l => l.slug === lineaSlug);
  if (!fav) return;
  if (!Array.isArray(fav.referencias)) fav.referencias = [];
  const nueva = { paradaId, sentidoClave: sentidoClave || null };
  if (!fav.referencias.some(r => mismaReferencia(r, nueva))) fav.referencias.push(nueva);
  guardarFavoritos();
}

function quitarReferencia(lineaSlug, referencia) {
  const fav = FAVORITOS.lineas.find(l => l.slug === lineaSlug);
  if (!fav || !Array.isArray(fav.referencias)) return;
  fav.referencias = fav.referencias.filter(r => !mismaReferencia(r, referencia));
  guardarFavoritos();
}

/** Próximas salidas de una línea en un punto de referencia: se fusionan
 * TODOS los recorridos que pasan por esa parada en ese sentido, vengan de
 * la cabecera que vengan. Devuelve además las siguientes horas, para
 * poder enseñar "y luego a las…". */
function salidasDeReferencia(linea, ref, cuantas) {
  cuantas = cuantas || 2;
  const parada = APP.data.paradas[ref.paradaId];
  if (!parada) return null;
  const sentidos = sentidosEnParada(ref.paradaId, linea.slug);
  const grupo = ref.sentidoClave ? sentidos.find(s => s.sentidoClave === ref.sentidoClave) : null;
  const servicios = grupo ? grupo.servicios : sentidos.reduce((acc, s) => acc.concat(s.servicios), []);
  if (!servicios.length) return null;

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const merged = mergeDeparturesConOrigen(servicios);
  const bucket = merged[frecuenciaKeyForDate(now)];
  let horas = [];
  let dep = null;
  if (bucket && bucket.slots.length) {
    const futuras = bucket.slots.filter(s => s.h * 60 + s.m >= nowMin).slice(0, cuantas);
    horas = futuras.map(s => `${String(s.h).padStart(2, "0")}:${String(s.m).padStart(2, "0")}`);
    if (futuras.length) dep = { h: futuras[0].h, m: futuras[0].m, dias: 0 };
  }
  // Sin salidas ya hoy: se barren los días siguientes para no dejar la
  // fila muda.
  if (!dep) dep = nextDeparture(mergeHorarios(servicios), now);

  return {
    ...ref,
    paradaNombre: parada.nombre,
    municipio: municipioDeParada(ref.paradaId),
    etiqueta: grupo ? grupo.etiqueta : (sentidos[0] ? sentidos[0].etiqueta : linea.titulo),
    numSentidos: sentidos.length,
    horas, dep, servicios
  };
}

/** Todas las referencias de una línea, resueltas y ordenadas por
 * cercanía de la próxima salida. */
function salidasDeLinea(linea, cuantas) {
  return referenciasDeLinea(linea)
    .map(ref => salidasDeReferencia(linea, ref, cuantas))
    .filter(Boolean)
    .sort((a, b) => {
      const av = a.dep ? a.dep.dias * 1440 + a.dep.h * 60 + a.dep.m : Infinity;
      const bv = b.dep ? b.dep.dias * 1440 + b.dep.h * 60 + b.dep.m : Infinity;
      return av - bv;
    });
}

/** Elegir "mis paradas" en una línea, en dos pasos: municipio → parada.
 * Empezar por el municipio es lo que pide el caso real: quiero ver la
 * M-177 desde Guillena y también desde Sevilla, y en cada sitio desde una
 * parada distinta. */
function abrirSelectorReferencias(linea, onCambio) {
  let municipioElegido = null;
  openModal(container => {
    const pintar = () => {
      const actuales = referenciasDeLinea(linea);
      const fav = FAVORITOS.lineas.find(l => l.slug === linea.slug);
      const tienePropias = !!(fav && Array.isArray(fav.referencias) && fav.referencias.length);
      const municipios = municipiosDeLinea(linea.slug);
      container.innerHTML = `
        <h3 class="detail-title">Tus paradas en esta línea</h3>
        <div class="detail-meta">${escapeHtml(linea.titulo)}</div>
        <div class="selector-bloque">
          <div class="selector-titulo">${tienePropias ? "Mirando desde" : "Por defecto: las cabeceras de la línea"}</div>
          <div id="refsActuales"></div>
        </div>
        <div class="selector-bloque">
          <div class="selector-titulo">Añadir una parada · elige municipio</div>
          <div class="chip-row" id="refMunicipios">
            ${municipios.map(m => `<button type="button" class="muni-chip${m === municipioElegido ? " active" : ""}" data-muni="${escapeHtml(m)}">${escapeHtml(m)}</button>`).join("")}
          </div>
          <div id="refParadas"></div>
        </div>`;

      const lista = container.querySelector("#refsActuales");
      actuales.forEach(ref => {
        const info = salidasDeReferencia(linea, ref, 1);
        const row = document.createElement("div");
        row.className = "linea-row";
        row.innerHTML = `<span class="linea-row-name">${escapeHtml(APP.data.paradas[ref.paradaId].nombre)}
            <span class="linea-row-muni">${escapeHtml((info && info.municipio) || "")}${info && info.etiqueta ? " · hacia " + escapeHtml(info.etiqueta) : ""}</span>
          </span>`;
        if (tienePropias) {
          const quitar = document.createElement("button");
          quitar.type = "button";
          quitar.className = "btn-fav";
          quitar.innerHTML = icono("cerrar");
          quitar.title = "Quitar esta parada";
          quitar.addEventListener("click", e => {
            e.stopPropagation();
            quitarReferencia(linea.slug, ref);
            pintar();
            if (onCambio) onCambio();
          });
          row.appendChild(quitar);
        }
        lista.appendChild(row);
      });

      container.querySelectorAll("#refMunicipios .muni-chip").forEach(btn => {
        btn.addEventListener("click", () => { municipioElegido = btn.dataset.muni; pintar(); });
      });

      const caja = container.querySelector("#refParadas");
      if (!municipioElegido) {
        caja.innerHTML = '<p class="empty">Elige primero un municipio.</p>';
        return;
      }
      const paradas = paradasDeMunicipioEnLinea(municipioElegido, linea.slug);
      if (!paradas.length) {
        caja.innerHTML = '<p class="empty">Esta línea no tiene paradas ahí.</p>';
        return;
      }
      caja.innerHTML = "";
      paradas.forEach(pid => {
        sentidosEnParada(pid, linea.slug).forEach(s => {
          const ya = actuales.some(r => mismaReferencia(r, { paradaId: pid, sentidoClave: s.sentidoClave }));
          const fmt = formatDeparture(s.dep);
          const row = document.createElement("div");
          row.className = "linea-row";
          row.innerHTML = `<span class="linea-row-name">${escapeHtml(APP.data.paradas[pid].nombre)}
              <span class="linea-row-muni">hacia ${escapeHtml(s.etiqueta)}</span>
            </span>
            <span class="cabecera-time">${escapeHtml(fmt.main)}<span class="cabecera-sub">${escapeHtml(fmt.sub)}</span></span>
            <span class="btn-fav${ya ? " es-fav" : ""}">${icono("estrella")}</span>`;
          row.addEventListener("click", () => {
            if (ya) quitarReferencia(linea.slug, { paradaId: pid, sentidoClave: s.sentidoClave });
            else anadirReferencia(linea.slug, pid, s.sentidoClave);
            pintar();
            if (onCambio) onCambio();
          });
          caja.appendChild(row);
        });
      });
    };
    pintar();
  });
}

function renderListadoLineas() {
  const box = document.getElementById("lineasListado");
  const municipio = document.getElementById("selMunicipio").value;
  const texto = normalize(document.getElementById("lineaBuscador").value.trim());

  // Los municipios de cada línea salen del grafo (los que de verdad

  // viene incompleto: la M-101 declara solo dos de los seis que recorre.
  let lineas = APP.data.lineas;
  if (municipio) lineas = lineas.filter(l => GRAFO.municipios.get(municipio).lineas.has(l.slug));
  if (texto) {
    lineas = lineas.filter(l =>
      normalize(l.titulo).includes(texto) ||
      municipiosDeLinea(l.slug).some(m => normalize(m).includes(texto)));
  }
  lineas = [...lineas].sort((a, b) => a.titulo.localeCompare(b.titulo, "es"));

  if (!lineas.length) {
    box.innerHTML = '<p class="empty">No hay líneas que coincidan con la búsqueda.</p>';
    return;
  }
  box.innerHTML = "";
  lineas.forEach(l => {
    const row = document.createElement("div");
    row.className = "linea-row";
    // El código de la línea manda (es lo que se busca con el ojo) y el
    // recorrido va en UNA línea recortada: el título ya nombra los
    // municipios, así que listarlos otra vez a tres renglones convertía
    // el listado en un muro de texto verde imposible de repasar.
    row.innerHTML = `
      <span class="linea-badge">${escapeHtml(codigoLinea(l.titulo))}</span>
      <span class="linea-row-name">${escapeHtml(nombreSinCodigo(l.titulo))}
        <span class="linea-row-muni">${escapeHtml(municipiosDeLinea(l.slug).join(" · ") || "—")}</span>
      </span>`;
    const btnFav = document.createElement("button");
    btnFav.type = "button";
    btnFav.className = "btn-fav";
    pintarEstrella(btnFav, esFavoritoLinea(l.slug));
    btnFav.addEventListener("click", e => {
      e.stopPropagation();
      toggleFavoritoLinea(l.slug);
      pintarEstrella(btnFav, esFavoritoLinea(l.slug));
      renderLineasFavoritas();
    });
    row.addEventListener("click", () => mostrarDetalleLinea(l.slug));
    row.appendChild(btnFav);
    box.appendChild(row);
  });
}
