/* ------------------------------------------------------------------ */
/* Pestaña "Calculadora de ruta"                                       */
/* ------------------------------------------------------------------ */
const ROUTING_URL = "ctas_routing.json";
const LS_ROUTING_KEY = "ctasRoutingV3"; // v3: conexiones reales (v1/v2 usaban formatos incompatibles)
let ROUTING = null;
let CURRENT_ROUTE_MAP = null;
let ROUTE_MARKERS = {};
let ROUTE_CAPA = null;   // capa de red del mapa de rutas (municipios + paradas)
let ROUTE_ORIGIN = null;   // {type:'stop', id} | {type:'point', lat, lng}
let ROUTE_DESTINO = null;
let ROUTE_ARM_MODE = null; // 'origen' | 'destino' | null
let ROUTE_ORIGIN_MARKER = null;
let ROUTE_DESTINO_MARKER = null;
let ROUTE_PATH_LAYERS = [];
let PARADA_POR_NOMBRE = null;
// Menos trasbordos manda siempre: es lo que pide quien no se sabe la red.
// Las alternativas más rápidas se ofrecen igual en la lista de opciones,
// así que no hace falta que nadie elija un criterio de optimización.
const CRITERIO = "trasbordos";
let RUTA_OPCIONES = [];      // combinaciones de líneas calculadas para la última consulta
let RUTA_OPCION_ACTIVA = 0;  // cuál se está enseñando (0 = la de menos trasbordos)

function walkMinutes(distMeters) {
  return Math.max(1, Math.round((distMeters / 1000) / 3 * 60));
}

function nearestStop(appData, lat, lng) {
  let best = null, bestD = Infinity;
  for (const [id, p] of Object.entries(appData.paradas)) {
    if (p.lat == null) continue;
    const d = haversine(lat, lng, p.lat, p.lng);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best ? { id: best, dist: bestD } : null;
}

/** Traduce un extremo de la ruta (parada, punto marcado en el mapa,
 * ubicación del GPS o municipio entero) a lo que necesita el buscador:
 * desde qué paradas puede empezar y en cuáles se da por llegado.
 *
 * El caso "municipio" es el que abre el grafo tripartito a la interfaz:
 * la persona no elige parada ninguna, dice "de Guillena a Sevilla", y
 * valen todas las paradas del municipio. */
function resolverExtremo(appData, punto) {
  if (!punto) return null;
  if (punto.type === "stop") {
    if (!appData.paradas[punto.id]) return null;
    return {
      tipo: "stop", stopIds: new Set([punto.id]),
      seeds: [{ stopId: punto.id, walk: null }],
      etiqueta: appData.paradas[punto.id].nombre
    };
  }
  if (punto.type === "municipio") {
    const ids = paradasDeMunicipio(punto.nombre);
    if (!ids.length) return null;
    return {
      tipo: "municipio", stopIds: new Set(ids),
      seeds: ids.map(id => ({ stopId: id, walk: null })),
      etiqueta: punto.nombre
    };
  }
  const near = nearestStop(appData, punto.lat, punto.lng);
  if (!near) return null;
  return {
    tipo: "punto", stopIds: new Set([near.id]),
    seeds: [{ stopId: near.id, walk: { lat: punto.lat, lng: punto.lng, dist: near.dist } }],
    etiqueta: appData.paradas[near.id].nombre
  };
}

/** Coordenadas representativas de un extremo, para medir distancias y
 * centrar el mapa. Un municipio se representa por el centro de sus
 * paradas. */
function coordenadasDeExtremo(appData, punto) {
  if (!punto) return null;
  if (punto.type === "stop") {
    const p = appData.paradas[punto.id];
    return p && p.lat != null ? [p.lat, p.lng] : null;
  }
  if (punto.type === "municipio") {
    const m = GRAFO.municipios.get(punto.nombre);
    return m && m.lat != null ? [m.lat, m.lng] : null;
  }
  return [punto.lat, punto.lng];
}

async function loadRoutingData(force) {
  if (!force) {
    try {
      const cached = localStorage.getItem(LS_ROUTING_KEY);
      if (cached) {
        const parsed = JSON.parse(cached);
        // Comprobación de forma: si la caché es de un formato antiguo o
        // está corrupta, la descartamos en vez de dejar que la app pete
        // más adelante al intentar usarla.
        if (parsed && parsed.conexiones && parsed.vecinos) return parsed;
        console.warn("Caché de rutas con formato inesperado, se descarta y se vuelve a pedir.");
      }
    } catch (e) {
      console.warn("No se pudo leer la caché de rutas", e);
    }
  }
  const resp = await fetch(ROUTING_URL, { cache: "no-store" });
  if (!resp.ok) throw new Error(`HTTP ${resp.status} al pedir ${ROUTING_URL}`);
  const json = await resp.json();
  try {
    localStorage.setItem(LS_ROUTING_KEY, JSON.stringify(json));
  } catch (e) {
    console.warn("No se pudo cachear el motor de rutas (¿cuota llena?)", e);
  }
  return json;
}

/** Puntuación compuesta usada para decidir, en cada relajación del
 * Connection Scan, si una nueva forma de llegar a una parada es "mejor"
 * que la que ya teníamos — el criterio de la persona decide qué pesa
 * más, el resto actúa como desempate:
 *  - tiempo: la hora de llegada real, sin más.
 *  - trasbordos: nº de trasbordos domina por completo (cada uno vale
 *    100000), la hora de llegada solo desempata entre rutas con el
 *    mismo nº de trasbordos.
 *  - caminar: los minutos caminados dominan igual que arriba. */
function calcularScore(criterio, arr, trasbordos, caminando) {
  if (criterio === "trasbordos") return trasbordos * 100000 + arr;
  if (criterio === "caminar") return caminando * 100000 + arr;
  return arr;
}

const MIN_TRASBORDO_MIN = 3; // margen mínimo real para bajar, andar/esperar y subir

/** Ruta "mejor" entre origen y destino con un Connection Scan sobre
 * conexiones REALES (instancia por instancia, no una duración típica):
 * cada trasbordo se resuelve mirando de verdad a qué hora sale el
 * siguiente autobús de la línea que toca desde la parada en la que
 * quedas, filtrado por la hora a la que llegas ahí — nunca una espera
 * inventada. Un trasbordo a pie es SIEMPRE un único salto entre dos
 * paradas (nunca una cadena de paseos), porque el salto a pie solo se
 * genera como reacción a bajarte de un autobús, no se puede encadenar.
 * "Mejor" es configurable vía `criterio`: 'tiempo' | 'trasbordos' |
 * 'caminar' (ver calcularScore). Si a esa hora ya no queda servicio,
 * prueba también los 2 días siguientes.
 *
 * Origen y destino pueden ser conjuntos de paradas y no una sola (es lo
 * que pasa cuando el extremo es un municipio entero): la búsqueda
 * arranca desde todas a la vez y se da por llegada en la primera que
 * alcance, que es exactamente la semántica de "ir de Guillena a
 * Sevilla".
 *
 * `opciones.lineasPermitidas` restringe la búsqueda a un conjunto de
 * líneas concreto; es lo que permite poner hora real a cada una de las
 * combinaciones que se ofrecen. */
function computeRoute(appData, routing, origin, destino, startDate, criterio, opciones) {
  criterio = criterio || "tiempo";
  opciones = opciones || {};
  const permitidas = opciones.lineasPermitidas || null;
  const o = resolverExtremo(appData, origin);
  const de = resolverExtremo(appData, destino);
  if (!o || !de) return null;

  for (let dia = 0; dia <= 2; dia++) {
    const fecha = new Date(startDate.getTime() + dia * 86400000);
    const freqKey = frecuenciaKeyForDate(fecha);
    const conexiones = routing.conexiones[freqKey] || [];
    const diaOffset = dia * 1440;
    // startMin siempre en minutos ABSOLUTOS desde la medianoche del día
    // de la consulta original (día 0), nunca reseteado a 0 en los días
    // siguientes: si no, un tramo de un día posterior guardaba su hora
    // "dentro de ese día" (p.ej. 07:00 → 420) sin sumarle el desplazamiento
    // de día, y al compararla más tarde con la hora de salida original
    // (p.ej. 23:00 → 1380) salía una espera negativa ("-58 minutos").
    const startMin = diaOffset + (dia === 0 ? (startDate.getHours() * 60 + startDate.getMinutes()) : 0);

    // Cada parada de "estado" guarda, además de sus métricas, una
    // referencia directa al ESTADO PREDECESOR concreto que se usó para
    // llegar a ella (no solo el ID de la parada anterior). Esto es
    // crítico: si en vez de guardar la referencia volviéramos a mirar
    // "¿cómo se llega mejor a A?" en el momento de reconstruir el
    // camino, podríamos encontrarnos una versión de A mejorada
    // POSTERIORMENTE (con mejor puntuación pero llegada más tardía) que
    // ya no es compatible con la conexión concreta que se usó para
    // saltar de A a B — eso producía tramos con "llegada" antes que
    // "salida". Guardando el objeto de estado exacto en vez de su ID,
    // la reconstrucción siempre es coherente por construcción.
    const estado = new Map(); // stopId -> {score, arr, trasbordos, caminando, linea, leg, prev}

    // Además de la parada de origen en sí, se puede caminar directamente
    // a otra parada cercana antes de subir a ningún autobús (por si la
    // más próxima no es la mejor conectada).
    const expandirCaminata = (desde, infoDesde) => {
      for (const [vid, wmin] of (routing.vecinos[desde] || [])) {
        const cand = infoDesde.arr + wmin;
        const candCaminando = infoDesde.caminando + wmin;
        const candScore = calcularScore(criterio, cand, infoDesde.trasbordos, candCaminando);
        const estV = estado.get(vid);
        if (!estV || candScore < estV.score) {
          estado.set(vid, {
            score: candScore, arr: cand, trasbordos: infoDesde.trasbordos, caminando: candCaminando, linea: "_walk_",
            leg: { tipo: "walk", origen: desde, destino: vid, salida: infoDesde.arr, llegada: cand },
            prev: infoDesde
          });
        }
      }
    };

    o.seeds.forEach(seed => {
      const andando = seed.walk ? walkMinutes(seed.walk.dist) : 0;
      const salidaMin = startMin + andando;
      const inicial = {
        score: calcularScore(criterio, salidaMin, 0, andando),
        arr: salidaMin, trasbordos: 0, caminando: andando, linea: "_origen_",
        leg: seed.walk ? { tipo: "walk_inicio", destino: seed.stopId, distMetros: seed.walk.dist, salida: startMin, llegada: salidaMin } : null,
        prev: null
      };
      const previo = estado.get(seed.stopId);
      if (previo && previo.score <= inicial.score) return;
      estado.set(seed.stopId, inicial);
      // Con un municipio entero como origen no se camina de una parada a
      // otra: ya estás, por definición, en cualquiera de ellas.
      if (o.tipo !== "municipio") expandirCaminata(seed.stopId, inicial);
    });

    for (const c of conexiones) {
      const dep = c[2] + diaOffset, arr = c[3] + diaOffset;
      const a = c[0], b = c[1], lineaSlug = c[4];
      if (dep < startMin) continue;
      if (permitidas && !permitidas.has(lineaSlug)) continue;
      const estA = estado.get(a);
      if (!estA) continue;
      const mismaLinea = estA.linea === lineaSlug;
      const buffer = (mismaLinea || estA.linea === "_origen_") ? 0 : MIN_TRASBORDO_MIN;
      if (dep < estA.arr + buffer) continue;

      const nuevoTrasbordos = (!mismaLinea && estA.linea !== "_origen_") ? estA.trasbordos + 1 : estA.trasbordos;
      const nuevoScore = calcularScore(criterio, arr, nuevoTrasbordos, estA.caminando);
      const estB = estado.get(b);
      if (!estB || nuevoScore < estB.score) {
        const info = {
          score: nuevoScore, arr, trasbordos: nuevoTrasbordos, caminando: estA.caminando, linea: lineaSlug,
          leg: { tipo: "bus", origen: a, destino: b, salida: dep, llegada: arr, lineaSlug },
          prev: estA
        };
        estado.set(b, info);
        expandirCaminata(b, info);
      }
    }

    // Con destino "municipio" vale cualquiera de sus paradas: gana la que
    // mejor puntúe según el criterio elegido.
    let estadoDestino = null, destinoStopId = null;
    de.stopIds.forEach(id => {
      const est = estado.get(id);
      if (!est) return;
      if (!estadoDestino || est.score < estadoDestino.score) { estadoDestino = est; destinoStopId = id; }
    });
    if (!estadoDestino) continue;
    // Llegar al destino sin haberse subido a nada solo tiene sentido si
    // el destino ES el origen; si no, es que el buscador no ha encontrado
    // ninguna combinación de autobuses.
    if (!estadoDestino.leg && !o.stopIds.has(destinoStopId)) continue;

    const seedDestino = de.seeds.find(s => s.stopId === destinoStopId);
    const walkFinal = seedDestino ? seedDestino.walk : null;

    const crudos = [];
    let cur = estadoDestino;
    while (cur && cur.leg) {
      crudos.push(cur.leg);
      cur = cur.prev;
    }
    crudos.reverse();

    // Fusiona tramos de bus consecutivos de la misma línea en un único
    // tramo de viaje (guardando la secuencia de paradas intermedias para
    // poder dibujarlas), y calcula cuánto se espera en cada trasbordo:
    // como las horas ya son reales de principio a fin, la espera es
    // sencillamente la diferencia entre horas reales.
    const legs = [];
    let totalCaminandoMin = 0;
    crudos.forEach(leg => {
      if (leg.tipo === "walk_inicio" || leg.tipo === "walk") {
        legs.push({ ...leg });
        totalCaminandoMin += leg.llegada - leg.salida;
      } else if (leg.tipo === "bus") {
        const anterior = legs[legs.length - 1];
        if (anterior && anterior.tipo === "bus" && anterior.lineaSlug === leg.lineaSlug && leg.llegada >= anterior.llegada) {
          anterior.destino = leg.destino;
          anterior.llegada = leg.llegada;
          anterior.paradasIntermedias = (anterior.paradasIntermedias || 0) + 1;
          anterior.paradasRuta.push(leg.destino);
        } else {
          const previa = legs[legs.length - 1];
          const esperaMin = previa ? Math.max(0, leg.salida - previa.llegada) : 0;
          legs.push({
            tipo: "bus", origen: leg.origen, destino: leg.destino, salida: leg.salida, llegada: leg.llegada,
            lineaSlug: leg.lineaSlug, paradasIntermedias: 0, paradasRuta: [leg.origen, leg.destino], esperaMin
          });
        }
      }
    });

    const primerBus = legs.find(l => l.tipo === "bus");
    const origenStopId = primerBus ? primerBus.origen : destinoStopId;
    let tFinal = legs.length ? legs[legs.length - 1].llegada : estadoDestino.arr;
    if (walkFinal) {
      const wmin = walkMinutes(walkFinal.dist);
      legs.push({ tipo: "walk_fin", origen: destinoStopId, salida: tFinal, llegada: tFinal + wmin, distMetros: walkFinal.dist });
      tFinal += wmin;
      totalCaminandoMin += wmin;
    }

    const diasSalida = Math.floor(tFinal / 1440);
    const llegadaMin = tFinal - diasSalida * 1440;
    const numTrasbordos = Math.max(0, legs.filter(l => l.tipo === "bus").length - 1);
    const lineas = legs.filter(l => l.tipo === "bus").map(l => l.lineaSlug);
    return {
      legs, llegadaMin, diasSalida, origenStopId, destinoStopId,
      totalCaminandoMin, numTrasbordos, criterio, lineas,
      salidaMin: primerBus ? primerBus.salida : startMin
    };
  }
  return null;
}

/* ------------------------------------------------------------------ */
/* Opciones disponibles (nivel "línea" del grafo tripartito)            */
/* ------------------------------------------------------------------ */
/** Paradas a las que puedes llegar con una línea subiéndote en alguna de
 * `desde`. Respeta el orden del recorrido: que una línea pase por A y
 * por B no significa que te lleve de A a B (en el sentido contrario, no
 * te sirve). */
function alcanceDeLinea(slug, desde) {
  const nodo = GRAFO.lineas.get(slug);
  const alcanzables = new Set();
  if (!nodo) return alcanzables;
  nodo.recorridos.forEach(r => {
    let subido = false;
    r.paradas.forEach(id => {
      if (!subido) { if (desde.has(id)) subido = true; return; }
      alcanzables.add(id);
    });
  });
  return alcanzables;
}

/** El mismo conjunto de paradas más las que están a un paseo. Los
 * trasbordos reales rara vez son en la misma parada: llegas a Plaza de
 * Armas y sales del Prado. Sin esto, la búsqueda de combinaciones daba
 * por imposibles trayectos que se hacen todos los días. */
function expandirAPie(stopIds, routing) {
  const out = new Set(stopIds);
  stopIds.forEach(id => (routing.vecinos[id] || []).forEach(([vid]) => out.add(vid)));
  return out;
}

function lineasQuePasanPor(stopIds) {
  const out = new Set();
  stopIds.forEach(id => {
    const nodo = GRAFO.paradas.get(id);
    if (nodo) nodo.lineas.forEach(slug => out.add(slug));
  });
  return out;
}

const MAX_OPCIONES = 8;

/** Combinaciones de líneas que llevan del origen al destino, recorriendo
 * el grafo por su nivel de líneas: primero las directas (cero
 * trasbordos) y, si hacen falta más, las de un trasbordo. Esto es lo que
 * se ofrece como "opciones disponibles"; poner horas reales a cada una
 * es después trabajo del Connection Scan.
 *
 * No se enumeran combinaciones de dos trasbordos o más: son cientos y
 * ninguna es "la opción que uno elegiría a mano". Cuando no hay nada con
 * uno o cero, se deja que el buscador general encuentre lo que haya. */
function combinacionesDeLineas(origenIds, destinoIds, routing) {
  const salida = expandirAPie(origenIds, routing);
  const salen = lineasQuePasanPor(salida);
  const directas = [];
  const alcances = new Map();
  salen.forEach(slug => {
    const alcance = alcanceDeLinea(slug, salida);
    alcances.set(slug, alcance);
    for (const id of destinoIds) {
      if (alcance.has(id)) { directas.push([slug]); return; }
    }
  });
  if (directas.length >= 4) return directas.slice(0, MAX_OPCIONES);

  const conTrasbordo = [];
  salen.forEach(slug1 => {
    const bruto = alcances.get(slug1);
    if (!bruto || !bruto.size) return;
    const alcance1 = expandirAPie(bruto, routing);
    lineasQuePasanPor(alcance1).forEach(slug2 => {
      if (slug2 === slug1) return;
      const nodo2 = GRAFO.lineas.get(slug2);
      if (!nodo2) return;
      let enlaces = 0;
      alcance1.forEach(id => { if (nodo2.paradas.has(id)) enlaces++; });
      if (!enlaces) return;
      const alcance2 = alcanceDeLinea(slug2, alcance1);
      for (const id of destinoIds) {
        if (alcance2.has(id)) { conTrasbordo.push({ lineas: [slug1, slug2], enlaces }); return; }
      }
    });
  });
  // Entre las de un trasbordo se prefieren las que comparten más paradas
  // de enlace: cuantos más sitios donde cambiar, más probable es que
  // haya un enlace con espera razonable.
  conTrasbordo.sort((a, b) => b.enlaces - a.enlaces);
  return directas.concat(conTrasbordo.map(c => c.lineas)).slice(0, MAX_OPCIONES);
}

/** Las opciones que se enseñan: cada combinación de líneas con su
 * itinerario real (horas, paradas y esperas), ordenadas SIEMPRE por
 * número de trasbordos primero — que es el criterio por defecto de la
 * app — y por hora de llegada dentro de cada grupo.
 *
 * Se añade además la mejor ruta sin restringir líneas, por si el grafo
 * no daba ninguna combinación corta (dos trasbordos o más). */
function calcularOpcionesRuta(appData, routing, origin, destino, salida, criterio) {
  const o = resolverExtremo(appData, origin);
  const de = resolverExtremo(appData, destino);
  if (!o || !de) return [];

  const opciones = [];
  const vistas = new Set();
  const agregar = res => {
    if (!res) return;
    const clave = res.lineas.join(">") + "@" + res.salidaMin;
    if (vistas.has(clave)) return;
    vistas.add(clave);
    opciones.push(res);
  };

  combinacionesDeLineas(o.stopIds, de.stopIds, routing).forEach(lineas => {
    agregar(computeRoute(appData, routing, origin, destino, salida, criterio, { lineasPermitidas: new Set(lineas) }));
  });
  agregar(computeRoute(appData, routing, origin, destino, salida, criterio));
  if (criterio !== "tiempo") agregar(computeRoute(appData, routing, origin, destino, salida, "tiempo"));

  opciones.sort((a, b) => {
    if (a.numTrasbordos !== b.numTrasbordos) return a.numTrasbordos - b.numTrasbordos;
    const av = a.diasSalida * 1440 + a.llegadaMin;
    const bv = b.diasSalida * 1440 + b.llegadaMin;
    return av - bv;
  });
  // Una alternativa solo merece enseñarse si aporta algo. Entre las que
  // tienen el mismo número de trasbordos se enseñan todas (son sitios y
  // horas distintos, y eso lo decide la persona), pero una con MÁS
  // trasbordos solo entra si además llega antes que todo lo anterior: si
  // no, es peor por los dos lados y solo estorba.
  const buenas = [];
  let mejorLlegada = Infinity;
  let trasbordosGrupo = -1;
  opciones.forEach(o => {
    const llegada = o.diasSalida * 1440 + o.llegadaMin;
    if (o.numTrasbordos !== trasbordosGrupo) {
      if (trasbordosGrupo >= 0 && llegada >= mejorLlegada) return;
      trasbordosGrupo = o.numTrasbordos;
    }
    buenas.push(o);
    mejorLlegada = Math.min(mejorLlegada, llegada);
  });
  return buenas.slice(0, MAX_OPCIONES);
}

function fmtHoraAbs(minAbs) {
  const dias = Math.floor(minAbs / 1440);
  const m = ((minAbs % 1440) + 1440) % 1440;
  const hh = String(Math.floor(m / 60)).padStart(2, "0");
  const mm = String(m % 60).padStart(2, "0");
  return `${hh}:${mm}` + (dias > 0 ? ` (+${dias}d)` : "");
}

/** El buscador de origen/destino admite las dos cosas: una parada
 * concreta o un municipio entero. Los municipios van marcados para que
 * se distingan de un vistazo y para poder reconocerlos al escribirlos. */
const PREFIJO_MUNICIPIO = "Municipio: ";

function buildStopsDatalist() {
  if (PARADA_POR_NOMBRE) return;
  const dl = document.getElementById("listaParadas");
  const entradas = Object.entries(APP.data.paradas).map(([id, p]) => ({ id, nombre: p.nombre }));
  entradas.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  const municipios = GRAFO.lista.map(m => PREFIJO_MUNICIPIO + m);
  dl.innerHTML = municipios.concat(entradas.map(n => n.nombre))
    .map(n => `<option value="${escapeHtml(n)}">`).join("");
  PARADA_POR_NOMBRE = {};
  entradas.forEach(n => { if (!(n.nombre in PARADA_POR_NOMBRE)) PARADA_POR_NOMBRE[n.nombre] = n.id; });
}

/** Interpreta lo que se ha escrito en el buscador: municipio, parada
 * exacta, o nada reconocible. */
function interpretarBusquedaExtremo(texto) {
  const limpio = String(texto || "").trim();
  if (!limpio) return null;
  if (limpio.startsWith(PREFIJO_MUNICIPIO)) {
    const nombre = limpio.slice(PREFIJO_MUNICIPIO.length).trim();
    return GRAFO.municipios.has(nombre) ? { type: "municipio", nombre } : null;
  }
  const id = PARADA_POR_NOMBRE && PARADA_POR_NOMBRE[limpio];
  if (id) return { type: "stop", id };
  const municipio = GRAFO.lista.find(m => normalize(m) === normalize(limpio));
  return municipio ? { type: "municipio", nombre: municipio } : null;
}

/** Texto que se pone en el input para un extremo ya elegido. */
function textoDeExtremo(punto) {
  if (!punto) return "";
  if (punto.type === "stop") return APP.data.paradas[punto.id].nombre;
  if (punto.type === "municipio") return PREFIJO_MUNICIPIO + punto.nombre;
  return "";
}

/** Selector de municipio a pantalla completa, para quien prefiera
 * elegir de una lista antes que escribir. */
function abrirSelectorMunicipio(which) {
  openModal(container => {
    container.innerHTML = `
      <h3 class="detail-title">${which === "origen" ? "Salgo de" : "Voy a"}</h3>
      <div class="detail-meta">Elige un municipio: valdrá cualquiera de sus paradas.</div>
      <div class="field" style="margin-top:10px;">
        <input type="text" class="input" id="filtroMunicipioModal" placeholder="Buscar municipio…">
      </div>
      <div id="listaMunicipioModal"></div>`;
    const lista = container.querySelector("#listaMunicipioModal");
    const pintar = () => {
      const texto = normalize(container.querySelector("#filtroMunicipioModal").value.trim());
      lista.innerHTML = "";
      // Quien escribe "Sevilla" quiere Sevilla, no "Nueva Sevilla
      // (Castilleja de la Cuesta)": primero lo que empieza por lo escrito.
      GRAFO.lista
        .filter(m => !texto || normalize(m).includes(texto))
        .sort((a, b) => {
          if (!texto) return 0;
          const pa = normalize(a).startsWith(texto) ? 0 : 1;
          const pb = normalize(b).startsWith(texto) ? 0 : 1;
          return pa - pb || a.localeCompare(b, "es");
        })
        .forEach(m => {
        const nodo = GRAFO.municipios.get(m);
        const row = document.createElement("div");
        row.className = "linea-row";
        row.innerHTML = `<span class="linea-row-name">${escapeHtml(m)}
          <span class="linea-row-muni">${nodo.paradas.length} paradas · ${nodo.lineas.size} línea${nodo.lineas.size === 1 ? "" : "s"}</span>
        </span>`;
        row.addEventListener("click", () => {
          setEndpoint(which, { type: "municipio", nombre: m });
          closeModal();
        });
        lista.appendChild(row);
      });
    };
    container.querySelector("#filtroMunicipioModal").addEventListener("input", pintar);
    pintar();
  });
}

function initRouteMap() {
  if (CURRENT_ROUTE_MAP) return;
  const map = L.map("routeMap", { preferCanvas: true, scrollWheelZoom: false });
  CURRENT_ROUTE_MAP = map;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  // El mapa se abre entero, o sea de lejos, o sea agrupado por municipio:
  // que es justo la escala a la que se piensa un viaje metropolitano.
  ROUTE_CAPA = crearCapaRed(map, {
    onParada: onRouteMapStopClick,
    onGrupo: onRouteMapGrupoClick
  });
  ROUTE_MARKERS = ROUTE_CAPA.marcadores;
  if (ROUTE_CAPA.limites.length) map.fitBounds(ROUTE_CAPA.limites, { padding: [16, 16] });
  else map.setView([37.389, -5.984], 10);
  ROUTE_CAPA.refrescar();
  map.on("click", e => onRouteMapClick(e.latlng));
}

/** Tocar un triángulo con el modo "marcar en el mapa" armado fija ese
 * municipio como extremo de la ruta sin más rodeos; si lleva varios
 * dentro no hay nada que adivinar, así que se abre el menú para elegir. */
function onRouteMapGrupoClick(grupo, marca) {
  if (ROUTE_ARM_MODE && grupo.municipios.length === 1) {
    setEndpoint(ROUTE_ARM_MODE, { type: "municipio", nombre: grupo.municipios[0] });
    disarmClickMode();
    return;
  }
  abrirMenuGrupo(CURRENT_ROUTE_MAP, grupo, marca, ROUTE_CAPA, "ruta");
}

function onRouteMapStopClick(id) {
  if (ROUTE_ARM_MODE) {
    setEndpoint(ROUTE_ARM_MODE, { type: "stop", id });
    disarmClickMode();
    return;
  }
  openStopPopup(id);
}

/** Construye el contenido del popup de una parada: nombre, próximos
 * autobuses (agrupados por línea, cualquier recorrido) y botones para
 * marcarla/desmarcarla como origen o destino de la ruta. */
function buildStopPopupContent(id) {
  const p = APP.data.paradas[id];
  const wrap = document.createElement("div");
  wrap.className = "stop-popup";

  const titulo = document.createElement("div");
  titulo.className = "stop-popup-title";
  titulo.style.display = "flex";
  titulo.style.justifyContent = "space-between";
  titulo.style.alignItems = "baseline";
  titulo.style.gap = "8px";
  const tituloTexto = document.createElement("span");
  tituloTexto.textContent = p.nombre;
  titulo.appendChild(tituloTexto);
  const btnFav = document.createElement("button");
  btnFav.type = "button";
  btnFav.className = "btn-fav";
  pintarEstrella(btnFav, esFavoritoParada(id));
  btnFav.title = "Marcar/quitar de favoritos";
  btnFav.addEventListener("click", e => {
    e.stopPropagation();
    toggleFavoritoParada(id);
    pintarEstrella(btnFav, esFavoritoParada(id));
  });
  titulo.appendChild(btnFav);
  wrap.appendChild(titulo);

  const municipio = municipioDeParada(id);
  if (municipio) {
    const meta = document.createElement("div");
    meta.className = "stop-popup-sub";
    meta.textContent = municipio;
    wrap.appendChild(meta);
  }

  const grupos = sentidosEnParada(id, null);
  const lista = document.createElement("div");
  lista.className = "stop-popup-proximos";
  if (!grupos.length) {
    lista.innerHTML = `<span class="stop-popup-sub">${(p.servicios || []).length
      ? "Aquí terminan los recorridos que pasan: no salen autobuses."
      : "Sin datos de horario para esta parada."}</span>`;
  } else {
    grupos.slice(0, 4).forEach(g => {
      const fmt = formatDeparture(g.dep);
      const row = document.createElement("div");
      row.className = "stop-popup-line";
      row.style.cursor = "pointer";
      row.innerHTML = `<b>${escapeHtml(codigoLinea(g.lineaTitulo))} hacia ${escapeHtml(g.etiqueta)}</b><span class="stop-popup-time">${fmt.main}<span class="stop-popup-sub"> ${escapeHtml(fmt.sub)}</span></span>`;
      row.addEventListener("click", () => {
        if (CURRENT_ROUTE_MAP) CURRENT_ROUTE_MAP.closePopup();
        openLineModal(g.lineaSlug, id);
      });
      lista.appendChild(row);
    });
    if (grupos.length > 4) {
      const more = document.createElement("div");
      more.className = "stop-popup-sub";
      more.textContent = `+${grupos.length - 4} salida(s) más por esta parada`;
      lista.appendChild(more);
    }
  }
  wrap.appendChild(lista);

  if (grupos.length > 3) {
    const btnTodas = document.createElement("button");
    btnTodas.type = "button";
    btnTodas.className = "btn-chip";
    btnTodas.style.marginBottom = "8px";
    btnTodas.innerHTML = icono("lista") + `Ver las ${grupos.length} salidas`;
    btnTodas.addEventListener("click", () => {
      if (CURRENT_ROUTE_MAP) CURRENT_ROUTE_MAP.closePopup();
      openModal(container => buildStopScheduleModalContent(container, id));
    });
    wrap.appendChild(btnTodas);
  }

  const acciones = document.createElement("div");
  acciones.className = "stop-popup-actions";
  const esOrigen = ROUTE_ORIGIN && ROUTE_ORIGIN.type === "stop" && ROUTE_ORIGIN.id === id;
  const esDestino = ROUTE_DESTINO && ROUTE_DESTINO.type === "stop" && ROUTE_DESTINO.id === id;

  const btnOrigen = document.createElement("button");
  btnOrigen.type = "button";
  btnOrigen.className = "btn-chip" + (esOrigen ? " armed" : "");
  btnOrigen.innerHTML = esOrigen ? icono("cerrar") + "Quitar origen" : icono("pin") + "Marcar origen";
  btnOrigen.addEventListener("click", () => {
    if (esOrigen) clearEndpoint("origen"); else setEndpoint("origen", { type: "stop", id });
    CURRENT_ROUTE_MAP.closePopup();
  });
  acciones.appendChild(btnOrigen);

  const btnDestino = document.createElement("button");
  btnDestino.type = "button";
  btnDestino.className = "btn-chip" + (esDestino ? " armed" : "");
  btnDestino.innerHTML = esDestino ? icono("cerrar") + "Quitar destino" : icono("bandera") + "Marcar destino";
  btnDestino.addEventListener("click", () => {
    if (esDestino) clearEndpoint("destino"); else setEndpoint("destino", { type: "stop", id });
    CURRENT_ROUTE_MAP.closePopup();
  });
  acciones.appendChild(btnDestino);

  wrap.appendChild(acciones);
  return wrap;
}

function openStopPopup(id) {
  if (ROUTE_CAPA) ROUTE_CAPA.asegurarVisible(id);
  const marker = ROUTE_MARKERS[id];
  if (!marker) return;
  marker.bindPopup(buildStopPopupContent(id), { minWidth: 230 }).openPopup();
}

/** Quita el origen o destino actual (tanto si era una parada como un
 * punto marcado a mano) y su marcador del mapa. */
function clearEndpoint(which) {
  if (which === "origen") {
    ROUTE_ORIGIN = null;
    document.getElementById("origenInput").value = "";
    document.getElementById("origenStatus").textContent = "";
  } else {
    ROUTE_DESTINO = null;
    document.getElementById("destinoInput").value = "";
    document.getElementById("destinoStatus").textContent = "";
  }
  quitarMarcadorExtremo(which);
}

function onRouteMapClick(latlng) {
  if (!ROUTE_ARM_MODE) return;
  setEndpoint(ROUTE_ARM_MODE, { type: "point", lat: latlng.lat, lng: latlng.lng });
  disarmClickMode();
}

function armClickMode(which) {
  ROUTE_ARM_MODE = which;
  document.getElementById("origenPin").classList.toggle("armed", which === "origen");
  document.getElementById("destinoPin").classList.toggle("armed", which === "destino");
  const hint = document.getElementById("rutaClickHint");
  hint.style.display = "block";
  hint.textContent = `Haz clic en el mapa (o en una parada) para marcar el ${which === "origen" ? "origen" : "destino"}.`;
}

function disarmClickMode() {
  ROUTE_ARM_MODE = null;
  document.getElementById("origenPin").classList.remove("armed");
  document.getElementById("destinoPin").classList.remove("armed");
  document.getElementById("rutaClickHint").style.display = "none";
}

function describeEndpoint(point) {
  if (point.type === "stop") return `Parada: ${APP.data.paradas[point.id].nombre}`;
  if (point.type === "municipio") {
    const nodo = GRAFO.municipios.get(point.nombre);
    return `Municipio: ${point.nombre} · cualquiera de sus ${nodo ? nodo.paradas.length : 0} paradas`;
  }
  const near = nearestStop(APP.data, point.lat, point.lng);
  return near ? `Punto marcado · parada más cercana: ${APP.data.paradas[near.id].nombre} (${formatDistance(near.dist)})` : "Punto marcado";
}

function placeEndpointMarker(which, point) {
  if (!CURRENT_ROUTE_MAP) return;
  quitarMarcadorExtremo(which);

  // Un municipio no es un sitio, es una zona entera: no lleva chincheta.
  // Se señala con el aro de su PROPIO círculo, más grueso y de otro color,
  // en vez de dibujarle un anillo encima.
  if (point.type === "municipio") {
    if (ROUTE_CAPA) ROUTE_CAPA.marcarExtremo(which, point.nombre);
    return;
  }

  const latlng = coordenadasDeExtremo(APP.data, point);
  if (!latlng) return;
  const icon = L.divIcon({
    className: "",
    html: `<span class="marca-extremo ${which}">${icono(which === "origen" ? "pin" : "bandera")}</span>`,
    iconSize: [26, 26], iconAnchor: [13, 24]
  });
  const marca = L.marker(latlng, { icon, zIndexOffset: 900 }).addTo(CURRENT_ROUTE_MAP);
  if (which === "origen") ROUTE_ORIGIN_MARKER = marca;
  else ROUTE_DESTINO_MARKER = marca;
}

/** Borra la señal del extremo, sea la chincheta o el aro del municipio. */
function quitarMarcadorExtremo(which) {
  if (ROUTE_CAPA) ROUTE_CAPA.marcarExtremo(which, null);
  if (!CURRENT_ROUTE_MAP) return;
  if (which === "origen") {
    if (ROUTE_ORIGIN_MARKER) { CURRENT_ROUTE_MAP.removeLayer(ROUTE_ORIGIN_MARKER); ROUTE_ORIGIN_MARKER = null; }
  } else if (ROUTE_DESTINO_MARKER) {
    CURRENT_ROUTE_MAP.removeLayer(ROUTE_DESTINO_MARKER); ROUTE_DESTINO_MARKER = null;
  }
}

function setEndpoint(which, point) {
  const label = describeEndpoint(point);
  if (which === "origen") {
    ROUTE_ORIGIN = point;
    document.getElementById("origenInput").value = textoDeExtremo(point);
    document.getElementById("origenStatus").textContent = label;
  } else {
    ROUTE_DESTINO = point;
    document.getElementById("destinoInput").value = textoDeExtremo(point);
    document.getElementById("destinoStatus").textContent = label;
  }
  placeEndpointMarker(which, point);
}

function wireEndpointInput(inputId, which) {
  document.getElementById(inputId).addEventListener("change", e => {
    const texto = e.target.value.trim();
    if (!texto) return;
    const punto = interpretarBusquedaExtremo(texto);
    if (punto) {
      setEndpoint(which, punto);
    } else {
      document.getElementById(which + "Status").textContent =
        "No se reconoce; elige una parada o un municipio de la lista.";
    }
  });
}

function wireGeoButton(btnId, which) {
  document.getElementById(btnId).addEventListener("click", () => {
    const statusEl = document.getElementById(which + "Status");
    if (!navigator.geolocation) {
      statusEl.textContent = "Tu navegador no soporta geolocalización.";
      return;
    }
    statusEl.textContent = "Obteniendo tu posición…";
    navigator.geolocation.getCurrentPosition(
      pos => setEndpoint(which, { type: "point", lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => { statusEl.textContent = "No se pudo obtener tu posición: " + err.message; },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

function clearRoutePathLayers() {
  if (!CURRENT_ROUTE_MAP) return;
  ROUTE_PATH_LAYERS.forEach(l => CURRENT_ROUTE_MAP.removeLayer(l));
  ROUTE_PATH_LAYERS = [];
}

function drawRouteOnMap(res) {
  if (!CURRENT_ROUTE_MAP) return;
  clearRoutePathLayers();
  const bounds = [];
  res.legs.forEach(leg => {
    if (leg.tipo === "bus") {
      // Sigue TODAS las paradas intermedias del tramo (no solo el punto
      // de subida y el de bajada), para que se vea el recorrido real del
      // autobús y no un atajo en línea recta que se salta paradas.
      const paradas = leg.paradasRuta && leg.paradasRuta.length >= 2 ? leg.paradasRuta : [leg.origen, leg.destino];
      const puntos = paradas
        .map(id => APP.data.paradas[id])
        .filter(p => p && p.lat != null)
        .map(p => [p.lat, p.lng]);
      if (puntos.length < 2) return;
      const line = L.polyline(puntos, { color: colorTema("brand"), weight: 5, opacity: 0.95 }).addTo(CURRENT_ROUTE_MAP);
      ROUTE_PATH_LAYERS.push(line);
      puntos.forEach(pt => bounds.push(pt));
      return;
    }

    let latlngA = null, latlngB = null;
    if (leg.tipo === "walk") {
      const a = APP.data.paradas[leg.origen], b = APP.data.paradas[leg.destino];
      if (a && a.lat != null) latlngA = [a.lat, a.lng];
      if (b && b.lat != null) latlngB = [b.lat, b.lng];
    } else if (leg.tipo === "walk_inicio") {
      latlngA = ROUTE_ORIGIN.type === "point" ? [ROUTE_ORIGIN.lat, ROUTE_ORIGIN.lng] : null;
      const b = APP.data.paradas[leg.destino];
      if (b && b.lat != null) latlngB = [b.lat, b.lng];
    } else if (leg.tipo === "walk_fin") {
      const a = APP.data.paradas[leg.origen];
      if (a && a.lat != null) latlngA = [a.lat, a.lng];
      latlngB = ROUTE_DESTINO.type === "point" ? [ROUTE_DESTINO.lat, ROUTE_DESTINO.lng] : null;
    }
    if (!latlngA || !latlngB) return;
    const line = L.polyline([latlngA, latlngB], {
      color: colorTema("coral"), weight: 3, opacity: 0.9, dashArray: "2 8"
    }).addTo(CURRENT_ROUTE_MAP);
    ROUTE_PATH_LAYERS.push(line);
    bounds.push(latlngA, latlngB);
  });
  if (bounds.length) CURRENT_ROUTE_MAP.fitBounds(bounds, { padding: [30, 30] });
}

/** Etiqueta corta de una opción: las líneas que se cogen y cuántos
 * trasbordos salen. Es lo que decide de un vistazo, más que la hora. */
function etiquetaOpcion(res) {
  const codigos = res.lineas.map(slug => {
    const linea = APP.data.lineas.find(l => l.slug === slug);
    return codigoLinea(linea ? linea.titulo : slug);
  }).filter((c, i, todos) => i === 0 || c !== todos[i - 1]); // dos buses seguidos
                                                            // de la misma línea se
                                                            // nombran una vez
  const cuenta = res.numTrasbordos === 0
    ? "directo"
    : `${res.numTrasbordos} trasbordo${res.numTrasbordos === 1 ? "" : "s"}`;
  return { cuenta, codigos: codigos.length ? codigos : ["a pie"] };
}

/** Las opciones disponibles, en fila y ordenadas por trasbordos: la
 * primera (la de menos trasbordos) es la que se muestra por defecto. */
function renderOpcionesRuta(contenedor, opciones, salidaDate, directo) {
  contenedor.innerHTML = "";
  if (opciones.length < 2) return;
  const caja = document.createElement("div");
  caja.className = "card";
  caja.innerHTML = '<div class="selector-titulo">Opciones disponibles</div>';
  const fila = document.createElement("div");
  fila.className = "opciones-row";
  opciones.forEach((op, i) => {
    const { cuenta, codigos } = etiquetaOpcion(op);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opcion-pill" + (i === RUTA_OPCION_ACTIVA ? " active" : "");
    // Una opción se elige por las tres cosas a la vez: qué líneas coges,
    // cuándo sales y cuándo llegas. Con solo la hora de llegada no se
    // pueden comparar: la que llega antes puede salir mucho después.
    btn.innerHTML = `<span class="opcion-lineas">${codigos.map(c => `<span class="linea-badge">${escapeHtml(c)}</span>`).join('<span class="opcion-mas">+</span>')}</span>
      <span class="opcion-meta">${escapeHtml(fmtHoraAbs(op.salidaMin))} → ${escapeHtml(fmtHoraAbs(op.diasSalida * 1440 + op.llegadaMin))} · ${escapeHtml(cuenta)}</span>`;
    btn.addEventListener("click", () => {
      RUTA_OPCION_ACTIVA = i;
      renderRutaResultado(opciones[i], salidaDate, directo, opciones);
    });
    fila.appendChild(btn);
  });
  caja.appendChild(fila);
  contenedor.appendChild(caja);
}

/** Hacia dónde va el autobús en el tramo que se toma: el municipio donde
 * te bajas, o el nombre de la parada si no cambias de municipio. Es lo
 * que hace falta leer en el poste para saber si ese bus es el tuyo. */
function haciaDondeVaTramo(leg) {
  const muniOrigen = municipioDeParada(leg.origen);
  const muniDestino = municipioDeParada(leg.destino);
  if (muniDestino && muniDestino !== muniOrigen) return muniDestino;
  const p = APP.data.paradas[leg.destino];
  return p ? p.nombre : leg.destino;
}

/** Convierte los tramos del cálculo en la secuencia que se dibuja: un
 * "hito" por sitio donde pasa algo (subes, bajas, esperas) y un "tramo"
 * por lo que haces entre hito e hito.
 *
 * La gracia está en fundir dos hitos seguidos del mismo sitio: cuando
 * haces trasbordo sin moverte de parada, no son dos puntos del recorrido
 * sino uno con dos horas — llegas a y sales a —, y la diferencia entre
 * ambas es la espera. Antes esa espera no se enseñaba en ningún sitio:
 * el renglón de "espera N min" solo se pintaba tras un tramo a pie, así
 * que en el caso más común (cambiar de línea en la misma parada) el dato
 * que más importa del trasbordo era justo el que faltaba. */
function construirFilasItinerario(res) {
  const filas = [];
  const ultimoHito = () => {
    const ultimo = filas[filas.length - 1];
    return ultimo && ultimo.tipo === "hito" ? ultimo : null;
  };
  const hito = (clave, campos) => {
    const abierto = ultimoHito();
    if (abierto && abierto.clave === clave) { Object.assign(abierto, campos); return; }
    filas.push({ tipo: "hito", clave, ...campos });
  };

  res.legs.forEach(leg => {
    if (leg.tipo === "bus") {
      hito(leg.origen, { paradaId: leg.origen, salida: leg.salida });
      filas.push({ tipo: "tramo", clase: "bus", leg });
      hito(leg.destino, { paradaId: leg.destino, llegada: leg.llegada });
    } else if (leg.tipo === "walk_inicio") {
      hito("_partida_", { partida: true, salida: leg.salida });
      filas.push({ tipo: "tramo", clase: "andando", leg });
      hito(leg.destino, { paradaId: leg.destino, llegada: leg.llegada });
    } else if (leg.tipo === "walk") {
      hito(leg.origen, { paradaId: leg.origen, llegada: leg.salida });
      filas.push({ tipo: "tramo", clase: "andando", leg });
      hito(leg.destino, { paradaId: leg.destino, llegada: leg.llegada });
    } else if (leg.tipo === "walk_fin") {
      hito(leg.origen, { paradaId: leg.origen, llegada: leg.salida });
      filas.push({ tipo: "tramo", clase: "andando", leg });
      hito("_destino_", { destinoFinal: true, llegada: leg.llegada });
    }
  });
  return filas;
}

function itinerarioHtml(res) {
  const filas = construirFilasItinerario(res);
  return filas.map((fila, i) => {
    const clases = ["itin-fila"];
    if (i === 0) clases.push("primera");
    if (i === filas.length - 1) clases.push("ultima");

    if (fila.tipo === "hito") {
      clases.push("extremo");
      const p = fila.paradaId ? APP.data.paradas[fila.paradaId] : null;
      const nombre = fila.partida ? "Tu punto de partida"
        : fila.destinoFinal ? "Tu destino"
        : (p ? p.nombre : fila.paradaId);
      const municipio = fila.paradaId ? municipioDeParada(fila.paradaId) : null;
      const esperaMin = (fila.llegada != null && fila.salida != null) ? fila.salida - fila.llegada : 0;
      const horas = fila.llegada != null && fila.salida != null && esperaMin > 0
        ? `${fmtHoraAbs(fila.llegada)}<span class="segunda">${fmtHoraAbs(fila.salida)}</span>`
        : fmtHoraAbs(fila.salida != null ? fila.salida : fila.llegada);
      return `<div class="${clases.join(" ")}">
        <div class="itin-hora">${horas}</div>
        <div class="itin-espina"><div class="itin-punto"></div></div>
        <div class="itin-hito">
          <div class="itin-parada${fila.paradaId ? " pulsable" : ""}"${fila.paradaId ? ` data-stop-id="${escapeHtml(fila.paradaId)}"` : ""}>${escapeHtml(nombre)}</div>
          ${municipio ? `<div class="itin-muni">${escapeHtml(municipio)}</div>` : ""}
          ${esperaMin > 0 ? `<div class="itin-espera">${icono("reloj")}${esperaMin} min de espera</div>` : ""}
        </div>
      </div>`;
    }

    const leg = fila.leg;
    if (fila.clase === "andando") {
      clases.push("andando");
      const distM = leg.distMetros != null
        ? Math.round(leg.distMetros)
        : (APP.data.paradas[leg.origen] && APP.data.paradas[leg.destino]
            ? Math.round(haversine(APP.data.paradas[leg.origen].lat, APP.data.paradas[leg.origen].lng,
                                   APP.data.paradas[leg.destino].lat, APP.data.paradas[leg.destino].lng))
            : null);
      return `<div class="${clases.join(" ")}">
        <div class="itin-hora"></div>
        <div class="itin-espina"></div>
        <div class="itin-tramo"><div class="itin-andando">${icono("andar")}Camina${distM != null ? ` ${distM} m` : ""} · ${leg.llegada - leg.salida} min</div></div>
      </div>`;
    }

    const linea = APP.data.lineas.find(l => l.slug === leg.lineaSlug);
    const titulo = linea ? linea.titulo : leg.lineaSlug;
    const intermedias = (leg.paradasRuta || []).slice(1, -1);
    const nParadas = (leg.paradasRuta || [leg.origen, leg.destino]).length - 1;
    const listaHtml = intermedias.length
      ? `<ul class="itin-intermedias" hidden>${intermedias.map(id => {
          const p = APP.data.paradas[id];
          return `<li data-stop-id="${escapeHtml(id)}">${escapeHtml(p ? p.nombre : id)}</li>`;
        }).join("")}</ul>`
      : "";
    return `<div class="${clases.join(" ")}">
      <div class="itin-hora"></div>
      <div class="itin-espina"></div>
      <div class="itin-tramo">
        <button type="button" class="itin-tramo-cab" data-linea="${escapeHtml(leg.lineaSlug)}" data-stop="${escapeHtml(leg.origen)}">
          <span class="linea-badge">${escapeHtml(codigoLinea(titulo))}</span>
          <span class="itin-hacia">hacia ${escapeHtml(haciaDondeVaTramo(leg))}</span>
        </button>
        <button type="button" class="itin-tramo-pie"${intermedias.length ? ' aria-expanded="false"' : ""}>
          ${nParadas} parada${nParadas === 1 ? "" : "s"} · ${leg.llegada - leg.salida} min${intermedias.length ? ' ' + icono("abajo") : ""}
        </button>
        ${listaHtml}
      </div>
    </div>`;
  }).join("");
}

function renderRutaResultado(res, salidaDate, directo, opciones) {
  const box = document.getElementById("rutaResultado");
  const cajaOpciones = document.getElementById("rutaOpciones");
  const salidaMin = salidaDate.getHours() * 60 + salidaDate.getMinutes();
  if (cajaOpciones) renderOpcionesRuta(cajaOpciones, opciones || [], salidaDate, directo);

  if (!res) {
    clearRoutePathLayers();
    const avisoDirecto = directo
      ? `<p class="empty">Caminando en línea recta serían ${Math.round(directo.distMetros)} m (~${directo.minutos} min).</p>`
      : "";
    box.innerHTML = `<div class="card"><p class="empty">No se ha encontrado ninguna ruta en transporte público.</p>${avisoDirecto}</div>`;
    return;
  }

  const tFinalAbs = res.diasSalida * 1440 + res.llegadaMin;
  const fmtDur = m => { const h = Math.floor(m / 60), mm = Math.round(m % 60); return (h > 0 ? h + "h " : "") + mm + "min"; };
  const primerBus = res.legs.find(l => l.tipo === "bus");
  // La hora de salida del encabezado es la del primer renglón del
  // itinerario: si hay que caminar antes de coger nada, sales de casa
  // cuando empieza el paseo, no cuando arranca el autobús.
  const salidaRealMin = res.legs.length ? res.legs[0].salida : salidaMin;
  const esperaInicialMin = primerBus ? primerBus.salida - Math.max(salidaMin, salidaRealMin) : 0;
  const totalTransporteMin = tFinalAbs - salidaMin;

  const tags = [];
  const enCuanto = salidaRealMin - salidaMin;
  if (enCuanto > 0) tags.push(`<span class="itin-tag${enCuanto <= 10 ? " ya" : ""}">Sal en ${fmtDur(enCuanto)}</span>`);
  else tags.push(`<span class="itin-tag ya">Sal ya</span>`);
  tags.push(`<span class="itin-tag">${res.numTrasbordos} trasbordo${res.numTrasbordos === 1 ? "" : "s"}</span>`);
  if (res.totalCaminandoMin > 0) tags.push(`<span class="itin-tag">${Math.round(res.totalCaminandoMin)} min a pie</span>`);

  // Con un municipio como extremo, la parada concreta la elige el
  // buscador: hay que decir cuál, o el itinerario no se puede seguir.
  let extremosHtml = "";
  if (ROUTE_ORIGIN.type === "municipio" || ROUTE_DESTINO.type === "municipio") {
    const pO = APP.data.paradas[res.origenStopId], pD = APP.data.paradas[res.destinoStopId];
    extremosHtml = `<div class="itin-extremos">Sale de <b>${escapeHtml(pO ? pO.nombre : "?")}</b> y llega a <b>${escapeHtml(pD ? pD.nombre : "?")}</b></div>`;
  }

  let avisoCaminar = "";
  if (directo && directo.minutos < totalTransporteMin) {
    avisoCaminar = `<div class="itin-leg-warn">${icono("aviso")}<span>Ir caminando en línea recta (${Math.round(directo.distMetros)} m) tardaría solo ${fmtDur(directo.minutos)} — menos que esta ruta, que incluye ${fmtDur(esperaInicialMin)} de espera.</span></div>`;
  }

  const puedeGuardar = ROUTE_ORIGIN && ROUTE_DESTINO && ROUTE_ORIGIN.type === "stop" && ROUTE_DESTINO.type === "stop";
  const favBtnHtml = puedeGuardar
    ? `<button type="button" class="btn-chip${esFavoritoRuta(ROUTE_ORIGIN.id, ROUTE_DESTINO.id) ? " armed" : ""}" id="btnFavRuta" style="margin-top:12px;">${icono("estrella")}${esFavoritoRuta(ROUTE_ORIGIN.id, ROUTE_DESTINO.id) ? "Guardada" : "Guardar esta ruta"}</button>`
    : "";

  box.innerHTML = `
    <div class="card">
      <div class="itin-horas">
        <span>${fmtHoraAbs(salidaRealMin)}</span>
        <span class="flecha">→</span>
        <span class="llegada">${fmtHoraAbs(tFinalAbs)}</span>
      </div>
      <div class="itin-dur"><b>${fmtDur(tFinalAbs - salidaRealMin)}</b> de principio a fin${esperaInicialMin > 0 ? ` · el autobús sale ${fmtDur(esperaInicialMin)} después` : ""}</div>
      <div class="itin-tags">${tags.join("")}</div>
      ${extremosHtml}${avisoCaminar}${favBtnHtml}
    </div>
    <div class="card"><div class="itin">${itinerarioHtml(res)}</div></div>`;

  box.querySelectorAll(".itin-tramo-cab").forEach(btn => {
    btn.addEventListener("click", () => openLineModal(btn.dataset.linea, btn.dataset.stop));
  });
  box.querySelectorAll(".itin-tramo-pie[aria-expanded]").forEach(btn => {
    btn.addEventListener("click", () => {
      const lista = btn.parentNode.querySelector(".itin-intermedias");
      const abierto = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", abierto ? "false" : "true");
      if (lista) lista.hidden = abierto;
    });
  });
  box.querySelectorAll("[data-stop-id]").forEach(el => {
    el.addEventListener("click", () => openModal(container => buildStopScheduleModalContent(container, el.dataset.stopId)));
  });
  if (puedeGuardar) {
    box.querySelector("#btnFavRuta").addEventListener("click", e => {
      toggleFavoritoRuta(ROUTE_ORIGIN.id, ROUTE_DESTINO.id, res.criterio);
      const guardada = esFavoritoRuta(ROUTE_ORIGIN.id, ROUTE_DESTINO.id);
      e.currentTarget.innerHTML = icono("estrella") + (guardada ? "Guardada" : "Guardar esta ruta");
      e.currentTarget.classList.toggle("armed", guardada);
    });
  }

  drawRouteOnMap(res);
}

/** Distancia/tiempo a pie en línea recta directamente entre origen y
 * destino, sin pasar por transporte público. Sirve para avisar cuando
 * la ruta en autobús calculada (con esperas incluidas) sale más lenta
 * que ir andando directamente. */
function distanciaDirecta(appData, origin, destino) {
  // Con un municipio entero por medio no tiene sentido comparar con "ir
  // andando": no hay un punto concreto del que salir.
  if (origin.type === "municipio" || destino.type === "municipio") return null;
  const latlngA = coordenadasDeExtremo(appData, origin);
  const latlngB = coordenadasDeExtremo(appData, destino);
  if (!latlngA || !latlngB) return null;
  const distMetros = haversine(latlngA[0], latlngA[1], latlngB[0], latlngB[1]);
  return { distMetros, minutos: walkMinutes(distMetros) };
}

async function onCalcularRuta() {
  const resultBox = document.getElementById("rutaResultado");
  const cajaOpciones = document.getElementById("rutaOpciones");
  if (!ROUTE_ORIGIN || !ROUTE_DESTINO) {
    resultBox.innerHTML = '<div class="card"><p class="empty">Elige un origen y un destino primero.</p></div>';
    if (cajaOpciones) cajaOpciones.innerHTML = "";
    return;
  }
  resultBox.innerHTML = '<div class="card"><p class="empty">Calculando ruta…</p></div>';
  if (!ROUTING) {
    try {
      ROUTING = await loadRoutingData(false);
    } catch (e) {
      resultBox.innerHTML = `<div class="card"><p class="empty">No se pudo cargar el motor de rutas: ${escapeHtml(e.message)}</p></div>`;
      return;
    }
  }
  const horaInput = document.getElementById("horaSalida").value;
  const salida = horaInput ? new Date(horaInput) : new Date();
  const directo = distanciaDirecta(APP.data, ROUTE_ORIGIN, ROUTE_DESTINO);

  RUTA_OPCIONES = calcularOpcionesRuta(APP.data, ROUTING, ROUTE_ORIGIN, ROUTE_DESTINO, salida, CRITERIO);
  RUTA_OPCION_ACTIVA = 0;
  renderRutaResultado(RUTA_OPCIONES[0] || null, salida, directo, RUTA_OPCIONES);
}

function nowForDatetimeLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

function wireRuta() {
  wireEndpointInput("origenInput", "origen");

  document.getElementById("destinoMuni").addEventListener("click", () => abrirSelectorMunicipio("destino"));

/* ------------------------------------------------------------------ */
/** Hasta `limite` salidas de una parada, una por línea Y sentido,
 * poniendo SIEMPRE primero las líneas favoritas y, dentro de cada grupo,
 * las de salida más próxima.
 *
 * Se separa por sentido porque una misma línea suele pasar por la misma
 * parada en las dos direcciones, y "el próximo autobús de la M-177" no
 * significa nada si no dices hacia dónde. Dentro de cada sentido, en
 * cambio, se fusionan todos los recorridos: da igual que ese autobús
 * concreto haya salido de Torre de la Reina o de Guillena. */
function lineasEnParadaPriorizadas(paradaId, limite) {
  limite = limite || 3;
  const grupos = sentidosEnParada(paradaId, null).map(g => ({
    linea_slug: g.lineaSlug,
    linea_titulo: g.lineaTitulo,
    servicios: g.servicios,
    dep: g.dep,
    direccion: "hacia " + g.etiqueta,
    favorita: esFavoritoLinea(g.lineaSlug)
  }));
  grupos.sort((a, b) => {
    if (a.favorita !== b.favorita) return a.favorita ? -1 : 1;
    const av = a.dep ? a.dep.dias * 1440 + a.dep.h * 60 + a.dep.m : Infinity;
    const bv = b.dep ? b.dep.dias * 1440 + b.dep.h * 60 + b.dep.m : Infinity;
    return av - bv;
  });
  return { mostradas: grupos.slice(0, limite), total: grupos.length };
}

/** Devuelve el resultado calculado para una ruta favorita, reutilizando
 * el que ya había en caché si el próximo autobús que ofrecía sigue sin
 * haber salido todavía (con 1 minuto de margen). Solo se relanza el
 * cálculo cuando ese autobús concreto ya ha debido salir — así, entrar y
 * salir de la pestaña de favoritos varias veces seguidas no recalcula
 * nada de más. */
function getOrRecalcularFavoritoRuta(fav) {
  const ahora = new Date();
  if (fav.cache && typeof fav.cache.proximaSalidaTs === "number" && ahora.getTime() < fav.cache.proximaSalidaTs + 60000) {
    return fav.cache.resultado;
  }
  if (!ROUTING) return fav.cache ? fav.cache.resultado : null;
  const res = computeRoute(APP.data, ROUTING, { type: "stop", id: fav.origenId }, { type: "stop", id: fav.destinoId }, ahora, fav.criterio || "tiempo");
  if (res) {
    const primerBus = res.legs.find(l => l.tipo === "bus");
    const midnightBase = new Date(ahora);
    midnightBase.setHours(0, 0, 0, 0);
    const proximaSalidaTs = primerBus ? midnightBase.getTime() + primerBus.salida * 60000 : ahora.getTime() + 60000;
    fav.cache = { resultado: res, proximaSalidaTs };
  } else {
    fav.cache = null;
  }
  guardarFavoritos();
  return res;
}

async function renderFavRutas() {
  const box = document.getElementById("favRutasList");
  if (!FAVORITOS.rutas.length) {
    box.innerHTML = '<div class="card"><h3 class="section-title">' + icono("brujula") + 'Rutas guardadas</h3><p class="empty">Aún no tienes rutas favoritas. Calcula una ruta en la pestaña anterior y pulsa "Guardar ruta como favorita".</p></div>';
    return;
  }
  box.innerHTML = '<div class="card"><h3 class="section-title">' + icono("brujula") + 'Rutas guardadas</h3><p class="empty">Calculando…</p></div>';
  if (!ROUTING) {
    try {
      ROUTING = await loadRoutingData(false);
    } catch (e) {
      box.innerHTML = `<div class="card"><h3 class="section-title">${icono("brujula")}Rutas guardadas</h3><p class="empty">No se pudo cargar el motor de rutas: ${escapeHtml(e.message)}</p></div>`;
      return;
    }
  }

  box.innerHTML = "";
  const titulo = document.createElement("h3");
  titulo.className = "section-title";
  titulo.style.margin = "0 4px 8px 4px";
  titulo.innerHTML = icono("brujula") + "Rutas guardadas";
  box.appendChild(titulo);

  FAVORITOS.rutas.forEach(fav => {
    const card = document.createElement("div");
    card.className = "card";
    const res = getOrRecalcularFavoritoRuta(fav);

    const header = document.createElement("div");
    header.style.display = "flex";
    header.style.justifyContent = "space-between";
    header.style.alignItems = "baseline";
    header.style.gap = "8px";
    header.innerHTML = `<h3 class="detail-title" style="margin:0;">${escapeHtml(fav.origenNombre)} → ${escapeHtml(fav.destinoNombre)}</h3>`;
    const btnFav = document.createElement("button");
    btnFav.type = "button";
    btnFav.className = "btn-fav";
    pintarEstrella(btnFav, true);
    btnFav.addEventListener("click", () => { toggleFavoritoRuta(fav.origenId, fav.destinoId); renderFavRutas(); });
    header.appendChild(btnFav);
    card.appendChild(header);

    if (!res) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No se ha encontrado ruta en transporte público ahora mismo.";
      card.appendChild(p);
    } else {
      const tFinalAbs = res.diasSalida * 1440 + res.llegadaMin;
      const primerBus = res.legs.find(l => l.tipo === "bus");
      // La ruta favorita se lee con la misma espina que en la pantalla
      // de Ruta: una sola manera de enseñar un itinerario en toda la app.
      const resumen = document.createElement("div");
      resumen.className = "itin-horas";
      resumen.innerHTML = primerBus
        ? `<span>${fmtHoraAbs(primerBus.salida)}</span><span class="flecha">→</span><span class="llegada">${fmtHoraAbs(tFinalAbs)}</span>`
        : `<span class="llegada">${fmtHoraAbs(tFinalAbs)}</span>`;
      card.appendChild(resumen);

      const detalle = document.createElement("div");
      detalle.className = "itin-dur";
      detalle.innerHTML = `${res.numTrasbordos} trasbordo${res.numTrasbordos === 1 ? "" : "s"}${primerBus ? "" : " · todo a pie"}`;
      card.appendChild(detalle);

      const itin = document.createElement("div");
      itin.className = "itin";
      itin.style.marginTop = "10px";
      itin.innerHTML = itinerarioHtml(res);
      itin.querySelectorAll(".itin-tramo-pie[aria-expanded]").forEach(btn => {
        btn.addEventListener("click", () => {
          const lista = btn.parentNode.querySelector(".itin-intermedias");
          const abierto = btn.getAttribute("aria-expanded") === "true";
          btn.setAttribute("aria-expanded", abierto ? "false" : "true");
          if (lista) lista.hidden = abierto;
        });
      });
      card.appendChild(itin);

      const btnVerMapa = document.createElement("button");
      btnVerMapa.type = "button";
      btnVerMapa.className = "btn-chip";
      btnVerMapa.style.marginTop = "8px";
      btnVerMapa.innerHTML = icono("brujula") + "Abrir en Ruta";
      btnVerMapa.addEventListener("click", () => {
        ROUTE_ORIGIN = { type: "stop", id: fav.origenId };
        ROUTE_DESTINO = { type: "stop", id: fav.destinoId };
        cerrarDrawerFavoritos();
        irAPantalla("screenRuta");
        setTimeout(() => {
          buildStopsDatalist();
          document.getElementById("origenInput").value = fav.origenNombre;
          document.getElementById("origenStatus").textContent = `Parada: ${fav.origenNombre}`;
          document.getElementById("destinoInput").value = fav.destinoNombre;
          document.getElementById("destinoStatus").textContent = `Parada: ${fav.destinoNombre}`;
          onCalcularRuta();
        }, 80);
      });
      card.appendChild(btnVerMapa);
    }
    box.appendChild(card);
  });
}

async function renderFavoritosTab() {
  renderFavParadas();
  renderFavLineas();
  await renderFavRutas();
}

function initHomeMap() {
  if (HOME_MAP) { setTimeout(() => HOME_MAP.invalidateSize(), 60); return; }
  HOME_MAP = L.map("homeMap", { scrollWheelZoom: false, zoomControl: true });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {

  }).addTo(HOME_MAP);

    onGrupo: (grupo, marca) => abrirMenuGrupo(HOME_MAP, grupo, marca, HOME_CAPA, "inicio")
  });
  if (HOME_CAPA.limites.length) HOME_MAP.fitBounds(HOME_CAPA.limites, { padding: [16, 16] });
  else HOME_MAP.setView([37.389, -5.984], 10);
  HOME_CAPA.refrescar();

function setHomeOrigen(point, textoDescriptivo) {
  ROUTE_ORIGIN = point;
  document.getElementById("homeOrigenTexto").textContent = textoDescriptivo;
  if (!HOME_MAP) return;
  const latlng = point.type === "stop"
    ? [APP.data.paradas[point.id].lat, APP.data.paradas[point.id].lng]
    : [point.lat, point.lng];
  if (HOME_ORIGEN_MARKER) HOME_MAP.removeLayer(HOME_ORIGEN_MARKER);
  HOME_ORIGEN_MARKER = L.marker(latlng, {
    icon: L.divIcon({ className: "", html: `<span class="marca-extremo origen">${icono("pin")}</span>`, iconSize: [26, 26], iconAnchor: [13, 24] })
  }).addTo(HOME_MAP);
  HOME_MAP.setView(latlng, 14);
}

function pedirUbicacionInicio() {
  const texto = document.getElementById("homeOrigenTexto");
  if (!navigator.geolocation) {
    texto.textContent = "Tu navegador no comparte la ubicación. Elige de dónde sales en la pestaña Ruta.";
    return;
  }
  texto.textContent = "Buscando dónde estás…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      const near = nearestStop(APP.data, pos.coords.latitude, pos.coords.longitude);
      setHomeOrigen({ type: "point", lat: pos.coords.latitude, lng: pos.coords.longitude },
        near ? `Sales desde ${APP.data.paradas[near.id].nombre}` : "Sales desde tu ubicación");
      renderParadasCercanas(pos.coords.latitude, pos.coords.longitude);
    },
    () => {
      // Requisito del boceto: si no se puede geolocalizar, pedir punto de
      // partida explícito en vez de dejar la pantalla en un estado muerto.
      texto.textContent = "No hemos podido localizarte. Marca de dónde sales:";
      const btn = document.getElementById("homeBtnUbicacion");
      btn.innerHTML = icono("lapiz") + "Marcar en el mapa";
      btn.onclick = () => {
        texto.textContent = "Toca el mapa para fijar tu punto de partida.";
        if (HOME_MAP) HOME_MAP.once("click", e => {
          setHomeOrigen({ type: "point", lat: e.latlng.lat, lng: e.latlng.lng }, "Punto de partida marcado en el mapa");
        });
      };
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

/* ------------------------------------------------------------------ */
/* Seguimiento: desde qué paradas miras tus salidas                     */
/* ------------------------------------------------------------------ */
/** Las paradas que la persona vigila: sus paradas favoritas más los
 * puntos de referencia de sus líneas favoritas. Una parada que venga
 * solo de una línea favorita enseña únicamente esa línea; una parada
 * favorita enseña todas las que pasan por ella. */
function paradasDeSeguimiento() {
  const mapa = new Map();
  FAVORITOS.paradas.forEach(f => {
    if (!APP.data.paradas[f.id]) return;
    mapa.set(f.id, { paradaId: f.id, municipio: municipioDeParada(f.id), filtros: null });
  });
  FAVORITOS.lineas.forEach(fl => {
    const linea = APP.data.lineas.find(l => l.slug === fl.slug);
    if (!linea) return;
    referenciasDeLinea(linea).forEach(ref => {
      const ya = mapa.get(ref.paradaId);
      // Una parada favorita enseña todo lo que pasa por ella; una que
      // viene solo de una línea favorita enseña esa línea y en el sentido
      // que se eligió, que para eso se eligió.
      if (ya) {
        if (ya.filtros) ya.filtros.push({ lineaSlug: fl.slug, sentidoClave: ref.sentidoClave });
        return;
      }
      mapa.set(ref.paradaId, {
        paradaId: ref.paradaId,
        municipio: municipioDeParada(ref.paradaId),
        filtros: [{ lineaSlug: fl.slug, sentidoClave: ref.sentidoClave }]
      });
    });
  });
  return [...mapa.values()];
}

/** Municipios desde los que la persona mira algo, para la fila de
 * filtros. Es justo el nivel "municipio" del grafo tripartito aplicado a
 * tus favoritos: la M-177 para en Guillena y en Sevilla, y quieres poder
 * mirar cada extremo por separado. */
function municipiosDeSeguimiento() {
  return [...new Set(paradasDeSeguimiento().map(e => e.municipio).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "es"));
}

/** Salidas de una parada vigilada, ya filtradas a las líneas que
 * correspondan y ordenadas por proximidad. */
function salidasDeSeguimiento(entrada, limite) {
  limite = limite || 3;
  if (!entrada.filtros) return lineasEnParadaPriorizadas(entrada.paradaId, limite);
  const grupos = sentidosEnParada(entrada.paradaId, null)
    .filter(g => entrada.filtros.some(f =>
      f.lineaSlug === g.lineaSlug && (!f.sentidoClave || f.sentidoClave === g.sentidoClave)))
    .map(g => ({
      linea_slug: g.lineaSlug, linea_titulo: g.lineaTitulo, servicios: g.servicios,
      dep: g.dep, direccion: "hacia " + g.etiqueta, favorita: true
    }));
  return { mostradas: grupos.slice(0, limite), total: grupos.length };
}

/** Fila de pastillas para elegir desde qué municipio mirar. Si solo hay
 * uno no se pinta: no aporta nada y roba sitio. */
function pintarFiltroMunicipio(contenedor, onCambio) {
  const municipios = municipiosDeSeguimiento();
  contenedor.innerHTML = "";
  if (municipios.length < 2) return;
  const fila = document.createElement("div");
  fila.className = "chip-row";
  const pinta = (etiqueta, valor) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "muni-chip" + (FILTRO_MUNICIPIO === valor ? " active" : "");
    b.textContent = etiqueta;
    b.addEventListener("click", () => { setFiltroMunicipio(valor); onCambio(); });
    fila.appendChild(b);
  };
  pinta("Todos", "");
  municipios.forEach(m => pinta(m, m));
  contenedor.appendChild(fila);
}

/** Bloque destacado en Inicio: las salidas que vigilas, en grande y lo
 * primero de todo, filtrables por el municipio desde el que quieres
 * mirar. Si no hay favoritos, no ocupa sitio. */
function renderHomeFavSalidas() {
  const box = document.getElementById("homeFavSalidas");
  if (!box) return;
  const entradas = paradasDeSeguimiento();
  if (!entradas.length) { box.innerHTML = ""; return; }

  const visibles = entradas.filter(e => !FILTRO_MUNICIPIO || e.municipio === FILTRO_MUNICIPIO);
  let html = '<div class="card home-fav-card"><h2 class="home-fav-title">Tus próximas salidas</h2><div id="homeFiltroMuni"></div>';
  let hayAlgo = false;
  visibles.forEach(entrada => {
    const p = APP.data.paradas[entrada.paradaId];
    if (!p) return;
    const { mostradas, total } = salidasDeSeguimiento(entrada, 3);
    if (!mostradas.length) return;
    hayAlgo = true;
    html += `<div class="home-fav-parada" data-stop-id="${escapeHtml(entrada.paradaId)}">
      <div class="home-fav-parada-nombre">${icono("parada")}${escapeHtml(p.nombre)}${entrada.municipio ? ` <span class="home-fav-muni">${escapeHtml(entrada.municipio)}</span>` : ""}</div>`;
    mostradas.forEach(g => {
      const fmt = formatDeparture(g.dep);
      const notif = getNotificacion(entrada.paradaId, g.linea_slug) || getNotificacion(entrada.paradaId, null);
      html += `<div class="home-fav-fila">
        <span class="home-fav-code${g.favorita ? " es-fav" : ""}">${escapeHtml(codigoLinea(g.linea_titulo))}</span>
        <span class="home-fav-dir">${escapeHtml(g.direccion || g.linea_titulo)}</span>
        <span class="home-fav-hora">${escapeHtml(fmt.main)}<span class="home-fav-sub">${escapeHtml(fmt.sub)}</span></span>
      </div>`;
    });
    if (total > mostradas.length) {
      html += `<div class="fav-parada-mas">+${total - mostradas.length} salida${total - mostradas.length === 1 ? "" : "s"} más · pulsa para ver todo</div>`;
    }
    html += `</div>`;
  });
  if (!hayAlgo && FILTRO_MUNICIPIO) {
    html += `<p class="empty">No sigues ninguna parada en ${escapeHtml(FILTRO_MUNICIPIO)}.</p>`;
    hayAlgo = true;
  }
  html += "</div>";
  box.innerHTML = hayAlgo ? html : "";

  const filtro = box.querySelector("#homeFiltroMuni");
  if (filtro) pintarFiltroMunicipio(filtro, renderHomeFavSalidas);

  box.querySelectorAll(".home-fav-parada").forEach(el => {
    el.addEventListener("click", () => openModal(cont => buildStopScheduleModalContent(cont, el.dataset.stopId)));
  });
}

function renderQuickFavs() {
  const box = document.getElementById("homeQuickFavs");
  box.innerHTML = "";
  const rutas = FAVORITOS.rutas.slice(0, 3);
  rutas.forEach(fav => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "quickfav";
    b.innerHTML = icono("brujula") + escapeHtml(fav.destinoNombre);
    b.title = `${fav.origenNombre} ${icono("brujula")}${escapeHtml(fav.destinoNombre)}`;
    b.addEventListener("click", () => {
      ROUTE_ORIGIN = { type: "stop", id: fav.origenId };
      ROUTE_DESTINO = { type: "stop", id: fav.destinoId };
      irAPantalla("screenRuta");
      setTimeout(() => {
        buildStopsDatalist();
        document.getElementById("origenInput").value = fav.origenNombre;
        document.getElementById("origenStatus").textContent = `Parada: ${fav.origenNombre}`;
        document.getElementById("destinoInput").value = fav.destinoNombre;
        document.getElementById("destinoStatus").textContent = `Parada: ${fav.destinoNombre}`;
        onCalcularRuta();
      }, 90);
    });
    box.appendChild(b);
  });
  FAVORITOS.paradas.slice(0, 3).forEach(fav => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "quickfav";
    b.innerHTML = icono("parada") + escapeHtml(fav.nombre);
    b.addEventListener("click", () => openModal(container => buildStopScheduleModalContent(container, fav.id)));
    box.appendChild(b);
  });
}

function wireInicio() {
  document.getElementById("homeBtnUbicacion").addEventListener("click", pedirUbicacionInicio);
  document.getElementById("homeDestinoInput").addEventListener("change", e => {
    const nombre = e.target.value.trim();
    if (!nombre) return;
    buildStopsDatalist();
    const punto = interpretarBusquedaExtremo(nombre);
    if (!punto) {
      document.getElementById("homeOrigenTexto").textContent = "No se reconoce; elige una parada o un municipio de la lista.";
      return;
    }
    ROUTE_DESTINO = punto;
    irAPantalla("screenRuta");
    setTimeout(() => {
      document.getElementById("destinoInput").value = textoDeExtremo(punto);
      document.getElementById("destinoStatus").textContent = describeEndpoint(punto);
      if (ROUTE_ORIGIN) {
        document.getElementById("origenInput").value = textoDeExtremo(ROUTE_ORIGIN);
        document.getElementById("origenStatus").textContent = describeEndpoint(ROUTE_ORIGIN);
        onCalcularRuta();
      }
    }, 90);
  });
}

/* ------------------------------------------------------------------ */
/* Navegación y drawer de favoritos                                    */
/* ------------------------------------------------------------------ */
function irAPantalla(idPantalla) {
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.screen === idPantalla));
  document.querySelectorAll(".screen").forEach(p => p.classList.toggle("active", p.id === idPantalla));
  if (idPantalla === "screenInicio") { initHomeMap(); renderHomeFavSalidas(); renderQuickFavs(); }
  if (idPantalla === "screenRuta") { buildStopsDatalist(); initRouteMap(); }
  if (idPantalla === "screenLineas") { renderLineasFavoritas(); renderListadoLineas(); }
  if (CURRENT_MAP_REF.map) setTimeout(() => CURRENT_MAP_REF.map.invalidateSize(), 60);
  if (CURRENT_ROUTE_MAP) setTimeout(() => CURRENT_ROUTE_MAP.invalidateSize(), 60);
  if (HOME_MAP) setTimeout(() => HOME_MAP.invalidateSize(), 60);
}

function abrirDrawerFavoritos() {
  document.getElementById("favDrawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");
  renderFavoritosTab();
}

function cerrarDrawerFavoritos() {
  document.getElementById("favDrawer").classList.remove("open");
  document.getElementById("drawerOverlay").classList.remove("open");
}

function wireTabs() {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => irAPantalla(btn.dataset.screen));
  });
  document.getElementById("btnAbrirFavoritos").addEventListener("click", abrirDrawerFavoritos);
  document.getElementById("btnCerrarFavoritos").addEventListener("click", cerrarDrawerFavoritos);
  document.getElementById("drawerOverlay").addEventListener("click", cerrarDrawerFavoritos);
}

/* ------------------------------------------------------------------ */
/* Arranque                                                             */
/* ------------------------------------------------------------------ */
/** Registra el Service Worker (solo funciona sobre https:// o
 * localhost). Nos da caché offline y, sobre todo, notificaciones
 * reales en móvil, donde `new Notification()` está prohibido. */
function registrarServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  navigator.serviceWorker.register("sw.js", { scope: "./" })
    .then(reg => console.info("Service Worker registrado", reg.scope))
    .catch(err => console.warn("No se pudo registrar el Service Worker", err));
}

async function init() {
  cargarFavoritos();
  pintarIconosDeclarados();
  wireTema();
  registrarServiceWorker();
  setStatus("Cargando datos…");
  try {
    APP.data = await loadData(false);
    construirGrafo();
    setStatus("");
  } catch (err) {
    setStatus("No se han podido cargar los horarios. Comprueba la conexión y vuelve a entrar.", true);
    return;
  }
  buildMunicipioOptions();
  wireTabs();
  wireLineSearch();
  wireRuta();
  wireInicio();
  renderQuickFavs();
  renderHomeFavSalidas();
  initHomeMap();
  arrancarVigilanteNotificaciones();
  pedirUbicacionInicio();
}

document.addEventListener("DOMContentLoaded", init);
