/* ------------------------------------------------------------------ */
/* Pestaña "Geolocalización"                                           */
/* ------------------------------------------------------------------ */
/* ------------------------------------------------------------------ */
/* Pestaña "Calculadora de ruta"                                       */
/* ------------------------------------------------------------------ */
/** `ROUTING` se mantiene por compatibilidad con quien todavía lea
 * `.vecinos` (llegan del `vecinos` de cada horarios.json, precalculado en
 * el servidor sobre un radio y un tope de vecinas fijos). El buscador de
 * itinerarios YA NO lee de aquí: usa `vecinosAPie()`, calculado al vuelo
 * con la distancia en línea recta de cada parada, así que no depende de
 * que esa área tenga los horarios bajados ni se queda corto en un
 * cruce con más de diez paradas alrededor. */
let ROUTING = { vecinos: {} };

/** Dos índices espaciales de las paradas del catálogo (las 5.009, de las
 * nueve áreas), para encontrar vecinas a pie o en bici sin depender de un
 * grafo precalculado. Se reconstruyen una vez, al montar el catálogo —las
 * coordenadas no cambian después—, así que sirven desde el primer
 * segundo, sin esperar a que se bajen los horarios de ningún área.
 *
 * Van por separado porque el radio cambia con el modo, no sólo la
 * velocidad: en bici vale la pena rodear más para llegar a una parada, así
 * que hace falta mirar más lejos, no sólo tardar menos en el mismo sitio.
 * La rejilla de cada índice tiene el tamaño de su radio (para que un barrido
 * de las 9 celdas de alrededor cubra siempre el círculo entero). */
let INDICE_PIE = null;
let INDICE_BICI = null;
let CACHE_VECINOS_PIE = new Map();
let CACHE_VECINOS_BICI = new Map();
const RADIO_A_PIE_M = 600;       // doce minutos a pie, como una esquina más allá
const MAX_VECINOS_A_PIE = 10;    // ramas por parada: de sobra sin dispersar la búsqueda
// En bici merece la pena rodear una parada floja para enganchar una mejor
// y ahorrarse un trasbordo entero: más radio que a pie, no sólo más rápido
// en el mismo radio.
const RADIO_BICI_M = 2500;
const MAX_VECINOS_BICI = 12;

function construirIndiceGeo(radioM) {
  const indice = { celdas: new Map(), lado: radioM / 111320 };
  const anchoLng = lat => indice.lado / Math.max(0.2, Math.cos(lat * Math.PI / 180));
  const clave = (lat, lng) => Math.floor(lat / indice.lado) + "|" + Math.floor(lng / anchoLng(lat));
  Object.entries(CTAN.paradas).forEach(([id, p]) => {
    if (p.lat == null || p.lng == null) return;
    const k = clave(p.lat, p.lng);
    if (!indice.celdas.has(k)) indice.celdas.set(k, []);
    indice.celdas.get(k).push(id);
  });
  return indice;
}

function construirIndicesDeCercania() {
  INDICE_PIE = construirIndiceGeo(RADIO_A_PIE_M);
  INDICE_BICI = construirIndiceGeo(RADIO_BICI_M);
  CACHE_VECINOS_PIE = new Map();
  CACHE_VECINOS_BICI = new Map();
}

/** El núcleo compartido: paradas dentro de un radio, en línea recta,
 * ordenadas por cercanía y con el tiempo ya calculado para ese modo.
 * Memoizado por parada — las coordenadas no cambian en lo que dura la
 * sesión, así que el resultado tampoco. */
function vecinosCerca(paradaId, indice, cache, radioM, maxVecinos, modo) {
  if (cache.has(paradaId)) return cache.get(paradaId);
  const resultado = [];
  const p = indice && CTAN.paradas[paradaId];
  if (p && p.lat != null) {
    const { celdas, lado } = indice;
    const anchoLng = lado / Math.max(0.2, Math.cos(p.lat * Math.PI / 180));
    const cx = Math.floor(p.lat / lado), cy = Math.floor(p.lng / anchoLng);
    const cerca = [];
    for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
        (celdas.get((cx + i) + "|" + (cy + j)) || []).forEach(otroId => {
          if (otroId === paradaId) return;
          const q = CTAN.paradas[otroId];
          const d = haversine(p.lat, p.lng, q.lat, q.lng);
          if (d <= radioM) cerca.push([otroId, d]);
        });
      }
    }
    cerca.sort((a, b) => a[1] - b[1]);
    const minutosDe = modo === "bici" ? bikeMinutes : walkMinutes;
    cerca.slice(0, maxVecinos).forEach(([id, d]) => resultado.push([id, minutosDe(d), modo]));
  }
  cache.set(paradaId, resultado);
  return resultado;
}

/** Paradas a las que se puede ir andando desde una, en línea recta a
 * 3 km/h (la misma velocidad que decide cuánto se tarda en llegar a la
 * primera parada o desde la última): [[paradaId, minutos, "pie"], …], las
 * más cercanas primero. */
function vecinosAPie(paradaId) {
  return vecinosCerca(paradaId, INDICE_PIE, CACHE_VECINOS_PIE, RADIO_A_PIE_M, MAX_VECINOS_A_PIE, "pie");
}

/** Lo mismo, pero al doble de velocidad y con más alcance: [[paradaId,
 * minutos, "bici"], …]. */
function vecinosEnBici(paradaId) {
  return vecinosCerca(paradaId, INDICE_BICI, CACHE_VECINOS_BICI, RADIO_BICI_M, MAX_VECINOS_BICI, "bici");
}

/** El trasbordo que de verdad usa el buscador de itinerarios: a pie
 * siempre, o en bici —más lejos y más rápido— si el interruptor está
 * activado. Con esto una parada a 1,5 km, inalcanzable a pie, puede
 * ahorrarse un trasbordo entero con un salto en bici. */
function vecinosDeTransporte(paradaId) {
  return MODO_BICI ? vecinosEnBici(paradaId) : vecinosAPie(paradaId);
}
let CURRENT_ROUTE_MAP = null;
let ROUTE_MARKERS = {};
let ROUTE_CAPA = null;   // capa de red del mapa de rutas (municipios + paradas)
let ROUTE_ORIGIN = null;   // {type:'stop', id} | {type:'point', lat, lng}
let ROUTE_DESTINO = null;
let ROUTE_ARM_MODE = null; // 'origen' | 'destino' | null
let ROUTE_ORIGIN_MARKER = null;
let ROUTE_DESTINO_MARKER = null;
let ROUTE_PATH_LAYERS = [];
let PARADA_POR_NOMBRE = null;
let RUTA_OPCIONES = [];      // combinaciones de líneas calculadas para la última consulta
let RUTA_OPCION_ACTIVA = 0;  // cuál se está enseñando (0 = la de menos trasbordos)

function walkMinutes(distMeters) {
  return Math.max(1, Math.round((distMeters / 1000) / 3 * 60));
}

/** El pedal cunde el doble que caminar, por decisión sencilla: mismo
 * cálculo de distancia en línea recta, la mitad de minutos. */
function bikeMinutes(distMeters) {
  return Math.max(1, Math.round(walkMinutes(distMeters) / 2));
}

/** Ir en bicicleta es opt-in: no todo el mundo tiene una a mano, así que
 * por defecto sólo se ofrece caminar. Se recuerda entre visitas. */
const LS_MODO_BICI = "ctanModoBiciV1";
let MODO_BICI = false;
try { MODO_BICI = localStorage.getItem(LS_MODO_BICI) === "1"; } catch (e) { MODO_BICI = false; }
function setModoBici(activo) {
  MODO_BICI = !!activo;
  try { localStorage.setItem(LS_MODO_BICI, MODO_BICI ? "1" : "0"); } catch (e) { /* modo privado */ }
}

// Por encima de esto ni caminar ni pedalear es una alternativa seria: se
// deja de ofrecer como opción y sólo queda el aviso de "sería más lento".
// Seis horas de bici cubren un buen trozo de Andalucía (más de 30 km al
// doble de la velocidad a pie) y aun así hay pueblos que se enlazan en
// autobús con un rodeo peor que eso: vale la pena poder comparar.
const UMBRAL_MIN_DIRECTO = 360;

function nearestStop(appData, lat, lng) {
  let best = null, bestD = Infinity;
  for (const [id, p] of Object.entries(appData.paradas)) {
    if (p.lat == null) continue;
    const d = haversine(lat, lng, p.lat, p.lng);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best ? { id: best, dist: bestD } : null;
}

/** De qué áreas hacen falta los horarios para calcular una ruta con este
 * extremo. Un municipio puede tocar una sola (los 234 son de un área
 * cada uno) y un punto en el mapa se resuelve por su parada más cercana,
 * que ya sale del catálogo entero. */
function areasDeExtremo(punto) {
  if (!punto) return [];
  if (punto.type === "stop") return [areaDeParada(punto.id)];
  if (punto.type === "municipio") {
    const m = GRAFO.municipios.get(punto.nombre);
    return m ? [...new Set(m.paradas.map(areaDeParada))] : [];
  }
  const near = nearestStop(APP.data, punto.lat, punto.lng);
  const areas = [areaMasCercana(punto.lat, punto.lng)];
  if (near) areas.push(areaDeParada(near.id));
  return areas.filter(x => x != null);
}

/** Traduce un extremo de la ruta (parada, punto marcado en el mapa,
 * ubicación del GPS o municipio entero) a lo que necesita el buscador:
 * desde qué paradas puede empezar y en cuáles se da por llegado.
 *
 * El caso "municipio" es el que abre el grafo tripartito a la interfaz:
 * la persona no elige parada ninguna, dice "de Guillena a Sevilla", y
 * valen todas las paradas del municipio. */
function resolverExtremo(appData, punto) {
  if (!punto) return null;
  if (punto.type === "stop") {
    if (!appData.paradas[punto.id]) return null;
    return {
      tipo: "stop", stopIds: new Set([punto.id]),
      seeds: [{ stopId: punto.id, walk: null }],
      etiqueta: appData.paradas[punto.id].nombre
    };
  }
  if (punto.type === "municipio") {
    const ids = paradasDeNucleo(punto.nombre);
    if (!ids.length) return null;
    return {
      tipo: "municipio", stopIds: new Set(ids),
      seeds: ids.map(id => ({ stopId: id, walk: null })),
      etiqueta: punto.nombre
    };
  }
  const near = nearestStop(appData, punto.lat, punto.lng);
  if (!near) return null;
  // Desde un punto del mapa no vale con la parada más cercana: si a diez
  // metros más allá hay otra por la que pasa la línea que sirve, el
  // buscador tiene que poder usarla. Se ofrecen todas las que estén a un
  // paseo razonable, y cada una entra con lo que cuesta llegar andando.
  const RADIO_PUNTO_M = 700;
  const cerca = Object.entries(appData.paradas)
    .filter(([, p]) => p.lat != null)
    .map(([id, p]) => ({ id, dist: haversine(punto.lat, punto.lng, p.lat, p.lng) }))
    .filter(c => c.dist <= Math.max(RADIO_PUNTO_M, near.dist))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 12);
  const seeds = (cerca.length ? cerca : [near])
    .map(c => ({ stopId: c.id, walk: { lat: punto.lat, lng: punto.lng, dist: c.dist } }));
  return {
    tipo: "punto", stopIds: new Set(seeds.map(s => s.stopId)),
    seeds,
    etiqueta: appData.paradas[near.id].nombre
  };
}

/** Coordenadas representativas de un extremo, para medir distancias y
 * centrar el mapa. Un municipio se representa por el centro de sus
 * paradas. */
function coordenadasDeExtremo(appData, punto) {
  if (!punto) return null;
  if (punto.type === "stop") {
    const p = appData.paradas[punto.id];
    return p && p.lat != null ? [p.lat, p.lng] : null;
  }
  if (punto.type === "municipio") {
    const m = GRAFO.municipios.get(punto.nombre);
    return m && m.lat != null ? [m.lat, m.lng] : null;
  }
  return [punto.lat, punto.lng];
}

/* ------------------------------------------------------------------ */
/* Buscador de itinerarios (RAPTOR)                                     */
/* ------------------------------------------------------------------ */
/** Búsqueda por rondas sobre los viajes reales. Cada ronda añade un
 * autobús más, así que la ronda en la que aparece un destino ES su número
 * de trasbordos: al terminar se tienen todas las alternativas ordenadas
 * de menos a más trasbordos, sin buscar una por una ni enumerar
 * combinaciones de líneas a mano.
 *
 * Sustituye al barrido de conexiones anterior, que dependía de un grafo
 * de enlaces inventado emparejando horas y por eso perdía viajes enteros. */
// Ocho autobuses (siete trasbordos) es mucho para un trayecto normal, pero
// hay pueblos que sólo se enlazan así: "El Viso del Alcor" a "Villamanrique
// de la Condesa", los dos dentro del área de Sevilla, pide cinco. Con
// cuatro se descartaban como "imposibles" trayectos que sí existen; con
// ocho el coste es el mismo —un pueblo remoto no tiene tantas líneas que
// probar— y se sigue sin encontrar nada que de verdad no exista.
const MAX_RONDAS = 8;
const MIN_TRASBORDO_MIN = 3;    // bajar, andar por el andén y subir

/** Primer viaje de un bloque que se puede coger en `pos` a partir de `t`,
 * de entre los que circulan ese día. El calendario entra aquí: un viaje
 * cuyo servicio no está activo esa fecha sencillamente no existe. */
function primerViaje(ruta, pos, t, activos) {
  const viajes = ruta.viajes;
  for (let i = 0; i < viajes.length; i++) {
    if (viajes[i][pos] >= t && activos.has(ruta.servicios[i])) return i;
  }
  return -1;
}

/** Núcleo de la búsqueda: devuelve, por ronda, el mejor tiempo de llegada
 * a cada parada y cómo se llegó. */
function raptor(routing, origenes, activos, destinoIds) {
  const mejor = new Map();          // parada -> mejor llegada de cualquier ronda
  const rondas = [new Map()];       // rondas[k] -> parada -> llegada en <=k buses
  const padres = [new Map()];       // rondas[k] -> parada -> de dónde vino

  // Un salto a pie —o en bici, con la bicicleta activada— desde las
  // paradas que acaban de mejorar: la parada de enfrente, la de la
  // esquina, el otro andén, o con la bici algo más allá si con eso se
  // engancha una línea mejor y se ahorra un trasbordo entero. Nunca
  // encadenados, para no convertir la búsqueda en un paseo por media
  // provincia. Se calcula al vuelo (distancia en línea recta), no de un
  // grafo cargado de antemano: así funciona igual entre dos paradas
  // recién llegadas de un área que aún no tenía horarios.
  const saltosAPie = (k, desdeParadas) => {
    const alcanzadas = new Set();
    // La hora de salida de cada parada se congela ANTES de repartir los
    // saltos: si se leyera en vivo de `rondas[k]`, una parada que también
    // estuviera en `desdeParadas` podría heredar a media vuelta la hora
    // mejorada por el salto de otra y encadenar un segundo salto sin que
    // hubiera autobús de por medio — justo lo que este método existe
    // para evitar.
    const salidaDe = new Map(desdeParadas.map(id => [id, rondas[k].get(id)]));
    desdeParadas.forEach(paradaId => {
      const desde = salidaDe.get(paradaId);
      vecinosDeTransporte(paradaId).forEach(([vecino, minutos, modo]) => {
        // Si la parada de llegada es TAMBIÉN una de las que ha traído un
        // autobús esta ronda, su propio historial no se toca: si se
        // dejara mejorar, se reconstruiría con dos versiones de "cómo
        // llegué aquí" a la vez — la que de verdad se usó para saltar
        // más allá, y la que quedaría grabada encima — y el itinerario
        // saldría con una espera negativa o un salto que no cuadra.
        if (salidaDe.has(vecino)) return;
        const cand = desde + minutos;
        const actual = rondas[k].get(vecino);
        if (actual === undefined || cand < actual) {
          rondas[k].set(vecino, cand);
          if (!mejor.has(vecino) || cand < mejor.get(vecino)) mejor.set(vecino, cand);
          // La hora de salida se guarda tal cual (no sólo el nombre de la
          // parada): si esa parada mejora más tarde en la misma ronda por
          // otro salto —llega antes en bici desde un tercer sitio—, este
          // tramo no puede heredar esa hora nueva sin haber pasado por
          // ella de verdad. Sin esto la reconstrucción podía enseñar un
          // salto que salía después de haber llegado.
          if (padres[k]) padres[k].set(vecino, { tipo: "pie", desde: paradaId, desdeLlegada: desde, minutos, modo });
          alcanzadas.add(vecino);
        }
      });
    });
    return alcanzadas;
  };

  origenes.forEach(({ stopId, salida }) => {
    rondas[0].set(stopId, salida);
    if (!mejor.has(stopId) || salida < mejor.get(stopId)) mejor.set(stopId, salida);
  });
  // También desde el propio punto de partida: si el autobús que sirve
  // pasa por la acera de enfrente —otra parada, otro identificador—, hay
  // que poder cruzar la calle antes de coger el primero.
  saltosAPie(0, [...rondas[0].keys()]).forEach(id => { /* ya marcadas abajo */ });

  const cotaDestino = () => {
    let t = Infinity;
    destinoIds.forEach(id => { if (mejor.has(id)) t = Math.min(t, mejor.get(id)); });
    return t;
  };

  let marcadas = new Set(rondas[0].keys());
  for (let k = 1; k <= MAX_RONDAS && marcadas.size; k++) {
    rondas[k] = new Map(rondas[k - 1]);
    padres[k] = new Map();
    const nuevas = new Set();

    // Qué rutas hay que recorrer y desde qué posición: la más temprana
    // de todas las paradas marcadas que las tocan.
    const cola = new Map();         // ruta -> posición desde la que subir
    marcadas.forEach(paradaId => {
      (CTAN.porParada.get(paradaId) || []).forEach(({ bloque, pos }) => {
        const previa = cola.get(bloque);
        if (previa === undefined || pos < previa) cola.set(bloque, pos);
      });
    });

    cola.forEach((desdePos, ruta) => {
      let viaje = -1, subidaPos = -1;
      for (let pos = desdePos; pos < ruta.paradas.length; pos++) {
        const paradaId = ruta.paradas[pos];
        if (viaje >= 0) {
          const llegada = ruta.viajes[viaje][pos];
          const tope = Math.min(mejor.has(paradaId) ? mejor.get(paradaId) : Infinity, cotaDestino());
          if (llegada < tope) {
            rondas[k].set(paradaId, llegada);
            mejor.set(paradaId, llegada);
            padres[k].set(paradaId, { tipo: "bus", ruta, viaje, subidaPos, bajadaPos: pos });
            nuevas.add(paradaId);
          }
        }
        // ¿Se puede coger un viaje anterior subiendo aquí?
        const llegadaPrevia = rondas[k - 1].get(paradaId);
        if (llegadaPrevia === undefined) continue;
        const listo = llegadaPrevia + (k > 1 ? MIN_TRASBORDO_MIN : 0);
        if (viaje < 0 || listo <= ruta.viajes[viaje][pos]) {
          const cand = primerViaje(ruta, pos, listo, activos);
          if (cand >= 0 && (viaje < 0 || cand < viaje)) { viaje = cand; subidaPos = pos; }
        }
      }
    });

    saltosAPie(k, [...nuevas]).forEach(id => nuevas.add(id));

    marcadas = nuevas;
  }
  return { rondas, padres };
}

/** Rehace el camino hasta una parada en una ronda concreta, en el mismo
 * formato de tramos que ya dibujan el itinerario y el mapa. */
function reconstruir(rondas, padres, paradaId, ronda) {
  const crudos = [];
  let actual = paradaId, k = ronda;
  const visitados = new Set();
  while (k > 0) {
    const clave = k + "|" + actual;
    if (visitados.has(clave)) break;
    visitados.add(clave);
    const padre = padres[k] && padres[k].get(actual);
    if (!padre) { k--; continue; }
    if (padre.tipo === "pie") {
      // La salida es la que se congeló al calcular este salto
      // (`desdeLlegada`), no la que tenga ahora `padre.desde` en
      // `rondas[k]`: esa parada puede haber mejorado después, por otro
      // salto ajeno a este, y usar su hora actual desharía la congelación
      // que evita los saltos encadenados.
      crudos.push({ tipo: "walk", origen: padre.desde, destino: actual, modo: padre.modo,
        salida: padre.desdeLlegada, llegada: rondas[k].get(actual) });
      actual = padre.desde;
    } else {
      const { ruta, viaje, subidaPos, bajadaPos } = padre;
      crudos.push({
        tipo: "bus", lineaSlug: ruta.lineaSlug,
        origen: ruta.paradas[subidaPos], destino: ruta.paradas[bajadaPos],
        salida: ruta.viajes[viaje][subidaPos], llegada: ruta.viajes[viaje][bajadaPos],
        paradasRuta: ruta.paradas.slice(subidaPos, bajadaPos + 1)
      });
      actual = ruta.paradas[subidaPos];
      k--;
    }
  }
  // El primer autobús puede cogerse en la parada de enfrente: ese paseo
  // se decidió en la ronda 0 y hay que enseñarlo, o el itinerario
  // arrancaría en un sitio al que nadie ha dicho cómo se llega.
  const inicial = padres[0] && padres[0].get(actual);
  if (inicial && inicial.tipo === "pie") {
    crudos.push({ tipo: "walk", origen: inicial.desde, destino: actual, modo: inicial.modo,
      salida: inicial.desdeLlegada, llegada: rondas[0].get(actual) });
  }
  crudos.reverse();
  return crudos;
}

/** Envuelve un camino crudo en el resultado que espera la interfaz:
 * fusiona tramos, calcula esperas y añade los paseos de los extremos. */
function montarItinerario(crudos, o, de, destinoStopId, salidaMin, diaOffset) {
  crudos = crudos.map(l => ({ ...l, salida: l.salida + diaOffset, llegada: l.llegada + diaOffset }));
  salidaMin += diaOffset;
  const legs = [];
  let totalCaminandoMin = 0;
  let totalPedaleandoMin = 0;

  const arranque = crudos.length ? crudos[0].origen : destinoStopId;
  const seed = o.seeds.find(s => s.stopId === arranque);
  if (seed && seed.walk) {
    const wmin = walkMinutes(seed.walk.dist);
    legs.push({ tipo: "walk_inicio", destino: seed.stopId, distMetros: seed.walk.dist,
      salida: salidaMin - wmin, llegada: salidaMin });
    totalCaminandoMin += wmin;
  }

  crudos.forEach(leg => {
    if (leg.tipo === "walk") {
      legs.push({ ...leg });
      if (leg.modo === "bici") totalPedaleandoMin += leg.llegada - leg.salida;
      else totalCaminandoMin += leg.llegada - leg.salida;
      return;
    }
    const previa = legs[legs.length - 1];
    const esperaMin = previa ? Math.max(0, leg.salida - previa.llegada) : Math.max(0, leg.salida - salidaMin);
    legs.push({ ...leg, paradasIntermedias: leg.paradasRuta.length - 2, esperaMin });
  });

  let tFinal = legs.length ? legs[legs.length - 1].llegada : salidaMin;
  const seedFin = de.seeds.find(s => s.stopId === destinoStopId);
  if (seedFin && seedFin.walk) {
    const wmin = walkMinutes(seedFin.walk.dist);
    legs.push({ tipo: "walk_fin", origen: destinoStopId, salida: tFinal, llegada: tFinal + wmin, distMetros: seedFin.walk.dist });
    tFinal += wmin;
    totalCaminandoMin += wmin;
  }

  const primerBus = legs.find(l => l.tipo === "bus");
  const diasSalida = Math.floor(tFinal / 1440);
  return {
    legs, llegadaMin: tFinal - diasSalida * 1440, diasSalida,
    origenStopId: primerBus ? primerBus.origen : destinoStopId,
    destinoStopId, totalCaminandoMin, totalPedaleandoMin,
    numTrasbordos: Math.max(0, legs.filter(l => l.tipo === "bus").length - 1),
    lineas: legs.filter(l => l.tipo === "bus").map(l => l.lineaSlug),
    salidaMin: legs.length ? legs[0].salida : salidaMin
  };
}

/** Todas las formas razonables de ir de un extremo a otro, una por número
 * de trasbordos, de menos a más. La primera es la que se enseña. */
function calcularOpcionesRuta(appData, routing, origin, destino, salida) {
  const o = resolverExtremo(appData, origin);
  const de = resolverExtremo(appData, destino);
  RUTA_SIN_RESULTADO = null;
  if (!o || !de) return [];

  for (let dia = 0; dia <= 2; dia++) {
    const fecha = new Date(salida.getTime() + dia * 86400000);
    // Siempre en minutos desde la medianoche DE ESE día: los horarios de
    // la red también lo están. El día se suma al final, al presentar.
    const salidaMin = dia === 0 ? salida.getHours() * 60 + salida.getMinutes() : 0;
    const origenes = o.seeds.map(seed => ({
      stopId: seed.stopId,
      salida: salidaMin + (seed.walk ? walkMinutes(seed.walk.dist) : 0)
    }));

    const { rondas, padres } = raptor(routing, origenes,
      serviciosActivosEn(fecha), de.stopIds);

    const opciones = [];
    const vistas = new Set();
    for (let k = 1; k < rondas.length; k++) {
      let mejorParada = null, mejorT = Infinity;
      de.stopIds.forEach(id => {
        const t = rondas[k].get(id);
        if (t !== undefined && t < mejorT) { mejorT = t; mejorParada = id; }
      });
      if (!mejorParada) continue;
      const crudos = reconstruir(rondas, padres, mejorParada, k);
      if (!crudos.some(l => l.tipo === "bus")) continue;
      const res = montarItinerario(crudos, o, de, mejorParada, salidaMin, dia * 1440);
      const clave = res.lineas.join(">") + "@" + res.salidaMin;
      if (vistas.has(clave)) continue;
      vistas.add(clave);
      opciones.push(res);
    }
    if (!opciones.length) continue;

    // Una alternativa con más trasbordos sólo merece enseñarse si además
    // llega antes; si no, es peor por los dos lados.
    opciones.sort((a, b) => a.numTrasbordos - b.numTrasbordos ||
      (a.diasSalida * 1440 + a.llegadaMin) - (b.diasSalida * 1440 + b.llegadaMin));
    const buenas = [];
    let mejorLlegada = Infinity;
    opciones.forEach(op => {
      const llegada = op.diasSalida * 1440 + op.llegadaMin;
      if (buenas.length && llegada >= mejorLlegada) return;
      buenas.push(op);
      mejorLlegada = Math.min(mejorLlegada, llegada);
    });
    return buenas;
  }
  RUTA_SIN_RESULTADO = motivoSinRuta(o, de);
  return [];
}

/** Cuando no sale nada, por qué. Un "no se ha encontrado ninguna ruta" a
 * secas invita a pensar que la aplicación falla, y no siempre es lo mismo:
 * a veces el trayecto pide más trasbordos de los que tiene sentido ofrecer,
 * a veces hay que cruzar una ciudad por dentro y el metro, el tranvía o un
 * urbano municipal no están en estos horarios — y a veces, sencillamente,
 * el origen y el destino son de dos áreas metropolitanas que esta
 * aplicación no tiene conectadas entre sí: la Red de Consorcios publica
 * nueve redes independientes, no una única red panandaluza. Un trayecto
 * entre dos de ellas (Sevilla–Cádiz, Huelva–Almería…) necesita un autobús
 * interurbano de largo o media distancia que no es de ningún consorcio
 * metropolitano, así que no está en estos datos por más trasbordos que se
 * permitan.
 *
 * Se cuenta a saltos, sin mirar la hora: cuántos autobuses distintos hay
 * que encadenar como mínimo para llegar. */
let RUTA_SIN_RESULTADO = null;

/** Las áreas a las que pertenecen estas paradas, para saber si el
 * problema es "hacen falta más autobuses de los que se prueban" o
 * "estas dos áreas no están conectadas en absoluto". */
function areasDe(stopIds) {
  return [...new Set([...stopIds].map(areaDeParada).filter(x => x != null))];
}

function saltosMinimos(origenIds, destinoIds) {
  const meta = new Set(destinoIds);
  const vistas = new Map();
  let frente = [];
  const anotar = (id, saltos) => {
    if (vistas.has(id) && vistas.get(id) <= saltos) return;
    vistas.set(id, saltos);
    frente.push(id);
  };
  origenIds.forEach(id => anotar(id, 0));
  origenIds.forEach(id => vecinosDeTransporte(id).forEach(([v]) => anotar(v, 0)));
  if (frente.some(id => meta.has(id))) return 0;

  for (let saltos = 1; saltos <= 8 && frente.length; saltos++) {
    const siguiente = [];
    frente.forEach(paradaId => {
      (CTAN.porParada.get(paradaId) || []).forEach(({ bloque, pos }) => {
        for (let i = pos + 1; i < bloque.paradas.length; i++) {
          const q = bloque.paradas[i];
          if (vistas.has(q)) continue;
          vistas.set(q, saltos);
          siguiente.push(q);
          vecinosDeTransporte(q).forEach(([v]) => {
            if (!vistas.has(v)) { vistas.set(v, saltos); siguiente.push(v); }
          });
        }
      });
    });
    if (siguiente.some(id => meta.has(id))) return saltos;
    frente = siguiente;
  }
  return null;
}

function motivoSinRuta(o, de) {
  const saltos = saltosMinimos(o.stopIds, de.stopIds);
  if (saltos === 0) return "Están tan cerca que se llega andando: no hace falta coger nada.";

  if (saltos === null) {
    // El primer sospechoso es que sean de áreas distintas: los nueve
    // consorcios no se tocan entre sí en estos datos (ni comparten una
    // sola parada ni hay ninguna a menos de 600 m de la de al lado), así
    // que si origen y destino no comparten ninguna, no hay trasbordo que
    // valga: no es que falten líneas, es que la conexión no existe.
    const areasOrigen = areasDe(o.stopIds), areasDestino = areasDe(de.stopIds);
    const comparten = areasOrigen.some(a => areasDestino.includes(a));
    if (!comparten && areasOrigen.length && areasDestino.length) {
      return `${nombreDeArea(areasOrigen[0])} y ${nombreDeArea(areasDestino[0])} son dos redes de autobús metropolitano independientes, y no están conectadas entre sí en estos datos. Hace falta un autobús interurbano de largo o media distancia — de la Junta o de una naviera privada — que no es de ningún consorcio metropolitano y por eso no aparece aquí.`;
    }
    return "No hay ninguna combinación de autobuses metropolitanos que una estas dos paradas. Si el trayecto pasa por dentro de una ciudad, hará falta su metro, tranvía o urbano municipal, que no están en estos horarios.";
  }

  if (saltos > MAX_RONDAS) return `El trayecto necesitaría ${saltos - 1} trasbordos, más de los que merece la pena hacer en autobús.`;
  return "Hoy ya no queda ningún autobús que haga este trayecto, ni mañana a esta hora.";
}

/** La mejor de todas: la que menos trasbordos tiene. */
function computeRoute(appData, routing, origin, destino, salida) {
  return calcularOpcionesRuta(appData, routing, origin, destino, salida)[0] || null;
}

function fmtHoraAbs(minAbs) {
  const dias = Math.floor(minAbs / 1440);
  const m = ((minAbs % 1440) + 1440) % 1440;
  const hh = String(Math.floor(m / 60)).padStart(2, "0");
  const mm = String(m % 60).padStart(2, "0");
  return `${hh}:${mm}` + (dias > 0 ? ` (+${dias}d)` : "");
}

/** El buscador de origen/destino admite las dos cosas: una parada
 * concreta o un municipio entero. Los municipios van marcados para que
 * se distingan de un vistazo y para poder reconocerlos al escribirlos. */
const PREFIJO_MUNICIPIO = "Municipio: ";

function buildStopsDatalist() {
  if (PARADA_POR_NOMBRE) return;
  const dl = document.getElementById("listaParadas");
  const entradas = Object.entries(APP.data.paradas).map(([id, p]) => ({ id, nombre: p.nombre }));
  entradas.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  const municipios = GRAFO.lista.map(m => PREFIJO_MUNICIPIO + m);
  dl.innerHTML = municipios.concat(entradas.map(n => n.nombre))
    .map(n => `<option value="${escapeHtml(n)}">`).join("");
  PARADA_POR_NOMBRE = {};
  entradas.forEach(n => { if (!(n.nombre in PARADA_POR_NOMBRE)) PARADA_POR_NOMBRE[n.nombre] = n.id; });
}

/** Interpreta lo que se ha escrito en el buscador: municipio, parada
 * exacta, o nada reconocible. */
function interpretarBusquedaExtremo(texto) {
  const limpio = String(texto || "").trim();
  if (!limpio) return null;
  if (limpio.startsWith(PREFIJO_MUNICIPIO)) {
    const nombre = limpio.slice(PREFIJO_MUNICIPIO.length).trim();
    return GRAFO.municipios.has(nombre) ? { type: "municipio", nombre } : null;
  }
  const id = PARADA_POR_NOMBRE && PARADA_POR_NOMBRE[limpio];
  if (id) return { type: "stop", id };
  const municipio = GRAFO.lista.find(m => normalize(m) === normalize(limpio));
  return municipio ? { type: "municipio", nombre: municipio } : null;
}

/** Texto que se pone en el input para un extremo ya elegido. */
function textoDeExtremo(punto) {
  if (!punto) return "";
  if (punto.type === "stop") return APP.data.paradas[punto.id].nombre;
  if (punto.type === "municipio") return PREFIJO_MUNICIPIO + punto.nombre;
  return "";
}

/** Selector de municipio a pantalla completa, para quien prefiera
 * elegir de una lista antes que escribir. */
function abrirSelectorMunicipio(which) {
  openModal(container => {
    container.innerHTML = `
      <h3 class="detail-title">${which === "origen" ? "Salgo de" : "Voy a"}</h3>
      <div class="detail-meta">Elige un municipio: valdrá cualquiera de sus paradas.</div>
      <div class="field" style="margin-top:10px;">
        <input type="text" class="input" id="filtroMunicipioModal" placeholder="Buscar municipio…">
      </div>
      <div id="listaMunicipioModal"></div>`;
    const lista = container.querySelector("#listaMunicipioModal");
    const pintar = () => {
      const texto = normalize(container.querySelector("#filtroMunicipioModal").value.trim());
      lista.innerHTML = "";
      // Quien escribe "Sevilla" quiere Sevilla, no "Nueva Sevilla
      // (Castilleja de la Cuesta)": primero lo que empieza por lo escrito.
      GRAFO.lista
        .filter(m => !texto || normalize(m).includes(texto))
        .sort((a, b) => {
          if (!texto) return 0;
          const pa = normalize(a).startsWith(texto) ? 0 : 1;
          const pb = normalize(b).startsWith(texto) ? 0 : 1;
          return pa - pb || a.localeCompare(b, "es");
        })
        .forEach(m => {
        const nodo = GRAFO.municipios.get(m);
        const row = document.createElement("div");
        row.className = "linea-row";
        row.innerHTML = `<span class="linea-row-name">${escapeHtml(m)}
          <span class="linea-row-muni">${nodo.paradas.length} paradas · ${nodo.lineas.size} línea${nodo.lineas.size === 1 ? "" : "s"}</span>
        </span>`;
        row.addEventListener("click", () => {
          setEndpoint(which, { type: "municipio", nombre: m });
          closeModal();
        });
        lista.appendChild(row);
      });
    };
    container.querySelector("#filtroMunicipioModal").addEventListener("input", pintar);
    pintar();
  });
}

function initRouteMap() {
  if (CURRENT_ROUTE_MAP) return;
  const map = L.map("routeMap", { preferCanvas: true, scrollWheelZoom: false });
  CURRENT_ROUTE_MAP = map;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  // La vista se fija ANTES de montar la capa: la capa mira el zoom para
  // decidir si agrupa por municipio, y sin vista daría por bueno el detalle
  // y crearía de golpe los marcadores de toda Andalucía.
  //
  // Se abre en el área de referencia, no en las nueve: de un extremo a otro
  // de Andalucía no se va en autobús metropolitano, y encuadrarlo entero
  // deja el sitio donde estás como un punto. Desde ahí se puede alejar.
  const cab = APP.indice && (APP.indice.consorcios || []).find(c => c.id === CTAN.id);
  if (cab && cab.bbox) {
    map.fitBounds([[cab.bbox[0], cab.bbox[1]], [cab.bbox[2], cab.bbox[3]]], { padding: [16, 16] });
  } else {
    map.setView(...vistaPorDefecto(10));
  }

  ROUTE_CAPA = crearCapaRed(map, {
    onParada: onRouteMapStopClick,
    onGrupo: onRouteMapGrupoClick
  });
  ROUTE_MARKERS = ROUTE_CAPA.marcadores;
  ROUTE_CAPA.refrescar();
  map.on("click", e => onRouteMapClick(e.latlng));
}

/** Tocar un triángulo con el modo "marcar en el mapa" armado fija ese
 * municipio como extremo de la ruta sin más rodeos; si lleva varios
 * dentro no hay nada que adivinar, así que se abre el menú para elegir. */
function onRouteMapGrupoClick(grupo, marca) {
  if (ROUTE_ARM_MODE && grupo.municipios.length === 1) {
    setEndpoint(ROUTE_ARM_MODE, { type: "municipio", nombre: grupo.municipios[0] });
    disarmClickMode();
    return;
  }
  abrirMenuGrupo(CURRENT_ROUTE_MAP, grupo, marca, ROUTE_CAPA, "ruta");
}

function onRouteMapStopClick(id) {
  if (ROUTE_ARM_MODE) {
    setEndpoint(ROUTE_ARM_MODE, { type: "stop", id });
    disarmClickMode();
    return;
  }
  openStopPopup(id);
}

/** Construye el contenido del popup de una parada: nombre, próximos
 * autobuses (agrupados por línea, cualquier recorrido) y botones para
 * marcarla/desmarcarla como origen o destino de la ruta. */
function buildStopPopupContent(id) {
  const p = APP.data.paradas[id];
  const wrap = document.createElement("div");
  wrap.className = "stop-popup";

  const titulo = document.createElement("div");
  titulo.className = "stop-popup-title";
  titulo.style.display = "flex";
  titulo.style.justifyContent = "space-between";
  titulo.style.alignItems = "baseline";
  titulo.style.gap = "8px";
  const tituloTexto = document.createElement("span");
  tituloTexto.textContent = p.nombre;
  titulo.appendChild(tituloTexto);
  const btnFav = document.createElement("button");
  btnFav.type = "button";
  btnFav.className = "btn-fav";
  pintarEstrella(btnFav, esFavoritoParada(id));
  btnFav.title = "Marcar/quitar de favoritos";
  btnFav.addEventListener("click", e => {
    e.stopPropagation();
    toggleFavoritoParada(id);
    pintarEstrella(btnFav, esFavoritoParada(id));
  });
  titulo.appendChild(btnFav);
  wrap.appendChild(titulo);

  const municipio = municipioDeParada(id);
  if (municipio) {
    const meta = document.createElement("div");
    meta.className = "stop-popup-sub";
    meta.textContent = municipio;
    wrap.appendChild(meta);
  }

  const grupos = sentidosEnParada(id, null);
  const lista = document.createElement("div");
  lista.className = "stop-popup-proximos";
  if (!grupos.length) {
    lista.innerHTML = `<span class="stop-popup-sub">${(CTAN.porParada.get(id) || []).length
      ? "Aquí terminan los recorridos que pasan: no salen autobuses."
      : "Sin datos de horario para esta parada."}</span>`;
  } else {
    grupos.slice(0, 4).forEach(g => {
      const fmt = formatDeparture(g.dep);
      const row = document.createElement("div");
      row.className = "stop-popup-line";
      row.style.cursor = "pointer";
      row.innerHTML = `<b>${escapeHtml(codigoLinea(g.lineaTitulo))} hacia ${escapeHtml(g.etiqueta)}</b><span class="stop-popup-time">${fmt.main}<span class="stop-popup-sub"> ${escapeHtml(fmt.sub)}</span></span>`;
      row.addEventListener("click", () => {
        if (CURRENT_ROUTE_MAP) CURRENT_ROUTE_MAP.closePopup();
        openLineModal(g.lineaSlug, id);
      });
      lista.appendChild(row);
    });
    if (grupos.length > 4) {
      const more = document.createElement("div");
      more.className = "stop-popup-sub";
      more.textContent = `+${grupos.length - 4} salida(s) más por esta parada`;
      lista.appendChild(more);
    }
  }
  wrap.appendChild(lista);

  if (grupos.length > 3) {
    const btnTodas = document.createElement("button");
    btnTodas.type = "button";
    btnTodas.className = "btn-chip";
    btnTodas.style.marginBottom = "8px";
    btnTodas.innerHTML = icono("lista") + `Ver las ${grupos.length} salidas`;
    btnTodas.addEventListener("click", () => {
      if (CURRENT_ROUTE_MAP) CURRENT_ROUTE_MAP.closePopup();
      openModalConHorarios(areaDeParada(id),
        container => buildStopScheduleModalContent(container, id));
    });
    wrap.appendChild(btnTodas);
  }

  const acciones = document.createElement("div");
  acciones.className = "stop-popup-actions";
  const esOrigen = ROUTE_ORIGIN && ROUTE_ORIGIN.type === "stop" && ROUTE_ORIGIN.id === id;
  const esDestino = ROUTE_DESTINO && ROUTE_DESTINO.type === "stop" && ROUTE_DESTINO.id === id;

  const btnOrigen = document.createElement("button");
  btnOrigen.type = "button";
  btnOrigen.className = "btn-chip" + (esOrigen ? " armed" : "");
  btnOrigen.innerHTML = esOrigen ? icono("cerrar") + "Quitar origen" : icono("pin") + "Marcar origen";
  btnOrigen.addEventListener("click", () => {
    if (esOrigen) clearEndpoint("origen"); else setEndpoint("origen", { type: "stop", id });
    CURRENT_ROUTE_MAP.closePopup();
  });
  acciones.appendChild(btnOrigen);

  const btnDestino = document.createElement("button");
  btnDestino.type = "button";
  btnDestino.className = "btn-chip" + (esDestino ? " armed" : "");
  btnDestino.innerHTML = esDestino ? icono("cerrar") + "Quitar destino" : icono("bandera") + "Marcar destino";
  btnDestino.addEventListener("click", () => {
    if (esDestino) clearEndpoint("destino"); else setEndpoint("destino", { type: "stop", id });
    CURRENT_ROUTE_MAP.closePopup();
  });
  acciones.appendChild(btnDestino);

  wrap.appendChild(acciones);
  return wrap;
}

function openStopPopup(id) {
  if (ROUTE_CAPA) ROUTE_CAPA.asegurarVisible(id);
  const marker = ROUTE_CAPA ? ROUTE_CAPA.marcadorDe(id) : ROUTE_MARKERS[id];
  if (!marker) return;
  // El mapa enseña las paradas de toda Andalucía, así que se puede tocar
  // una de un área cuyos horarios no estén bajados. Se abre el globo con
  // lo que se sabe y se rehace en cuanto llegan las horas.
  const idc = areaDeParada(id);
  if (idc != null && !tieneHorarios(idc)) {
    marker.bindPopup(`<div class="stop-popup"><div class="stop-popup-title">${
      escapeHtml(APP.data.paradas[id] ? APP.data.paradas[id].nombre : id)
    }</div><p class="empty">Cargando los horarios de ${escapeHtml(nombreDeArea(idc))}…</p></div>`,
      { minWidth: 230 }).openPopup();
    asegurarHorarios(idc).then(() => {
      if (marker.isPopupOpen && marker.isPopupOpen()) {
        marker.setPopupContent(buildStopPopupContent(id));
      }
    }).catch(() => {});
    return;
  }
  marker.bindPopup(buildStopPopupContent(id), { minWidth: 230 }).openPopup();
}

/** Quita el origen o destino actual (tanto si era una parada como un
 * punto marcado a mano) y su marcador del mapa. */
function clearEndpoint(which) {
  if (which === "origen") {
    ROUTE_ORIGIN = null;
    document.getElementById("origenInput").value = "";
    document.getElementById("origenStatus").textContent = "";
  } else {
    ROUTE_DESTINO = null;
    document.getElementById("destinoInput").value = "";
    document.getElementById("destinoStatus").textContent = "";
  }
  quitarMarcadorExtremo(which);
}

function onRouteMapClick(latlng) {
  if (!ROUTE_ARM_MODE) return;
  setEndpoint(ROUTE_ARM_MODE, { type: "point", lat: latlng.lat, lng: latlng.lng });
  disarmClickMode();
}

function armClickMode(which) {
  ROUTE_ARM_MODE = which;
  document.getElementById("origenPin").classList.toggle("armed", which === "origen");
  document.getElementById("destinoPin").classList.toggle("armed", which === "destino");
  const hint = document.getElementById("rutaClickHint");
  hint.style.display = "block";
  hint.textContent = `Haz clic en el mapa (o en una parada) para marcar el ${which === "origen" ? "origen" : "destino"}.`;
}

function disarmClickMode() {
  ROUTE_ARM_MODE = null;
  document.getElementById("origenPin").classList.remove("armed");
  document.getElementById("destinoPin").classList.remove("armed");
  document.getElementById("rutaClickHint").style.display = "none";
}

function describeEndpoint(point) {
  if (point.type === "stop") return `Parada: ${APP.data.paradas[point.id].nombre}`;
  if (point.type === "municipio") {
    const nodo = GRAFO.municipios.get(point.nombre);
    return `Municipio: ${point.nombre} · cualquiera de sus ${nodo ? nodo.paradas.length : 0} paradas`;
  }
  const near = nearestStop(APP.data, point.lat, point.lng);
  return near ? `Punto marcado · parada más cercana: ${APP.data.paradas[near.id].nombre} (${formatDistance(near.dist)})` : "Punto marcado";
}

function placeEndpointMarker(which, point) {
  if (!CURRENT_ROUTE_MAP) return;
  quitarMarcadorExtremo(which);

  // Un municipio no es un sitio, es una zona entera: no lleva chincheta.
  // Se señala con el aro de su PROPIO círculo, más grueso y de otro color,
  // en vez de dibujarle un anillo encima.
  if (point.type === "municipio") {
    if (ROUTE_CAPA) ROUTE_CAPA.marcarExtremo(which, point.nombre);
    return;
  }

  const latlng = coordenadasDeExtremo(APP.data, point);
  if (!latlng) return;
  const icon = L.divIcon({
    className: "",
    html: `<span class="marca-extremo ${which}">${icono(which === "origen" ? "pin" : "bandera")}</span>`,
    iconSize: [26, 26], iconAnchor: [13, 24]
  });
  const marca = L.marker(latlng, { icon, zIndexOffset: 900 }).addTo(CURRENT_ROUTE_MAP);
  if (which === "origen") ROUTE_ORIGIN_MARKER = marca;
  else ROUTE_DESTINO_MARKER = marca;
}

/** Borra la señal del extremo, sea la chincheta o el aro del municipio. */
function quitarMarcadorExtremo(which) {
  if (ROUTE_CAPA) ROUTE_CAPA.marcarExtremo(which, null);
  if (!CURRENT_ROUTE_MAP) return;
  if (which === "origen") {
    if (ROUTE_ORIGIN_MARKER) { CURRENT_ROUTE_MAP.removeLayer(ROUTE_ORIGIN_MARKER); ROUTE_ORIGIN_MARKER = null; }
  } else if (ROUTE_DESTINO_MARKER) {
    CURRENT_ROUTE_MAP.removeLayer(ROUTE_DESTINO_MARKER); ROUTE_DESTINO_MARKER = null;
  }
}

function setEndpoint(which, point) {
  const label = describeEndpoint(point);
  if (which === "origen") {
    ROUTE_ORIGIN = point;
    document.getElementById("origenInput").value = textoDeExtremo(point);
    document.getElementById("origenStatus").textContent = label;
  } else {
    ROUTE_DESTINO = point;
    document.getElementById("destinoInput").value = textoDeExtremo(point);
    document.getElementById("destinoStatus").textContent = label;
  }
  placeEndpointMarker(which, point);
}

function wireEndpointInput(inputId, which) {
  document.getElementById(inputId).addEventListener("change", e => {
    const texto = e.target.value.trim();
    if (!texto) return;
    const punto = interpretarBusquedaExtremo(texto);
    if (punto) {
      setEndpoint(which, punto);
    } else {
      document.getElementById(which + "Status").textContent =
        "No se reconoce; elige una parada o un municipio de la lista.";
    }
  });
}

function wireGeoButton(btnId, which) {
  document.getElementById(btnId).addEventListener("click", () => {
    const statusEl = document.getElementById(which + "Status");
    if (!navigator.geolocation) {
      statusEl.textContent = "Tu navegador no soporta geolocalización.";
      return;
    }
    statusEl.textContent = "Obteniendo tu posición…";
    navigator.geolocation.getCurrentPosition(
      pos => setEndpoint(which, { type: "point", lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => { statusEl.textContent = "No se pudo obtener tu posición: " + err.message; },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

function clearRoutePathLayers() {
  if (!CURRENT_ROUTE_MAP) return;
  ROUTE_PATH_LAYERS.forEach(l => CURRENT_ROUTE_MAP.removeLayer(l));
  ROUTE_PATH_LAYERS = [];
}

/** El trozo del trazado real que va de una parada a otra dentro de un
 * bloque.
 *
 * El GTFS trae en shapes.txt por dónde va la carretera, así que el mapa
 * deja de unir paradas con una recta que se metía por encima de las casas.
 * Para recortar el trazado se busca el punto más cercano a cada parada y
 * se corta por ahí: es aproximado, pero el error es de metros y el dibujo
 * sigue la calle.
 *
 * Si el bloque no tiene trazado se cae a la línea recta de antes, que es
 * lo que había y no es peor que nada. */
function trazadoEntre(bloque, desdePos, hastaPos) {
  const puntos = bloque && bloque.trazado ? CTAN.trazados[bloque.trazado] : null;
  const paradas = bloque ? bloque.paradas : [];
  const recta = () => paradas.slice(desdePos, hastaPos + 1)
    .map(id => CTAN.paradas[id])
    .filter(p => p && p.lat != null)
    .map(p => [p.lat, p.lng]);
  if (!puntos || puntos.length < 2) return recta();

  const masCercano = paradaId => {
    const p = CTAN.paradas[paradaId];
    if (!p || p.lat == null) return null;
    let mejor = 0, mejorD = Infinity;
    for (let i = 0; i < puntos.length; i++) {
      const d = (puntos[i][0] - p.lat) ** 2 + (puntos[i][1] - p.lng) ** 2;
      if (d < mejorD) { mejorD = d; mejor = i; }
    }
    return mejor;
  };
  const a = masCercano(paradas[desdePos]);
  const b = masCercano(paradas[hastaPos]);
  if (a == null || b == null) return recta();
  const tramo = a <= b ? puntos.slice(a, b + 1) : puntos.slice(b, a + 1).reverse();
  return tramo.length >= 2 ? tramo : recta();
}

/** El bloque concreto que sirve un tramo de la ruta, para poder pintar su
 * trazado. */
function bloqueDeTramo(leg) {
  if (!leg.paradasRuta || leg.paradasRuta.length < 2) return null;
  const candidatos = CTAN.porParada.get(leg.origen) || [];
  for (const { bloque, pos } of candidatos) {
    if (bloque.lineaSlug !== leg.lineaSlug) continue;
    const fin = pos + leg.paradasRuta.length - 1;
    if (fin < bloque.paradas.length &&
        bloque.paradas[fin] === leg.paradasRuta[leg.paradasRuta.length - 1]) {
      return { bloque, desdePos: pos, hastaPos: fin };
    }
  }
  return null;
}

function drawRouteOnMap(res) {
  if (!CURRENT_ROUTE_MAP) return;
  clearRoutePathLayers();
  const bounds = [];
  res.legs.forEach(leg => {
    if (leg.tipo === "bus") {
      // El trazado real del GTFS, recortado al tramo que se coge. Antes
      // esto unía las paradas intermedias con rectas; ahora sigue la
      // carretera.
      const tramo = bloqueDeTramo(leg);
      const puntos = tramo
        ? trazadoEntre(tramo.bloque, tramo.desdePos, tramo.hastaPos)
        : (leg.paradasRuta || [leg.origen, leg.destino])
            .map(id => CTAN.paradas[id])
            .filter(p => p && p.lat != null)
            .map(p => [p.lat, p.lng]);
      if (puntos.length < 2) return;
      const line = L.polyline(puntos, { color: colorTema("brand"), weight: 5, opacity: 0.95 }).addTo(CURRENT_ROUTE_MAP);
      ROUTE_PATH_LAYERS.push(line);
      puntos.forEach(pt => bounds.push(pt));
      return;
    }

    let latlngA = null, latlngB = null;
    if (leg.tipo === "walk") {
      const a = APP.data.paradas[leg.origen], b = APP.data.paradas[leg.destino];
      if (a && a.lat != null) latlngA = [a.lat, a.lng];
      if (b && b.lat != null) latlngB = [b.lat, b.lng];
    } else if (leg.tipo === "walk_inicio") {
      latlngA = ROUTE_ORIGIN.type === "point" ? [ROUTE_ORIGIN.lat, ROUTE_ORIGIN.lng] : null;
      const b = APP.data.paradas[leg.destino];
      if (b && b.lat != null) latlngB = [b.lat, b.lng];
    } else if (leg.tipo === "walk_fin") {
      const a = APP.data.paradas[leg.origen];
      if (a && a.lat != null) latlngA = [a.lat, a.lng];
      latlngB = ROUTE_DESTINO.type === "point" ? [ROUTE_DESTINO.lat, ROUTE_DESTINO.lng] : null;
    } else if (leg.tipo === "walk_todo") {
      // Sin ninguna parada de por medio: del origen al destino tal cual
      // se resolvieron, sea parada, municipio o punto marcado.
      latlngA = coordenadasDeExtremo(APP.data, ROUTE_ORIGIN);
      latlngB = coordenadasDeExtremo(APP.data, ROUTE_DESTINO);
    }
    if (!latlngA || !latlngB) return;
    const line = L.polyline([latlngA, latlngB], {
      color: colorTema("coral"), weight: 3, opacity: 0.9, dashArray: "2 8"
    }).addTo(CURRENT_ROUTE_MAP);
    ROUTE_PATH_LAYERS.push(line);
    bounds.push(latlngA, latlngB);
  });
  if (bounds.length) CURRENT_ROUTE_MAP.fitBounds(bounds, { padding: [30, 30] });
}

/** Etiqueta corta de una opción: las líneas que se cogen y cuántos
 * trasbordos salen. Es lo que decide de un vistazo, más que la hora. */
function etiquetaOpcion(res) {
  const codigos = res.lineas.map(slug => {
    const linea = APP.data.lineas.find(l => l.slug === slug);
    return codigoLinea(linea ? linea.titulo : slug);
  }).filter((c, i, todos) => i === 0 || c !== todos[i - 1]); // dos buses seguidos
                                                            // de la misma línea se
                                                            // nombran una vez
  const cuenta = res.numTrasbordos === 0
    ? "directo"
    : `${res.numTrasbordos} trasbordo${res.numTrasbordos === 1 ? "" : "s"}`;
  const enBici = (res.totalPedaleandoMin || 0) > 0;
  return { cuenta, codigos: codigos.length ? codigos : [enBici ? "en bici" : "a pie"] };
}

/** Las opciones disponibles, en fila y ordenadas por trasbordos: la
 * primera (la de menos trasbordos) es la que se muestra por defecto. */
function renderOpcionesRuta(contenedor, opciones, salidaDate, directo) {
  contenedor.innerHTML = "";
  if (opciones.length < 2) return;
  const caja = document.createElement("div");
  caja.className = "card";
  caja.innerHTML = '<div class="selector-titulo">Opciones disponibles</div>';
  const fila = document.createElement("div");
  fila.className = "opciones-row";
  opciones.forEach((op, i) => {
    const { cuenta, codigos } = etiquetaOpcion(op);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opcion-pill" + (i === RUTA_OPCION_ACTIVA ? " active" : "");
    // Una opción se elige por las tres cosas a la vez: qué líneas coges,
    // cuándo sales y cuándo llegas. Con solo la hora de llegada no se
    // pueden comparar: la que llega antes puede salir mucho después.
    btn.innerHTML = `<span class="opcion-lineas">${codigos.map(c => `<span class="linea-badge">${escapeHtml(c)}</span>`).join('<span class="opcion-mas">+</span>')}</span>
      <span class="opcion-meta">${escapeHtml(fmtHoraAbs(op.salidaMin))} → ${escapeHtml(fmtHoraAbs(op.diasSalida * 1440 + op.llegadaMin))} · ${escapeHtml(cuenta)}</span>`;
    btn.addEventListener("click", () => {
      RUTA_OPCION_ACTIVA = i;
      renderRutaResultado(opciones[i], salidaDate, directo, opciones);
    });
    fila.appendChild(btn);
  });
  caja.appendChild(fila);
  contenedor.appendChild(caja);
}

/** Hacia dónde va el autobús en el tramo que se toma: el municipio donde
 * te bajas, o el nombre de la parada si no cambias de municipio. Es lo
 * que hace falta leer en el poste para saber si ese bus es el tuyo. */
function haciaDondeVaTramo(leg) {
  const muniOrigen = municipioDeParada(leg.origen);
  const muniDestino = municipioDeParada(leg.destino);
  if (muniDestino && muniDestino !== muniOrigen) return muniDestino;
  const p = APP.data.paradas[leg.destino];
  return p ? p.nombre : leg.destino;
}

/** Convierte los tramos del cálculo en la secuencia que se dibuja: un
 * "hito" por sitio donde pasa algo (subes, bajas, esperas) y un "tramo"
 * por lo que haces entre hito e hito.
 *
 * La gracia está en fundir dos hitos seguidos del mismo sitio: cuando
 * haces trasbordo sin moverte de parada, no son dos puntos del recorrido
 * sino uno con dos horas — llegas a y sales a —, y la diferencia entre
 * ambas es la espera. Antes esa espera no se enseñaba en ningún sitio:
 * el renglón de "espera N min" solo se pintaba tras un tramo a pie, así
 * que en el caso más común (cambiar de línea en la misma parada) el dato
 * que más importa del trasbordo era justo el que faltaba. */
function construirFilasItinerario(res) {
  const filas = [];
  const ultimoHito = () => {
    const ultimo = filas[filas.length - 1];
    return ultimo && ultimo.tipo === "hito" ? ultimo : null;
  };
  const hito = (clave, campos) => {
    const abierto = ultimoHito();
    if (abierto && abierto.clave === clave) { Object.assign(abierto, campos); return; }
    filas.push({ tipo: "hito", clave, ...campos });
  };

  res.legs.forEach(leg => {
    if (leg.tipo === "bus") {
      hito(leg.origen, { paradaId: leg.origen, salida: leg.salida });
      filas.push({ tipo: "tramo", clase: "bus", leg });
      hito(leg.destino, { paradaId: leg.destino, llegada: leg.llegada });
    } else if (leg.tipo === "walk_inicio") {
      hito("_partida_", { partida: true, salida: leg.salida });
      filas.push({ tipo: "tramo", clase: "andando", leg });
      hito(leg.destino, { paradaId: leg.destino, llegada: leg.llegada });
    } else if (leg.tipo === "walk") {
      hito(leg.origen, { paradaId: leg.origen, llegada: leg.salida });
      filas.push({ tipo: "tramo", clase: "andando", leg });
      hito(leg.destino, { paradaId: leg.destino, llegada: leg.llegada });
    } else if (leg.tipo === "walk_fin") {
      hito(leg.origen, { paradaId: leg.origen, llegada: leg.salida });
      filas.push({ tipo: "tramo", clase: "andando", leg });
      hito("_destino_", { destinoFinal: true, llegada: leg.llegada });
    } else if (leg.tipo === "walk_todo") {
      // La opción "ir directo": ni una parada de por medio, del punto de
      // partida al destino en línea recta.
      hito("_partida_", { partida: true, salida: leg.salida });
      filas.push({ tipo: "tramo", clase: "andando", leg });
      hito("_destino_", { destinoFinal: true, llegada: leg.llegada });
    }
  });
  return filas;
}

function itinerarioHtml(res) {
  const filas = construirFilasItinerario(res);
  return filas.map((fila, i) => {
    const clases = ["itin-fila"];
    if (i === 0) clases.push("primera");
    if (i === filas.length - 1) clases.push("ultima");

    if (fila.tipo === "hito") {
      clases.push("extremo");
      const p = fila.paradaId ? APP.data.paradas[fila.paradaId] : null;
      const nombre = fila.partida ? "Tu punto de partida"
        : fila.destinoFinal ? "Tu destino"
        : (p ? p.nombre : fila.paradaId);
      const municipio = fila.paradaId ? municipioDeParada(fila.paradaId) : null;
      const esperaMin = (fila.llegada != null && fila.salida != null) ? fila.salida - fila.llegada : 0;
      const horas = fila.llegada != null && fila.salida != null && esperaMin > 0
        ? `${fmtHoraAbs(fila.llegada)}<span class="segunda">${fmtHoraAbs(fila.salida)}</span>`
        : fmtHoraAbs(fila.salida != null ? fila.salida : fila.llegada);
      return `<div class="${clases.join(" ")}">
        <div class="itin-hora">${horas}</div>
        <div class="itin-espina"><div class="itin-punto"></div></div>
        <div class="itin-hito">
          <div class="itin-parada${fila.paradaId ? " pulsable" : ""}"${fila.paradaId ? ` data-stop-id="${escapeHtml(fila.paradaId)}"` : ""}>${escapeHtml(nombre)}</div>
          ${municipio ? `<div class="itin-muni">${escapeHtml(municipio)}</div>` : ""}
          ${esperaMin > 0 ? `<div class="itin-espera">${icono("reloj")}${esperaMin} min de espera</div>` : ""}
        </div>
      </div>`;
    }

    const leg = fila.leg;
    if (fila.clase === "andando") {
      clases.push("andando");
      const distM = leg.distMetros != null
        ? Math.round(leg.distMetros)
        : (APP.data.paradas[leg.origen] && APP.data.paradas[leg.destino]
            ? Math.round(haversine(APP.data.paradas[leg.origen].lat, APP.data.paradas[leg.origen].lng,
                                   APP.data.paradas[leg.destino].lat, APP.data.paradas[leg.destino].lng))
            : null);
      const enBici = leg.modo === "bici";
      const verbo = enBici ? "Pedalea" : "Camina";
      return `<div class="${clases.join(" ")}">
        <div class="itin-hora"></div>
        <div class="itin-espina"></div>
        <div class="itin-tramo"><div class="itin-andando">${icono(enBici ? "bici" : "andar")}${verbo}${distM != null ? ` ${distM} m` : ""} · ${leg.llegada - leg.salida} min</div></div>
      </div>`;
    }

    const linea = APP.data.lineas.find(l => l.slug === leg.lineaSlug);
    const titulo = linea ? linea.titulo : leg.lineaSlug;
    const intermedias = (leg.paradasRuta || []).slice(1, -1);
    const nParadas = (leg.paradasRuta || [leg.origen, leg.destino]).length - 1;
    const listaHtml = intermedias.length
      ? `<ul class="itin-intermedias" hidden>${intermedias.map(id => {
          const p = APP.data.paradas[id];
          return `<li data-stop-id="${escapeHtml(id)}">${escapeHtml(p ? p.nombre : id)}</li>`;
        }).join("")}</ul>`
      : "";
    return `<div class="${clases.join(" ")}">
      <div class="itin-hora"></div>
      <div class="itin-espina"></div>
      <div class="itin-tramo">
        <button type="button" class="itin-tramo-cab" data-linea="${escapeHtml(leg.lineaSlug)}" data-stop="${escapeHtml(leg.origen)}">
          <span class="linea-badge">${escapeHtml(codigoLinea(titulo))}</span>
          <span class="itin-hacia">hacia ${escapeHtml(haciaDondeVaTramo(leg))}</span>
        </button>
        <button type="button" class="itin-tramo-pie"${intermedias.length ? ' aria-expanded="false"' : ""}>
          ${nParadas} parada${nParadas === 1 ? "" : "s"} · ${leg.llegada - leg.salida} min${intermedias.length ? ' ' + icono("abajo") : ""}
        </button>
        ${listaHtml}
      </div>
    </div>`;
  }).join("");
}

function renderRutaResultado(res, salidaDate, directo, opciones) {
  const box = document.getElementById("rutaResultado");
  const cajaOpciones = document.getElementById("rutaOpciones");
  const salidaMin = salidaDate.getHours() * 60 + salidaDate.getMinutes();
  if (cajaOpciones) renderOpcionesRuta(cajaOpciones, opciones || [], salidaDate, directo);

  if (!res) {
    clearRoutePathLayers();
    const avisoDirecto = directo
      ? `<p class="empty">Caminando en línea recta serían ${Math.round(directo.distMetros)} m (~${directo.minutos} min).</p>`
      : "";
    const motivo = RUTA_SIN_RESULTADO || "No se ha encontrado ninguna ruta en autobús.";
    box.innerHTML = `<div class="card"><p class="empty">${escapeHtml(motivo)}</p>${avisoDirecto}</div>`;
    return;
  }

  const tFinalAbs = res.diasSalida * 1440 + res.llegadaMin;
  const fmtDur = m => { const h = Math.floor(m / 60), mm = Math.round(m % 60); return (h > 0 ? h + "h " : "") + mm + "min"; };
  const primerBus = res.legs.find(l => l.tipo === "bus");
  // La hora de salida del encabezado es la del primer renglón del
  // itinerario: si hay que caminar antes de coger nada, sales de casa
  // cuando empieza el paseo, no cuando arranca el autobús.
  const salidaRealMin = res.legs.length ? res.legs[0].salida : salidaMin;
  const esperaInicialMin = primerBus ? primerBus.salida - Math.max(salidaMin, salidaRealMin) : 0;
  const totalTransporteMin = tFinalAbs - salidaMin;

  const tags = [];
  const enCuanto = salidaRealMin - salidaMin;
  if (enCuanto > 0) tags.push(`<span class="itin-tag${enCuanto <= 10 ? " ya" : ""}">Sal en ${fmtDur(enCuanto)}</span>`);
  else tags.push(`<span class="itin-tag ya">Sal ya</span>`);
  // "0 trasbordos" suena a autobús directo; una opción sin autobús ninguno
  // se dice mejor con lo que de verdad es — a pie o en bici— y de cuánto.
  if (res.lineas.length > 0) {
    tags.push(`<span class="itin-tag">${res.numTrasbordos} trasbordo${res.numTrasbordos === 1 ? "" : "s"}</span>`);
    if (res.totalCaminandoMin > 0) tags.push(`<span class="itin-tag">${Math.round(res.totalCaminandoMin)} min a pie</span>`);
    if (res.totalPedaleandoMin > 0) tags.push(`<span class="itin-tag">${Math.round(res.totalPedaleandoMin)} min en bici</span>`);
  } else {
    tags.push(`<span class="itin-tag">${res.totalPedaleandoMin > 0 ? "todo en bici" : "todo a pie"}</span>`);
  }

  // Con un municipio como extremo, la parada concreta la elige el
  // buscador: hay que decir cuál, o el itinerario no se puede seguir.
  // Ninguna de las dos dice nada útil cuando la opción activa YA es ir
  // directo: no hay parada intermedia que anunciar, y comparar el paseo
  // consigo mismo no informa de nada.
  const esDirecta = res.lineas.length === 0;

  let extremosHtml = "";
  if (!esDirecta && (ROUTE_ORIGIN.type === "municipio" || ROUTE_DESTINO.type === "municipio")) {
    const pO = APP.data.paradas[res.origenStopId], pD = APP.data.paradas[res.destinoStopId];
    extremosHtml = `<div class="itin-extremos">Sale de <b>${escapeHtml(pO ? pO.nombre : "?")}</b> y llega a <b>${escapeHtml(pD ? pD.nombre : "?")}</b></div>`;
  }

  let avisoCaminar = "";
  if (!esDirecta && directo && directo.minutos < totalTransporteMin) {
    avisoCaminar = `<div class="itin-leg-warn">${icono("aviso")}<span>Ir caminando en línea recta (${Math.round(directo.distMetros)} m) tardaría solo ${fmtDur(directo.minutos)} — menos que esta ruta, que incluye ${fmtDur(esperaInicialMin)} de espera.</span></div>`;
  }

  const puedeGuardar = ROUTE_ORIGIN && ROUTE_DESTINO && ROUTE_ORIGIN.type === "stop" && ROUTE_DESTINO.type === "stop";
  const favBtnHtml = puedeGuardar
    ? `<button type="button" class="btn-chip${esFavoritoRuta(ROUTE_ORIGIN.id, ROUTE_DESTINO.id) ? " armed" : ""}" id="btnFavRuta" style="margin-top:12px;">${icono("estrella")}${esFavoritoRuta(ROUTE_ORIGIN.id, ROUTE_DESTINO.id) ? "Guardada" : "Guardar esta ruta"}</button>`
    : "";

  box.innerHTML = `
    <div class="card">
      <div class="itin-horas">
        <span>${fmtHoraAbs(salidaRealMin)}</span>
        <span class="flecha">→</span>
        <span class="llegada">${fmtHoraAbs(tFinalAbs)}</span>
      </div>
      <div class="itin-dur"><b>${fmtDur(tFinalAbs - salidaRealMin)}</b> de principio a fin${esperaInicialMin > 0 ? ` · el autobús sale ${fmtDur(esperaInicialMin)} después` : ""}</div>
      <div class="itin-tags">${tags.join("")}</div>
      ${extremosHtml}${avisoCaminar}${favBtnHtml}
    </div>
    <div class="card"><div class="itin">${itinerarioHtml(res)}</div></div>`;

  box.querySelectorAll(".itin-tramo-cab").forEach(btn => {
    btn.addEventListener("click", () => openLineModal(btn.dataset.linea, btn.dataset.stop));
  });
  box.querySelectorAll(".itin-tramo-pie[aria-expanded]").forEach(btn => {
    btn.addEventListener("click", () => {
      const lista = btn.parentNode.querySelector(".itin-intermedias");
      const abierto = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", abierto ? "false" : "true");
      if (lista) lista.hidden = abierto;
    });
  });
  box.querySelectorAll("[data-stop-id]").forEach(el => {
    el.addEventListener("click", () => openModalConHorarios(areaDeParada(el.dataset.stopId),
      container => buildStopScheduleModalContent(container, el.dataset.stopId)));
  });
  if (puedeGuardar) {
    box.querySelector("#btnFavRuta").addEventListener("click", e => {
      toggleFavoritoRuta(ROUTE_ORIGIN.id, ROUTE_DESTINO.id);
      const guardada = esFavoritoRuta(ROUTE_ORIGIN.id, ROUTE_DESTINO.id);
      e.currentTarget.innerHTML = icono("estrella") + (guardada ? "Guardada" : "Guardar esta ruta");
      e.currentTarget.classList.toggle("armed", guardada);
    });
  }

  drawRouteOnMap(res);
}

/** Distancia/tiempo en línea recta directamente entre origen y destino,
 * sin pasar por transporte público — a pie, o en bicicleta al doble de
 * velocidad. Un municipio se mide desde el centro de su núcleo (el mismo
 * punto que usa el buscador de itinerarios para "voy a tal pueblo"), así
 * que sirve igual para dos paradas concretas que para dos municipios
 * enteros. Sirve para avisar cuando la ruta en autobús calculada (con
 * esperas incluidas) sale más lenta que ir directo, y para ofrecerlo
 * como una opción más cuando de verdad compite. */
function distanciaDirecta(appData, origin, destino, modo) {
  const latlngA = coordenadasDeExtremo(appData, origin);
  const latlngB = coordenadasDeExtremo(appData, destino);
  if (!latlngA || !latlngB) return null;
  const distMetros = haversine(latlngA[0], latlngA[1], latlngB[0], latlngB[1]);
  const esBici = modo === "bici";
  return { distMetros, minutos: esBici ? bikeMinutes(distMetros) : walkMinutes(distMetros), modo: esBici ? "bici" : "pie" };
}

async function onCalcularRuta() {
  const resultBox = document.getElementById("rutaResultado");
  const cajaOpciones = document.getElementById("rutaOpciones");
  if (!ROUTE_ORIGIN || !ROUTE_DESTINO) {
    resultBox.innerHTML = '<div class="card"><p class="empty">Elige un origen y un destino primero.</p></div>';
    if (cajaOpciones) cajaOpciones.innerHTML = "";
    return;
  }
  const faltan = areasDeExtremo(ROUTE_ORIGIN).concat(areasDeExtremo(ROUTE_DESTINO))
    .filter(idc => !tieneHorarios(idc));
  resultBox.innerHTML = `<div class="card"><p class="empty">${faltan.length
    ? "Cargando los horarios de " + escapeHtml(nombreDeArea(faltan[0])) + "…"
    : "Calculando ruta…"}</p></div>`;
  if (faltan.length) {
    try {
      await asegurarHorarios(faltan);
    } catch (e) {
      resultBox.innerHTML = '<div class="card"><p class="empty">No se han podido cargar los horarios. Comprueba la conexión.</p></div>';
      return;
    }
    resultBox.innerHTML = '<div class="card"><p class="empty">Calculando ruta…</p></div>';
  }
  const horaInput = document.getElementById("horaSalida").value;
  const salida = horaInput ? new Date(horaInput) : new Date();
  const directo = distanciaDirecta(APP.data, ROUTE_ORIGIN, ROUTE_DESTINO, "pie");

  RUTA_OPCIONES = calcularOpcionesRuta(APP.data, ROUTING, ROUTE_ORIGIN, ROUTE_DESTINO, salida);

  // Ir directo —a pie, o en bici si se ha activado— se ofrece como una
  // opción más, no sólo como un aviso al pie de la ruta en autobús: a
  // veces es la única manera (dos áreas sin conectar, un pueblo que sólo
  // enlaza con muchos trasbordos) y a veces sencillamente compite. Va
  // DETRÁS de las de autobús, así que nunca roba el puesto por defecto a
  // una ruta en transporte público que sí exista.
  [directo, MODO_BICI ? distanciaDirecta(APP.data, ROUTE_ORIGIN, ROUTE_DESTINO, "bici") : null]
    .forEach(d => {
      if (d && d.minutos <= UMBRAL_MIN_DIRECTO) RUTA_OPCIONES.push(construirOpcionDirecta(d, salida));
    });

  RUTA_OPCION_ACTIVA = 0;
  renderRutaResultado(RUTA_OPCIONES[0] || null, salida, directo, RUTA_OPCIONES);
}

/** Una opción "ir directo": sin autobús, sólo el paseo o el pedaleo en
 * línea recta de un extremo al otro. Con la misma forma que cualquier
 * itinerario en autobús, para que encaje en el selector de opciones, el
 * dibujo del mapa y la ficha del itinerario sin código aparte. */
function construirOpcionDirecta(directo, salidaDate) {
  const salidaMin = salidaDate.getHours() * 60 + salidaDate.getMinutes();
  const llegadaAbs = salidaMin + directo.minutos;
  const diasSalida = Math.floor(llegadaAbs / 1440);
  const leg = {
    tipo: "walk_todo", modo: directo.modo, distMetros: directo.distMetros,
    salida: salidaMin, llegada: llegadaAbs
  };
  return {
    legs: [leg],
    llegadaMin: llegadaAbs - diasSalida * 1440,
    diasSalida,
    origenStopId: null,
    destinoStopId: null,
    totalCaminandoMin: directo.modo === "bici" ? 0 : directo.minutos,
    totalPedaleandoMin: directo.modo === "bici" ? directo.minutos : 0,
    numTrasbordos: 0,
    lineas: [],
    salidaMin
  };
}

function nowForDatetimeLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

}

/* ------------------------------------------------------------------ */
/* Pestañas                                                             */
/* ------------------------------------------------------------------ */
/* ------------------------------------------------------------------ */
/* Pestaña "Mis favoritos"                                             */
/* ------------------------------------------------------------------ */
/** Hasta `limite` salidas de una parada, una por línea Y sentido,
 * poniendo SIEMPRE primero las líneas favoritas y, dentro de cada grupo,
 * las de salida más próxima.
 *
 * Se separa por sentido porque una misma línea suele pasar por la misma
 * parada en las dos direcciones, y "el próximo autobús de la M-177" no
 * significa nada si no dices hacia dónde. Dentro de cada sentido, en
 * cambio, se fusionan todos los recorridos: da igual que ese autobús
 * concreto haya salido de Torre de la Reina o de Guillena. */
function lineasEnParadaPriorizadas(paradaId, limite) {
  limite = limite || 3;
  const grupos = sentidosEnParada(paradaId, null).map(g => ({
    linea_slug: g.lineaSlug,
    linea_titulo: g.lineaTitulo,
    sentidoClave: g.sentidoClave,
    dep: g.dep,
    direccion: "hacia " + g.etiqueta,
    favorita: esFavoritoLinea(g.lineaSlug)
  }));
  grupos.sort((a, b) => {
    if (a.favorita !== b.favorita) return a.favorita ? -1 : 1;
    const av = a.dep ? a.dep.dias * 1440 + a.dep.h * 60 + a.dep.m : Infinity;
    const bv = b.dep ? b.dep.dias * 1440 + b.dep.h * 60 + b.dep.m : Infinity;
    return av - bv;
  });
  return { mostradas: grupos.slice(0, limite), total: grupos.length };
}

/** Devuelve el resultado calculado para una ruta favorita, reutilizando
 * el que ya había en caché si el próximo autobús que ofrecía sigue sin
 * haber salido todavía (con 1 minuto de margen). Solo se relanza el
 * cálculo cuando ese autobús concreto ya ha debido salir — así, entrar y
 * salir de la pestaña de favoritos varias veces seguidas no recalcula
 * nada de más. */
function getOrRecalcularFavoritoRuta(fav) {
  const ahora = new Date();
  if (fav.cache && typeof fav.cache.proximaSalidaTs === "number" && ahora.getTime() < fav.cache.proximaSalidaTs + 60000) {
    return fav.cache.resultado;
  }
  const res = computeRoute(APP.data, ROUTING, { type: "stop", id: fav.origenId }, { type: "stop", id: fav.destinoId }, ahora);
  if (res) {
    const primerBus = res.legs.find(l => l.tipo === "bus");
    const midnightBase = new Date(ahora);
    midnightBase.setHours(0, 0, 0, 0);
    const proximaSalidaTs = primerBus ? midnightBase.getTime() + primerBus.salida * 60000 : ahora.getTime() + 60000;
    fav.cache = { resultado: res, proximaSalidaTs };
  } else {
    fav.cache = null;
  }
  guardarFavoritos();
  return res;
}

/* ------------------------------------------------------------------ */
/* Área de referencia                                                   */
/* ------------------------------------------------------------------ */
/** Las nueve áreas están siempre disponibles: el catálogo entero se carga
 * al arrancar, todas las paradas dentro de un radio de la ubicación se
 * bajan solas, y cualquier parada o línea que se abra o cualquier ruta
 * que se calcule trae las suyas si hacían falta. No hay pantalla ni botón
 * para "elegir área": la aplicación decide qué necesita y lo pide.
 *
 * El "área de referencia" no limita nada, sólo dice desde dónde se está
 * mirando: de qué consorcio son los avisos que se precargan, qué
 * encuadre abre el mapa y qué fecha de datos se cita en el pie. Se
 * adivina por la ubicación (o por la última con la que se abrió, hasta
 * que la ubicación diga otra cosa) y no se puede tocar a mano. */
function consorcioGuardado() {
  const guardado = leerCache(LS_CONSORCIO);
  return guardado && guardado.id ? guardado.id : null;
}

function distanciaABbox(lat, lng, bbox) {
  if (!bbox) return Infinity;
  const [minLat, minLng, maxLat, maxLng] = bbox;
  const dLat = lat < minLat ? minLat - lat : lat > maxLat ? lat - maxLat : 0;
  const dLng = lng < minLng ? minLng - lng : lng > maxLng ? lng - maxLng : 0;
  return Math.hypot(dLat * 111320, dLng * 111320 * Math.cos(lat * Math.PI / 180));
}

/** Fija el área de referencia y baja sus horarios. No hay pantalla de
 * bienvenida que obligue a elegir: se coge la del último uso y, si
 * tampoco hay, la primera del índice hasta que la ubicación diga otra
 * cosa. */
async function activarConsorcio(idc) {
  const cab = (APP.indice.consorcios || []).find(c => c.id === idc);
  CTAN.id = idc;
  CTAN.nombre = cab ? cab.nombre : null;
  CTAN.codigo = cab ? cab.codigo : null;
  guardarCache(LS_CONSORCIO, { id: idc });
  pintarPie();
  await asegurarHorarios(idc);
}

/** El aviso legal de la API obliga a citar la fuente con esta fórmula, a
 * decir de cuándo son los datos y a no dar a entender que la Junta ni los
 * Consorcios están detrás de esto. */
function pintarPie() {
  const pie = document.getElementById("pie");
  if (!pie) return;
  const fecha = CTAN.generado || (APP.indice && APP.indice.generado) || "";
  pie.innerHTML = `Información proporcionada por el Portal de Datos Abiertos de la
    Red de Consorcios de Transporte de Andalucía${fecha ? ` · datos de ${escapeHtml(fecha)}` : ""}.
    Horarios programados, no tiempo real.<br>
    Herramienta personal sin relación con la Red de Consorcios ni con la Junta de Andalucía.`;
}

/** Tras cambiar de área de referencia se repinta lo que dependía de ella.
 * Los avisos son de otro consorcio, así que se tiran y se vuelven a pedir:
 * dejar los de antes en pantalla sería enseñar cortes de otra provincia. */
function repintarTrasCambioDeArea() {
  AVISOS = { lista: [], fecha: null, cargando: false };
  actualizarChapaAvisos(0);
  buildMunicipioOptions();
  renderHomeFavSalidas();
  renderQuickFavs();
  renderLineasFavoritas();
  renderListadoLineas();
  cargarAvisos(false).then(() => {
    actualizarChapaAvisos(avisosOrdenados().mios.length);
    const pantalla = document.getElementById("screenAvisos");
    if (pantalla && pantalla.classList.contains("active")) renderAvisos();
  });
}

/** Cuando el cambio lo ha pedido la persona desde la cabecera, además se
 * vuelve a Inicio: es la pantalla desde la que se cambió. */
function renderTodoTrasCambio() {
  repintarTrasCambioDeArea();
